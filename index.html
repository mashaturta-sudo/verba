\u0442\u0438\u0432\u043d\u043e\u0457 \u0440\u043e\u043b\u044c\u043e\u0432\u043e\u0457 \u0441\u0438\u0442\u0443\u0430\u0446\u0456\u0457 \u2014 \u043f\u0435\u0440\u0435\u0441\u043b\u0456\u0434\u0443\u0432\u0430\u043d\u043d\u044f, \u0431\u043e\u044e, \u0432\u0438\u043a\u0440\u0430\u0434\u0435\u043d\u043d\u044f, \u0430\u0440\u0435\u0448\u0442\u0443 \u0430\u0431\u043e \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u0457 \u0456\u043d\u0448\u043e\u0457 \u0432\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u0457, \u0449\u043e \u0449\u0435 \u043d\u0435 \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u0430.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.3\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e \u043f\u0435\u0440\u0435\u0445\u043e\u0434\u0438\u0442\u0438 \u0432 AFK \u0437 \u043c\u0435\u0442\u043e\u044e \u0443\u043d\u0438\u043a\u043d\u0435\u043d\u043d\u044f \u0441\u043c\u0435\u0440\u0442\u0456, \u0430\u0440\u0435\u0448\u0442\u0443, \u0432\u0438\u043a\u0440\u0430\u0434\u0435\u043d\u043d\u044f \u0430\u0431\u043e \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u0457 \u0456\u043d\u0448\u043e\u0457 RP-\u0441\u0438\u0442\u0443\u0430\u0446\u0456\u0457.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.4\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f DM (Death Match) \u2014 \u0437\u0430\u0432\u0434\u0430\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u0430\u0431\u043e \u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u0456\u043d\u0448\u043e\u0433\u043e \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436\u0430 \u0431\u0435\u0437 \u043e\u0431\u0491\u0440\u0443\u043d\u0442\u043e\u0432\u0430\u043d\u043e\u0457 IC-\u043f\u0440\u0438\u0447\u0438\u043d\u0438.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.5\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f Mass DM \u2014 \u0437\u0430\u0432\u0434\u0430\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u0430\u0431\u043e \u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u0442\u0440\u044c\u043e\u0445 \u0456 \u0431\u0456\u043b\u044c\u0448\u0435 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0431\u0435\u0437 \u043e\u0431\u0491\u0440\u0443\u043d\u0442\u043e\u0432\u0430\u043d\u043e\u0457 IC-\u043f\u0440\u0438\u0447\u0438\u043d\u0438.\",\"punishment\":\"Jail 120 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.6\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f DM \u0443 \u0433\u0440\u043e\u043c\u0430\u0434\u0441\u044c\u043a\u0438\u0445 \u043c\u0456\u0441\u0446\u044f\u0445 (GZ \u2014 Green Zone) \u2014 \u0431\u0443\u0434\u044c-\u044f\u043a\u0435 \u0437\u0430\u0432\u0434\u0430\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u0430\u0431\u043e \u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u0443 \u043c\u0456\u0441\u0446\u044f\u0445 \u0432\u0435\u043b\u0438\u043a\u043e\u0433\u043e \u0441\u043a\u0443\u043f\u0447\u0435\u043d\u043d\u044f \u0433\u0440\u0430\u0432\u0446\u0456\u0432.\",\"punishment\":\"Jail 120 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u0434\u043e GZ \u0432\u0456\u0434\u043d\u043e\u0441\u044f\u0442\u044c\u0441\u044f: \u0431\u0430\u0437\u0438 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0439 \u0442\u0430 \u043f\u0440\u0438\u043b\u0435\u0433\u043b\u0430 \u0434\u043e \u043d\u0438\u0445 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u044f, \u043c\u0456\u0441\u0446\u044f \u0440\u043e\u0431\u043e\u0442\u0438, \u0440\u043e\u0437\u0432\u0430\u0433, \u0442\u043e\u0440\u0433\u0456\u0432\u043b\u0456, \u043c\u0435\u0434\u0438\u0447\u043d\u0456 \u0437\u0430\u043a\u043b\u0430\u0434\u0438 \u0442\u0430 \u0456\u043d\u0448\u0456 \u043c\u0456\u0441\u0446\u044f \u043c\u0430\u0441\u043e\u0432\u043e\u0433\u043e \u043f\u0435\u0440\u0435\u0431\u0443\u0432\u0430\u043d\u043d\u044f \u0433\u0440\u0430\u0432\u0446\u0456\u0432.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.7\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f TK (Team Kill) \u2014 \u0437\u0430\u0432\u0434\u0430\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u0430\u0431\u043e \u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u0447\u043b\u0435\u043d\u0430 \u0432\u043b\u0430\u0441\u043d\u043e\u0457 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u0447\u0438 \u043a\u043e\u043c\u0430\u043d\u0434\u0438.\",\"punishment\":\"Jail 20 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.8\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f Mass TK \u2014 \u0437\u0430\u0432\u0434\u0430\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u0430\u0431\u043e \u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u0442\u0440\u044c\u043e\u0445 \u0456 \u0431\u0456\u043b\u044c\u0448\u0435 \u0447\u043b\u0435\u043d\u0456\u0432 \u0432\u043b\u0430\u0441\u043d\u043e\u0457 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u0447\u0438 \u043a\u043e\u043c\u0430\u043d\u0434\u0438.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.9\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f RK (Revenge Kill) \u2014 \u043f\u043e\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u043d\u0430 \u043c\u0456\u0441\u0446\u0435 \u0432\u043b\u0430\u0441\u043d\u043e\u0457 \u0437\u0430\u0433\u0438\u0431\u0435\u043b\u0456 \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 15 \u0445\u0432\u0438\u043b\u0438\u043d \u0437 \u043c\u0435\u0442\u043e\u044e \u043f\u043e\u043c\u0441\u0442\u0438 \u0430\u0431\u043e \u0437\u0430\u0432\u0434\u0430\u043d\u043d\u044e \u0448\u043a\u043e\u0434\u0438 \u0433\u0440\u0430\u0432\u0446\u044e, \u044f\u043a\u0438\u0439 \u0442\u0435\u0431\u0435 \u043d\u0435\u0449\u043e\u0434\u0430\u0432\u043d\u043e \u0432\u0431\u0438\u0432.\",\"punishment\":\"Jail 20 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.10\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f RPK (Repeat Kill) \u2014 \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u0435 \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u0435 \u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u043e\u0434\u043d\u043e\u0433\u043e \u0439 \u0442\u043e\u0433\u043e \u0441\u0430\u043c\u043e\u0433\u043e \u0433\u0440\u0430\u0432\u0446\u044f \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c \u043a\u043e\u0440\u043e\u0442\u043a\u043e\u0433\u043e \u0447\u0430\u0441\u0443.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.11\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f SK (Spawn Kill) \u2014 \u0437\u0430\u0432\u0434\u0430\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u0430\u0431\u043e \u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u0433\u0440\u0430\u0432\u0446\u044f \u0431\u0435\u0437\u043f\u043e\u0441\u0435\u0440\u0435\u0434\u043d\u044c\u043e \u043d\u0430 \u043c\u0456\u0441\u0446\u0456 \u0439\u043e\u0433\u043e \u0432\u0456\u0434\u0440\u043e\u0434\u0436\u0435\u043d\u043d\u044f.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.12\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f Mass SK \u2014 \u0437\u0430\u0432\u0434\u0430\u043d\u043d\u044f \u04 a\u0456 \u0434\u0456\u0457, \u0449\u043e \u0441\u0443\u043f\u0435\u0440\u0435\u0447\u0430\u0442\u044c \u043b\u043e\u0433\u0456\u0446\u0456 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0441\u0432\u0456\u0442\u0443, \u0440\u0443\u0439\u043d\u0443\u044e\u0442\u044c \u0440\u043e\u043b\u044c\u043e\u0432\u0443 \u0430\u0442\u043c\u043e\u0441\u0444\u0435\u0440\u0443 \u0430\u0431\u043e \u043d\u0435 \u043c\u0430\u044e\u0442\u044c \u0436\u043e\u0434\u043d\u043e\u0433\u043e \u043e\u0431\u0491\u0440\u0443\u043d\u0442\u0443\u0432\u0430\u043d\u043d\u044f \u0437 \u0442\u043e\u0447\u043a\u0438 \u0437\u043e\u0440\u0443 \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436\u0430.\",\"punishment\":\"Jail 20 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.15\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0442\u0440\u0443\u0447\u0430\u0442\u0438\u0441\u044f \u0432 \u0440\u043e\u043b\u044c\u043e\u0432\u0456 \u0441\u0438\u0442\u0443\u0430\u0446\u0456\u0457, \u0434\u043e \u044f\u043a\u0438\u0445 \u0442\u0432\u0456\u0439 \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436 \u043d\u0435 \u043c\u0430\u0454 \u0436\u043e\u0434\u043d\u043e\u0433\u043e \u0441\u0442\u043e\u0441\u0443\u043d\u043a\u0443 \u2014 \u0431\u0456\u0433\u0430\u0442\u0438 \u043d\u0430\u0432\u043a\u043e\u043b\u043e \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432 \u0441\u0446\u0435\u043d\u0438, \u043f\u0440\u043e\u0432\u043e\u043a\u0443\u0432\u0430\u0442\u0438 \u0457\u0445 \u0430\u0431\u043e \u0441\u0442\u0432\u043e\u0440\u044e\u0432\u0430\u0442\u0438 \u043f\u0435\u0440\u0435\u0448\u043a\u043e\u0434\u0438.\",\"punishment\":\"Jail 10 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\ u0434\u0441\u0442\u0430\u0432\u0443 \u0434\u043b\u044f \u0437\u0430\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0447\u0438 \u0431\u0443\u0434\u044c-\u044f\u043a\u0438\u0445 \u0456\u043d\u0448\u0438\u0445 \u0434\u0456\u0439.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.23\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043f\u0440\u043e\u0432\u043e\u0434\u0438\u0442\u0438 \u0437\u0430\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0433\u0440\u0430\u0432\u0446\u044f, \u044f\u043a\u0449\u043e \u0443 \u043d\u044c\u043e\u0433\u043e \u0432\u0456\u0434\u0441\u0443\u0442\u043d\u0456 \u0437\u0456\u0440\u043a\u0438 \u0440\u043e\u0437\u0448\u0443\u043a\u0443.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\u0412\u0438\u043d\u044f\u0442\u043e\u043a: \u0437\u0430\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0431\u0435\u0437 \u0437\u0456\u0440\u043e\u043a \u0440\u043e\u0437\u0448\u0443\u043a\u0443 \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0454\u0442\u044c\u0441\u044f \u0437\u0430 \u043d\u0430\u044f\u0432\u043d\u043e\u0441\u0442\u0456 \u0444\u043e\u0442\u043e \u0430\u0431\u043e \u0432\u0456\u0434\u0435\u043e\u0434\u043e\u043a\u0430\u0437\u0456\u0432 \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u043e\u0433\u043e \u043f\u0440\u0430\u0432\u043e\u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0443 \u043f\u0440\u0430\u0432\u043e\u043e\u0445\u043e\u0440\u043e\u043d\u0446\u044f.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.24\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0443\u043d\u0438\u043a\u0430\u0442\u0438 \u043f\u043e\u043b\u0456\u0446\u0435\u0439\u0441\u044c\u043a\u043e\u0457 \u043f\u043e\u0433\u043e\u043d\u0456, \u0445\u043e\u0432\u0430\u044e\u0447\u0438\u0441\u044c \u0443 \u0437\u0430\u043a\u0440\u0438\u0442\u0438\u0445 \u0456\u043d\u0442\u0435\u0440'\u0454\u0440\u0430\u0445 \u0430\u0431\u043e \u043f\u0435\u0440\u0435\u043c\u0456\u0449\u0443\u044e\u0447\u0438\u0441\u044c \u043f\u043e \u0432\u043e\u0434\u043e\u0439\u043c\u0430\u0445.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.25\",\"text\":\"\u0422\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u044f \u0432\u0456\u0439\u0441\u044c\u043a\u043e\u0432\u043e\u0457 \u0447\u0430\u0441\u0442\u0438\u043d\u0438 \u0454 \u043e\u0431'\u0454\u043a\u0442\u043e\u043c \u043a\u0440\u0438\u0442\u0438\u0447\u043d\u043e\u0457 \u0456\u043d\u0444\u0440\u0430\u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0438 \u0442\u0430 \u0440\u0435\u0436\u0438\u043c\u043d\u043e\u044e \u0437\u043e\u043d\u043e\u044e \u043f\u0456\u0434\u0432\u0438\u0449\u0435\u043d\u043e\u0457 \u043d\u0435\u0431\u0435\u0437\u043f\u0435\u043a\u0438. \u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0447\u043d\u043e \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0431\u0443\u0434\u044c-\u044f\u043a\u0435 \u043f\u0440\u043e\u043d\u0438\u043a\u043d\u0435\u043d\u043d\u044f \u043d\u0430 \u0412\u0427 \u0446\u0438\u0432\u0456\u043b\u044c\u043d\u0438\u043c \u043e\u0441\u043e\u0431\u0430\u043c \u0430\u0431\u043e \u0447\u043b\u0435\u043d\u0430\u043c \u043d\u0435\u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0438\u0445 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0439 \u0437\u0430\u0440\u0430\u0434\u0438 \u0440\u043e\u0437\u0432\u0430\u0433, \u0432\u043b\u0430\u0448\u0442\u0443\u0432\u0430\u043d\u043d\u044f \u0414\u041c\u0443, \u0431\u0435\u0437\u043f\u043e\u0440\u044f\u0434\u043a\u0456\u0432 \u0447\u0438 \u0432\u0438\u043a\u043b\u0438\u043a\u0443 \u0440\u0435\u0430\u043a\u0446\u0456\u0457 \u0437 \u0431\u043e\u043a\u0443 \u0417\u0421\u0423 (\u0431\u0430\u0439\u0442). \u0411\u0443\u0434\u044c-\u044f\u043a\u0435 \u0437\u043d\u0430\u0445\u043e\u0434\u0436\u0435\u043d\u043d\u044f \u043d\u0430 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0457 \u0412\u0427 \u043c\u0430\u0454 \u0441\u0443\u043f\u0440\u043e\u0432\u043e\u0434\u0436\u0443\u0432\u0430\u0442\u0438\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0441\u043f\u043b\u0430\u043d\u043e\u0432\u0430\u043d\u0438\u043c \u0442\u0430 \u0443\u0437\u0433\u043e\u0434\u0436\u0435\u043d\u0438\u043c RolePlay-\u0441\u0446\u0435\u043d\u0430\u0440\u0456\u0454\u043c.\",\"punishment\":\"Jail 90 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0415\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0430 \u0422\u0430 \u041c\u0430\u0439\u043d\u043e\",\"id\":\"6.1\",\"text\":\"\u0411\u0443\u0434\u044c-\u044f\u043a\u0430 \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u0456\u0433\u0440\u043e\u0432\u0438\u0445 \u0446\u0456\u043d\u043d\u043e\u0441\u0442\u0435\u0439 \u043c\u0456\u0436 \u0433\u0440\u0430\u0432\u0446\u044f\u043c\u0438 \u2014 \u043a\u043e\u0448\u0442\u0456\u0432, \u043c\u0430\u0439\u043d\u0430, \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u0456\u0432 \u2014 \u043c\u0430\u0454 \u0432\u0456\u0434\u0431\u0443\u0432\u0430\u0442\u0438\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0447\u0435\u0440\u0435\u0437 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0456 \u0456\u0433\u0440\u043e\u0432\u0456 \u0441\u0438\u0441\u0442\u0435\u043c\u0438, \u043f\u0435\u0440\u0435\u0434\u0431\u0430\u0447\u0435\u043d\u0456 \u043c\u043e\u0434\u043e\u043c.\",\"punishment\":\"\u0411\u0430\u043d 30 \u0434\u043d\u0456\u0432 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0430\u043a\u0430\u0443\u043d\u0442\u0443\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u043d\u0435\u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0430 \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u2014 \u0446\u0435 \u0431\u0443\u0434\u044c-\u044f\u043a\u0438\u0439 \u0441\u043f\u043e\u0441\u0456\u0431, \u0449\u043e \u043e\u0431\u0445\u043e\u0434\u0438\u0442\u044c \u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u0456 \u0456\u0433\u0440\u043e\u0432\u0456 \u043c\u0435\u0445\u0430\u043d\u0456\u043a\u0438: \u043f\u0440\u043e\u0434\u0430\u0436 \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u0456\u0432 \u0437\u0430 \u043d\u0435\u0440\u0435\u0430\u043b\u044c\u043d\u043e\u044e \u0446\u0456\u043d\u043e\u044e, \u0448\u0442\u0443\u0447\u043d\u0438\u0439 \u043e\u0431\u043c\u0456\u043d \u0442\u043e\u0449\u043e.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0415\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0430 \u0422\u0430 \u041c\u0430\u0439\u043d\u043e\",\"id\":\"6.2\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0431\u0443\u0434\u044c-\u044f\u043a\u0438\u0439 \u043f\u0435\u0440\u0435\u043f\u0440\u043e\u0434\u0430\u0436 \u043c\u0430\u0439\u043d\u0430 \u0437\u0456 \u0448\u0442\u0443\u0447\u043d\u0438\u043c \u0437\u0430\u0432\u0438\u0449\u0435\u043d\u043d\u044f\u043c \u0430\u0431\u043e \u0437\u0430\u043d\u0438\u0436\u0435\u043d\u043d\u044f\u043c \u0446\u0456\u043d\u0438 \u0437 \u043c\u0435\u0442\u043e\u044e \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0456 \u043a\u043e\u0448\u0442\u0456\u0432 \u043c\u0456\u0436 \u0433\u0440\u0430\u0432\u0446\u044f\u043c\u0438.\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u0431\u043b\u0456\u043a\u043e\u0432\u043e\u0433\u043e \u0437\u0430\u043f\u0438\u0441\u0443\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u043d\u0430\u043f\u0440\u0438\u043a\u043b\u0430\u0434 \u2014 \u0433\u0440\u0430\u0432\u0435\u0446\u044c \u0410 \u043f\u0440\u043e\u0434\u0430\u0454 \u0431\u0443\u0434\u0438\u043d\u043e\u043a \u0433\u0440\u0430\u0432\u0446\u044e \u0411 \u0437\u0430 1 000, \u0430 \u0433\u0440\u0430\u0432\u0435\u0446\u044c \u0411 \u043f\u0440\u043e\u0434\u0430\u0454 \u0442\u043e\u0439 \u0441\u0430\u043c\u0438\u0439 \u0431\u0443\u0434\u0438\u043d\u043e\u043a \u043d\u0430\u0437\u0430\u0434 \u0437\u0430 500 000. \u0426\u0435 \u043f\u0440\u0438\u0445\u043e\u0432\u0430\u043d\u0430 \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u043a\u043e\u0448\u0442\u0456\u0432, \u044f\u043a\u0430 \u0454 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f\u043c \u043d\u0435\u0437\u0430\u043b\u0435\u0436\u043d\u043e \u0432\u0456\u0434 \u0442\u043e\u0433\u043e, \u044f\u043a \u0457\u0457 \u043e\u0444\u043e\u0440\u043c\u043b\u0435\u043d\u043e.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0415\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0430 \u0422\u0430 \u041c\u0430\u0439\u043d\u043e\",\"id\":\"6.3\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0434\u0430\u0440\u0443\u0432\u0430\u0442\u0438 \u0430\u0431\u043e \u0431\u0435\u0437\u043e\u043f\u043b\u0430\u0442\u043d\u043e \u043f\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u0438 \u0456\u043d\u0448\u0438\u043c \u0433\u0440\u0430\u0432\u0446\u044f\u043c \u0437\u043d\u0430\u0447\u043d\u0443 \u043a\u0456\u043b\u044c\u043a\u0456\u0441\u0442\u044c \u043a\u043e\u0448\u0442\u0456\u0432 \u0447\u0438 \u0446\u0456\u043d\u043d\u043e\u0433\u043e \u043c\u0430\u0439\u043d\u0430.\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u0431\u043b\u0456\u043a\u043e\u0432\u043e\u0433\u043e \u0437\u0430\u043f\u0438\u0441\u0443\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f\u043c \u0432\u0432\u0430\u0436\u0430\u0454\u0442\u044c\u0441\u044f \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0430, \u0449\u043e \u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c 30% \u0456 \u0431\u0456\u043b\u044c\u0448\u0435 \u0432\u0456\u0434 \u0437\u0430\u0433\u0430\u043b\u044c\u043d\u043e\u0457 \u0432\u0430\u0440\u0442\u043e\u0441\u0442\u0456 \u043d\u0430\u0431\u0443\u0442\u043e\u0433\u043e \u043c\u0430\u0439\u043d\u0430 \u0433\u0440\u0430\u0432\u0446\u044f. \u041f\u0440\u0430\u0432\u0438\u043b\u043e \u0434\u0456\u0454 \u043d\u0430\u0432\u0456\u0442\u044c \u043c\u0456\u0436 \u0434\u0440\u0443\u0437\u044f\u043c\u0438 \u0430\u0431\u043e \u0437\u043d\u0430\u0439\u043e\u043c\u0438\u043c\u0438.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0415\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0430 \u0422\u0430 \u041c\u0430\u0439\u043d\u043e\",\"id\":\"6.4\",\"text\":\"\u042f\u043a\u0449\u043e \u043d\u0430 \u0440\u0430\u0445\u0443\u043d\u043e\u043a \u0433\u0440\u0430\u0432\u0446\u044f \u043d\u0430\u0434\u0456\u0439\u0448\u043b\u0438 \u043a\u043e\u0448\u0442\u0438 \u0432\u0456\u0434 \u043d\u0435\u0432\u0456\u0434\u043e\u043c\u043e\u0457 \u043e\u0441\u043e\u0431\u0438 \u2014 \u0432\u0456\u043d \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043d\u0435\u0433\u0430\u0439\u043d\u043e \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u0438\u0442\u0438 \u043f\u0440\u043e \u0446\u0435 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044e \u0442\u0430 \u043f\u043e\u0432\u0435\u0440\u043d\u0443\u0442\u0438 \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u0443 \u0441\u0443\u043c\u0443.\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u0431\u043b\u0456\u043a\u043e\u0432\u043e\u0433\u043e \u0437\u0430\u043f\u0438\u0441\u0443\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u044f\u043a\u0449\u043e \u0431\u0443\u0434\u0435 \u0434\u043e\u0432\u0435\u0434\u0435\u043d\u043e, \u0449\u043e \u0433\u0440\u0430\u0432\u0435\u0446\u044c \u0441\u0432\u0456\u0434\u043e\u043c\u043e \u0441\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u0432\u0441\u044f \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u0438\u043c\u0438 \u043a\u043e\u0448\u0442\u0430\u043c\u0438, \u0437\u043d\u0430\u044e\u0447\u0438 \u043f\u0440\u043e \u0457\u0445 \u043d\u0435\u0437\u0430\u043a\u043e\u043d\u043d\u0435 \u043f\u043e\u0445\u043e\u0434\u0436\u0435\u043d\u043d\u044f \u2014 \u0446\u0435 \u0442\u044f\u0433\u043d\u0435 \u0437\u0430 \u0441\u043e\u0431\u043e\u044e \u043f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u0431\u043b\u0456\u043a\u043e\u0432\u043e\u0433\u043e \u0437\u0430\u043f\u0438\u0441\u0443.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0415\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0430 \u0422\u0430 \u041c\u0430\u0439\u043d\u043e\",\"id\":\"6.5\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0437\u0434\u0430\u0432\u0430\u0442\u0438 \u0432 \u043e\u0440\u0435\u043d\u0434\u0443 \u043e\u0441\u043e\u0431\u0438\u0441\u0442\u0435 \u043c\u0430\u0439\u043d\u043e \u0430\u0431\u043e \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u0438 \u0437\u0430 \u0446\u0456\u043d\u043e\u044e, \u0449\u043e \u043d\u0435 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u0454 \u0440\u0435\u0430\u043b\u044c\u043d\u0456\u0439 \u0440\u0438\u043d\u043a\u043e\u0432\u0456\u0439 \u0432\u0430\u0440\u0442\u043e\u0441\u0442\u0456 \u0432 \u043c\u0435\u0436\u0430\u0445 \u0456\u0433\u0440\u043e\u0432\u043e\u0457 \u0435\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0438.\",\"punishment\":\"\u0411\u0430\u043d 30 \u0434\u043d\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0415\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0430 \u0422\u0430 \u041c\u0430\u0439\u043d\u043e\",\"id\":\"6.6\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0431\u0443\u0434\u044c-\u044f\u043a\u0438\u0439 \u043e\u0431\u043c\u0430\u043d \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u043f\u0456\u0434 \u0447\u0430\u0441 \u0443\u0433\u043e\u0434 \u2014 \u043f\u0440\u0438\u0445\u043e\u0432\u0443\u0432\u0430\u043d\u043d\u044f \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u0438\u0441\u0442\u0438\u043a \u043c\u0430\u0439\u043d\u0430, \u0432\u0432\u0435\u0434\u0435\u043d\u043d\u044f \u0432 \u043e\u043c\u0430\u043d\u0443 \u0449\u043e\u0434\u043e \u0439\u043e\u0433\u043e \u0432\u0430\u0440\u0442\u043e\u0441\u0442\u0456 \u0430\u0431\u043e \u0441\u0442\u0430\u043d\u0443, \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u0435 \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u043d\u0435\u0443\u0432\u0430\u0436\u043d\u043e\u0441\u0442\u0456 \u0456\u043d\u0448\u043e\u0457 \u0441\u0442\u043e\u0440\u043e\u043d\u0438.\",\"punishment\":\"\u0411\u0430\u043d \u0434\u043e 60 \u0434\u043d\u0456\u0432 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u043e\u0431\u043c\u0430\u043d\u043e\u043c \u0432\u0432\u0430\u0436\u0430\u0454\u0442\u044c\u0441\u044f \u0431\u0443\u0434\u044c-\u044f\u043a\u0435 \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u0435 \u0441\u043f\u043e\u0442\u0432\u043e\u0440\u0435\u043d\u043d\u044f \u0456\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0456\u0457, \u0449\u043e \u0432\u043f\u043b\u0438\u0432\u0430\u0454 \u043d\u0430 \u0440\u0456\u0448\u0435\u043d\u043d\u044f \u0456\u043d\u0448\u043e\u0433\u043e \u0433\u0440\u0430\u0432\u0446\u044f \u0443\u043a\u043b\u0430\u0441\u0442\u0438 \u0443\u0433\u043e\u0434\u0443.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0415\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0430 \u0422\u0430 \u041c\u0430\u0439\u043d\u043e\",\"id\":\"6.7\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0441\u043f\u0430\u043c\u0438\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u044f\u043c \u043f\u0440\u043e\u043f\u043e\u0437\u0438\u0446\u0456\u044f\u043c\u0438 \u0449\u043e\u0434\u043e \u043a\u0443\u043f\u0456\u0432\u043b\u0456 \u0430\u0431\u043e \u043f\u0440\u043e\u0434\u0430\u0436\u0443 \u043c\u0430\u0439\u043d\u0430 \u2014 \u0431\u0456\u043b\u044c\u0448\u0435 \u0434\u0432\u043e\u0445 \u0437\u0432\u0435\u0440\u043d\u0435\u043d\u044c \u0434\u043e \u043e\u0434\u043d\u043e\u0433\u043e \u0433\u0440\u0430\u0432\u0446\u044f \u043f\u0456\u0434\u0440\u044f\u0434 \u0432\u0432\u0430\u0436\u0430\u0454\u0442\u044c\u0441\u044f \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f\u043c.\",\"punishment\":\"\u0411\u0430\u043d \u0434\u043e 60 \u0434\u043d\u0456\u0432 \u2014 \u044f\u043a\u0449\u043e \u0432\u043d\u0430\u0441\u043b\u0456\u0434\u043e\u043a \u0446\u044c\u043e\u0433\u043e \u0432\u0456\u0434\u0431\u0443\u0432\u0441\u044f \u043e\u0431\u043c\u0430\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0415\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0430 \u0422\u0430 \u041c\u0430\u0439\u043d\u043e\",\"id\":\"6.8\",\"text\":\"\u0413\u0440\u0430\u0432\u0435\u0446\u044c, \u044f\u043a\u0438\u0439 \u043e\u0431\u043c\u0430\u043d\u0443\u0432 \u0456\u043d\u0448\u043e\u0433\u043e, \u043c\u043e\u0436\u0435 \u043e\u0442\u0440\u0438\u043c\u0430\u0442\u0438 \u043f\u043e\u043c'\u044f\u043a\u0448\u0435\u043d\u0435 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u0437\u0430 \u0443\u043c\u043e\u0432\u0438 \u043f\u043e\u0432\u043d\u043e\u0433\u043e \u043f\u043e\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u043c\u0430\u0439\u043d\u0430 \u0430\u0431\u043e \u043a\u043e\u0448\u0442\u0456\u0432 \u043f\u043e\u0441\u0442\u0440\u0430\u0436\u0434\u0430\u043b\u043e\u043c\u0443 \u0442\u0430 \u0437\u0430 \u0439\u043e\u0433\u043e \u043f\u0438\u0441\u044c\u043c\u043e\u0432\u043e\u0457 \u0437\u0433\u043e\u0434\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0415\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0430 \u0422\u0430 \u041c\u0430\u0439\u043d\u043e\",\"id\":\"6.9\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0444\u0443\u043d\u043a\u0446\u0456\u043e\u043d\u0430\u043b \u0431\u0456\u0437\u043d\u0435\u0441\u0443 \u044f\u043a \u0456\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442 \u0442\u0438\u0441\u043a\u0443, \u0448\u0430\u043d\u0442\u0430\u0436\u0443 \u0430\u0431\u043e \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u043e\u0441\u043e\u0431\u0438\u0441\u0442\u043e\u0457 \u0432\u0438\u0433\u043e\u0434\u0438 \u043f\u043e\u0437\u0430 \u043c\u0435\u0436\u0430\u043c\u0438 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0438\u0445 \u0456\u0433\u0440\u043e\u0432\u0438\u0445 \u043c\u0435\u0445\u0430\u043d\u0456\u043a.\",\"punishment\":\"Warn / \u0411\u0430\u043d 30 \u0434\u043d\u0456\u0432 / \u0412\u0438\u043b\u0443\u0447\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0415\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0430 \u0422\u0430 \u041c\u0430\u0439\u043d\u043e\",\"id\":\"6.10\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043f\u0440\u043e\u0432\u043e\u0434\u0438\u0442\u0438 \u0444\u0456\u043d\u0430\u043d\u0441\u043e\u0432\u0456 \u043f\u0456\u0440\u0430\u043c\u0456\u0434\u0438, \u043d\u0435\u0441\u0430\u043d\u043a\u0446\u0456\u043e\u043d\u043e\u0432\u0430\u043d\u0456 \u043b\u043e\u0442\u0435\u0440\u0435\u0457, \u0431\u0430\u043d\u043a\u0456\u0432\u0441\u044c\u043a\u0456 \u0430\u0431\u043e \u0441\u0442\u0440\u0430\u0445\u043e\u0432\u0456 \u043f\u043e\u0441\u043b\u0443\u0433\u0438 \u043f\u0440\u0438\u0432\u0430\u0442\u043d\u043e\u0433\u043e \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u0443 \u0431\u0435\u0437 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u043e\u0433\u043e \u0434\u043e\u0437\u0432\u043e\u043b\u0443 \u0433\u043e\u043b\u043e\u0432\u043d\u043e\u0433\u043e \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0430.\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u0431\u043b\u0456\u043a\u043e\u0432\u043e\u0433\u043e \u0437\u0430\u043f\u0438\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0412\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u044f \u0417 \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e\",\"id\":\"7.1\",\"text\":\"\u0420\u0435\u043f\u043e\u0440\u0442 \u2014 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0438\u0439 \u043a\u0430\u043d\u0430\u043b \u0437\u0432'\u044f\u0437\u043a\u0443 \u043c\u0456\u0436 \u0433\u0440\u0430\u0432\u0446\u0435\u043c \u0442\u0430 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e \u0432 \u043c\u0435\u0436\u0430\u0445 \u0456\u0433\u0440\u043e\u0432\u043e\u0433\u043e \u0441\u0435\u0440\u0432\u0435\u0440\u0430. \u0412\u0456\u043d \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0439 \u0434\u043b\u044f \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u0435\u043d\u044c \u043f\u0440\u043e \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043f\u0440\u0430\u0432\u0438\u043b, \u0442\u0435\u0445\u043d\u0456\u0447\u043d\u0438\u0445 \u043f\u0440\u043e\u0431\u043b\u0435\u043c \u0430\u0431\u043e \u0437\u0430\u043f\u0438\u0442\u0456\u0432 \u043d\u0430 \u0434\u043e\u043f\u043e\u043c\u043e\u0433\u0443, \u0449\u043e \u043d\u0435 \u043c\u043e\u0436\u0443\u0442\u044c \u0431\u0443\u0442\u0438 \u0432\u0438\u0440\u0456\u0448\u0435\u043d\u0456 \u0441\u0430\u043c\u043e\u0441\u0442\u0456\u0439\u043d\u043e.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0412\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u044f \u0417 \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e\",\"id\":\"7.2\",\"text\":\"\u0417\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0443 \u0440\u0435\u043f\u043e\u0440\u0442 \u043c\u0430\u0454 \u0431\u0443\u0442\u0438 \u0447\u0456\u0442\u043a\u0438\u043c \u0442\u0430 \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u0438\u043c \u2014 \u0456\u0437 \u0437\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f\u043c \u0441\u0443\u0442\u0456 \u043f\u0440\u043e\u0431\u043b\u0435\u043c\u0438, id \u0430\u0431\u043e \u043d\u0456\u043a\u043d\u0435\u0439\u043c\u0443 \u043f\u043e\u0440\u0443\u0448\u043d\u0438\u043a\u0430 \u0442\u0430, \u0437\u0430 \u043c\u043e\u0436\u043b\u0438\u0432\u043e\u0441\u0442\u0456, \u043c\u0456\u0441\u0446\u044f \u043f\u043e\u0434\u0456\u0457.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u043f\u043e\u0440\u043e\u0436\u043d\u0456 \u0440\u0435\u043f\u043e\u0440\u0442\u0438, \u043d\u0435\u0437\u0440\u043e\u0437\u0443\u043c\u0456\u043b\u0456 \u0437\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0430\u0431\u043e \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u0435\u043d\u043d\u044f \u0443 \u0441\u0442\u0438\u043b\u0456 \\\"?\\\" \u043d\u0435 \u0454 \u043f\u0456\u0434\u0441\u0442\u0430\u0432\u043e\u044e \u0434\u043b\u044f \u0434\u0456\u0457 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0430. \u0423 \u0442\u0430\u043a\u0438\u0445 \u0432\u0438\u043f\u0430\u0434\u043a\u0430\u0445 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440 \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0437\u0430\u043f\u0440\u043e\u0441\u0438\u0442\u0438 \u0443\u0442\u043e\u0447\u043d\u0435\u043d\u043d\u044f.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0412\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u044f \u0417 \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e\",\"id\":\"7.3\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0440\u0435\u043f\u043e\u0440\u0442 \u043d\u0435 \u0437\u0430 \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f\u043c: \u0434\u043b\u044f \u043e\u0444\u0444\u0442\u043e\u043f\u0443, \u0436\u0430\u0440\u0442\u0456\u0432, \u0444\u043b\u0443\u0434\u0443, \u0437\u0432\u0438\u0447\u0430\u0439\u043d\u043e\u0433\u043e \u0441\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0447\u0438 \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u0435\u043d\u044c, \u0449\u043e \u043d\u0435 \u043c\u0456\u0441\u0442\u044f\u0442\u044c \u0437\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0434\u043e \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457.\",\"punishment\":\"\u041c\u0443\u0442 \u0440\u0435\u043f\u043e\u0440\u0442\u0443 20\u201360 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0412\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u044f \u0417 \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e\",\"id\":\"7.4\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043f\u0440\u043e\u0441\u0438\u0442\u0438 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044e \u043f\u0440\u043e \u0437\u043d\u044f\u0442\u0442\u044f \u0430\u0431\u043e \u043f\u043e\u043c'\u044f\u043a\u0448\u0435\u043d\u043d\u044f \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u0431\u0435\u0437\u043f\u043e\u0441\u0435\u0440\u0435\u0434\u043d\u044c\u043e \u0443 \u0440\u0435\u043f\u043e\u0440\u0442\u0456 \u0430\u0431\u043e \u0432 \u0433\u0440\u0456.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u044f\u043a\u0449\u043e \u0433\u0440\u0430\u0432\u0435\u0446\u044c \u0432\u0432\u0430\u0436\u0430\u0454 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u043d\u0435\u0441\u043f\u0440\u0430\u0432\u0435\u0434\u043b\u0438\u0432\u0438\u043c \u2014 \u0432\u0456\u043d \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u043f\u043e\u0434\u0430\u0442\u0438 \u0430\u043f\u0435\u043b\u044f\u0446\u0456\u044e \u0447\u0435\u0440\u0435\u0437 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0438\u0439 \u0440\u043e\u0437\u0434\u0456\u043b Discord \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 72 \u0433\u043e\u0434\u0438\u043d \u0437 \u043c\u043e\u043c\u0435\u043d\u0442\u0443 \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0412\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u044f \u0417 \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e\",\"id\":\"7.5\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043d\u0430\u0434\u0430\u0432\u0430\u0442\u0438 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u043d\u0435\u043f\u0440\u0430\u0432\u0434\u0438\u0432\u0443 \u0456\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0456\u044e, \u043f\u0456\u0434\u0440\u043e\u0431\u043b\u0435\u043d\u0456 \u0434\u043e\u043a\u0430\u0437\u0438 \u0430\u0431\u043e \u043f\u0440\u0438\u0445\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u043e\u0431\u0441\u0442\u0430\u0432\u0438\u043d\u0438 \u043f\u0456\u0434 \u0447\u0430\u0441 \u0440\u043e\u0437\u0433\u043b\u044f\u0434\u0443 \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u0457 \u0441\u0438\u0442\u0443\u0430\u0446\u0456\u0457.\",\"punishment\":\"\u0411\u0430\u043d 7\u201330 \u0434\u043d\u0456\u0432 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0412\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u044f \u0417 \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e\",\"id\":\"7.6\",\"text\":\"\u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440 \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0437\u0430\u043f\u0440\u043e\u0441\u0438\u0442\u0438 \u0434\u043e\u0434\u0430\u0442\u043a\u043e\u0432\u0456 \u043a\u043e\u043d\u0442\u0430\u043a\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u044f \u2014 \u043d\u0430\u043f\u0440\u0438\u043a\u043b\u0430\u0434, Telegram \u2014 \u0434\u043b\u044f \u0443\u0442\u043e\u0447\u043d\u0435\u043d\u043d\u044f \u0434\u0435\u0442\u0430\u043b\u0435\u0439 \u0443 \u0441\u043a\u043b\u0430\u0434\u043d\u0438\u0445 \u0430\u0431\u043e \u043d\u0435\u043e\u0434\u043d\u043e\u0437\u043d\u0430\u0447\u043d\u0438\u0445 \u0441\u0438\u0442\u0443\u0430\u0446\u0456\u044f\u0445. \u0413\u0440\u0430\u0432\u0435\u0446\u044c \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0432\u0456\u0434\u043c\u043e\u0432\u0438\u0442\u0438\u0441\u044c, \u043e\u0434\u043d\u0430\u043a \u0446\u0435 \u043c\u043e\u0436\u0435 \u0432\u043f\u043b\u0438\u043d\u0443\u0442\u0438 \u043d\u0430 \u043f\u043e\u0432\u043d\u043e\u0442\u0443 \u0440\u043e\u0437\u0433\u043b\u044f\u0434\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0412\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u044f \u0417 \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e\",\"id\":\"7.7\",\"text\":\"\u0421\u043a\u0430\u0440\u0433\u0438 \u043d\u0430 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0442\u0430 \u0430\u043f\u0435\u043b\u044f\u0446\u0456\u0457 \u043d\u0430 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u043f\u043e\u0434\u0430\u044e\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0447\u0435\u0440\u0435\u0437 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0438\u0439 \u0440\u043e\u0437\u0434\u0456\u043b Discord. \u0417\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0447\u0435\u0440\u0435\u0437 \u043e\u0441\u043e\u0431\u0438\u0441\u0442\u0456 \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u0435\u043d\u043d\u044f, \u0443 \u0433\u0440\u0456 \u0430\u0431\u043e \u043d\u0430 \u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0456\u0445 \u043f\u043b\u0430\u0442\u0444\u043e\u0440\u043c\u0430\u0445 \u2014 \u043d\u0435 \u0440\u043e\u0437\u0433\u043b\u044f\u0434\u0430\u044e\u0442\u044c\u0441\u044f.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0412\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u044f \u0417 \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e\",\"id\":\"7.8\",\"text\":\"\u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0432\u0438\u0434\u0430\u0442\u0438 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 72 \u0433\u043e\u0434\u0438\u043d \u0437 \u043c\u043e\u043c\u0435\u043d\u0442\u0443 \u0444\u0456\u043a\u0441\u0430\u0446\u0456\u0457 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0430\u0431\u043e \u043f\u043e\u0434\u0430\u043d\u043d\u044f \u0441\u043a\u0430\u0440\u0433\u0438. \u0417\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f, \u0449\u043e \u043d\u0430\u0434\u0456\u0439\u0448\u043b\u0438 \u043f\u0456\u0441\u043b\u044f \u0446\u044c\u043e\u0433\u043e \u0442\u0435\u0440\u043c\u0456\u043d\u0443, \u043c\u043e\u0436\u0443\u0442\u044c \u043d\u0435 \u0440\u043e\u0437\u0433\u043b\u044f\u0434\u0430\u0442\u0438\u0441\u044c.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0412\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u044f \u0417 \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e\",\"id\":\"7.9\",\"text\":\"\u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0430 \u043d\u0430\u0434\u0430\u0442\u0438 \u0434\u043e\u043a\u0430\u0437\u0438 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043d\u0430 \u0432\u0438\u043c\u043e\u0433\u0443 \u0433\u0440\u0430\u0432\u0446\u044f, \u0430\u043b\u0435 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0432 \u043c\u0435\u0436\u0430\u0445 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e\u0457 \u0441\u043a\u0430\u0440\u0433\u0438 \u043d\u0430 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u043e\u043c\u0443 Discord-\u0441\u0435\u0440\u0432\u0435\u0440\u0456 \u043f\u0440\u043e\u0454\u043a\u0442\u0443. \u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0447\u043d\u043e \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043d\u0430\u0434\u0441\u0438\u043b\u0430\u0442\u0438 \u0434\u043e\u043a\u0430\u0437\u0438 \u0432 \u043e\u0441\u043e\u0431\u0438\u0441\u0442\u0456 \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u0435\u043d\u043d\u044f (\u041f\u041f), \u0456\u0433\u0440\u043e\u0432\u0456 \u0447\u0430\u0442\u0438 \u0447\u0438 \u0456\u043d\u0448\u0456 \u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0456 \u0440\u0435\u0441\u0443\u0440\u0441\u0438.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u0414\u043e\u043a\u0430\u0437\u0438 \u043d\u0430\u0434\u0430\u044e\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0443 \u0432\u0438\u0433\u043b\u044f\u0434\u0456 \u0432\u0456\u0434\u0435\u043e\u0437\u0430\u043f\u0438\u0441\u0443/\u0444\u043e\u0442\u043e \u0437 \u0433\u0440\u0438, \u0443\u0441\u0456 \u0456\u043d\u0448\u0456 \u0432\u0438\u0434\u0438 \u0434\u043e\u043a\u0430\u0437\u0456\u0432, \u0442\u0430\u043a\u0456 \u044f\u043a \u043b\u043e\u0433\u0443\u0432\u0430\u043d\u043d\u044f, \u0434\u0435\u0442\u0435\u043a\u0442-\u043f\u0430\u043d\u0435\u043b\u0456, \u0430\u043d\u043e\u043d\u0456\u043c\u043d\u0456 \u0434\u043e\u0441\u0442\u043e\u0432\u0456\u0440\u043d\u0456 \u0434\u043e\u043a\u0430\u0437\u0438 \u043d\u0430\u0434\u0430\u043d\u0456 \u0433\u0440\u0430\u0432\u0446\u044f\u043c\u0438 - \u043d\u0435 \u043d\u0430\u0434\u0430\u044e\u0442\u044c\u0441\u044f.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0412\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u044f \u0417 \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e\",\"id\":\"7.10\",\"text\":\"\u0420\u0456\u0448\u0435\u043d\u043d\u044f \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u043c\u043e\u0436\u0435 \u0431\u0443\u0442\u0438 \u043e\u0441\u043a\u0430\u0440\u0436\u0435\u043d\u0435 \u043b\u0438\u0448\u0435 \u0447\u0435\u0440\u0435\u0437 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0443 \u0430\u043f\u0435\u043b\u044f\u0446\u0456\u044e. \u041f\u0443\u0431\u043b\u0456\u0447\u043d\u0435 \u043e\u0431\u0433\u043e\u0432\u043e\u0440\u0435\u043d\u043d\u044f, \u043a\u0440\u0438\u0442\u0438\u043a\u0430 \u0430\u0431\u043e \u0442\u0438\u0441\u043a \u043d\u0430 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0456\u0432 \u0443 \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u043c\u0443 \u0447\u0430\u0442\u0456 \u043d\u0435 \u0454 \u0456\u043d\u0441\u0442\u0440\u0443\u043c\u0435\u043d\u0442\u043e\u043c \u043e\u0441\u043a\u0430\u0440\u0436\u0435\u043d\u043d\u044f \u0456 \u0442\u044f\u0433\u043d\u0443\u0442\u044c \u0437\u0430 \u0441\u043e\u0431\u043e\u044e \u043e\u043a\u0440\u0435\u043c\u0435 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0445\u0438\u0441\u0442 \u041d\u043e\u0432\u0430\u0447\u043a\u0456\u0432\",\"id\":\"8.1\",\"text\":\"\u041d\u043e\u0432\u0430\u0447\u043a\u043e\u043c \u0432\u0432\u0430\u0436\u0430\u0454\u0442\u044c\u0441\u044f \u0433\u0440\u0430\u0432\u0435\u0446\u044c, \u044f\u043a\u0438\u0439 \u043d\u0435 \u0434\u043e\u0441\u044f\u0433 6 \u0440\u0456\u0432\u043d\u044f \u0456\u0433\u0440\u043e\u0432\u043e\u0433\u043e \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0445\u0438\u0441\u0442 \u041d\u043e\u0432\u0430\u0447\u043a\u0456\u0432\",\"id\":\"8.2\",\"text\":\"\u041f\u0456\u043b\u044c\u0433\u043e\u0432\u0438\u0439 \u0440\u0435\u0436\u0438\u043c \u043f\u043e\u0448\u0438\u0440\u044e\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u043d\u0430 \u043d\u0435\u043d\u0430\u0432\u043c\u0438\u0441\u043d\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f RP-\u043f\u0440\u043e\u0446\u0435\u0441\u0443, \u0441\u043a\u043e\u0454\u043d\u0456 \u0447\u0435\u0440\u0435\u0437 \u043e\u0431'\u0454\u043a\u0442\u0438\u0432\u043d\u0435 \u043d\u0435\u0437\u043d\u0430\u043d\u043d\u044f \u043f\u0440\u0430\u0432\u0438\u043b, \u0430 \u0441\u0430\u043c\u0435: NonRP Drive, MG (Metagaming), \u0456\u043d\u0448\u0456 \u043b\u0435\u0433\u043a\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f RP-\u043f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 (PG, \u043d\u0435\u0437\u043d\u0430\u0447\u043d\u0438\u0439 NonRP), \u0432\u0447\u0438\u043d\u0435\u043d\u0456 \u0432\u043f\u0435\u0440\u0448\u0435 \u0442\u0430 \u0431\u0435\u0437 \u043d\u0430\u043c\u0456\u0440\u0443 \u043e\u0442\u0440\u0438\u043c\u0430\u0442\u0438 \u0456\u0433\u0440\u043e\u0432\u0443 \u043f\u0435\u0440\u0435\u0432\u0430\u0433\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0445\u0438\u0441\u0442 \u041d\u043e\u0432\u0430\u0447\u043a\u0456\u0432\",\"id\":\"8.3\",\"text\":\"\u0417\u0430\u043c\u0456\u0441\u0442\u044c \u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u043e\u0433\u043e \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f (Jail/Warn/Ban) \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u0437\u0430\u0441\u0442\u043e\u0441\u0443\u0432\u0430\u0442\u0438 \u0442\u0430\u043a\u0443 \u043f\u0440\u043e\u0446\u0435\u0434\u0443\u0440\u0443:\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0445\u0438\u0441\u0442 \u041d\u043e\u0432\u0430\u0447\u043a\u0456\u0432\",\"id\":\"8.3.1\",\"text\":\"\u041d\u0430\u0434\u0456\u0441\u043b\u0430\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u044e \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f \u0432 \u043f\u0440\u0438\u0432\u0430\u0442\u043d\u0456 \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u0435\u043d\u043d\u044f (PM) \u0456\u0437 \u043a\u043e\u0440\u043e\u0442\u043a\u0438\u043c \u043f\u043e\u044f\u0441\u043d\u0435\u043d\u043d\u044f\u043c \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043e\u0433\u043e \u043f\u0443\u043d\u043a\u0442\u0443 \u043f\u0440\u0430\u0432\u0438\u043b \u0430\u0431\u043e \u0442\u0435\u043b\u0435\u043f\u043e\u0440\u0442\u0443\u0432\u0430\u0442\u0438\u0441\u044f \u0434\u043e \u0433\u0440\u0430\u0432\u0446\u044f \u0434\u043b\u044f \u043a\u043e\u0440\u043e\u0442\u043a\u043e\u0457 \u0443\u0441\u043d\u043e\u0457 \u0431\u0435\u0441\u0456\u0434\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0445\u0438\u0441\u0442 \u041d\u043e\u0432\u0430\u0447\u043a\u0456\u0432\",\"id\":\"8.3.2\",\"text\":\"\u0423 \u0440\u0430\u0437\u0456 \u043d\u0435\u043e\u0431\u0445\u0456\u0434\u043d\u043e\u0441\u0442\u0456 \u0442\u0438\u043c\u0447\u0430\u0441\u043e\u0432\u043e \u0437\u0430\u043c\u043e\u0440\u043e\u0437\u0438\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u044f \u0434\u043b\u044f \u043f\u043e\u0434\u0430\u043b\u044c\u0448\u0438\u0445 \u043f\u043e\u044f\u0441\u043d\u0435\u043d\u044c \u0442\u0430 \u0443\u043d\u0435\u043c\u043e\u0436\u043b\u0438\u0432\u043b\u0435\u043d\u043d\u044f \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e\u0433\u043e \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043f\u0440\u0430\u0432\u0438\u043b.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 8.3: \u043c\u0435\u0442\u0430 \u043f\u0440\u043e\u0446\u0435\u0434\u0443\u0440\u0438 \u2014 \u043d\u0430\u0432\u0447\u0430\u043d\u043d\u044f, \u0430 \u043d\u0435 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f. \u041f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f \u043c\u0430\u0454 \u0431\u0443\u0442\u0438 \u0434\u043e\u0431\u0440\u043e\u0437\u0438\u0447\u043b\u0438\u0432\u0438\u043c \u0456 \u043f\u043e\u044f\u0441\u043d\u044e\u0432\u0430\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u044e, \u044f\u043a \u0434\u0456\u044f\u0442\u0438 \u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u043e \u043d\u0430\u0434\u0430\u043b\u0456.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0445\u0438\u0441\u0442 \u041d\u043e\u0432\u0430\u0447\u043a\u0456\u0432\",\"id\":\"8.4\",\"text\":\"\u041f\u0456\u043b\u044c\u0433\u043e\u0432\u0438\u0439 \u0440\u0435\u0436\u0438\u043c \u043d\u0435 \u0437\u0430\u0441\u0442\u043e\u0441\u043e\u0432\u0443\u0454\u0442\u044c\u0441\u044f \u0443 \u0440\u0430\u0437\u0456: \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0447\u0438\u0442\u0456\u0432 \u0430\u0431\u043e \u0441\u0442\u043e\u0440\u043e\u043d\u043d\u044c\u043e\u0433\u043e \u041f\u0417, Mass DM, Mass TK, Mass SK \u0442\u0430 \u0456\u043d\u0448\u0438\u0445 \u043c\u0430\u0441\u043e\u0432\u0438\u0445 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u044c, \u043e\u0431\u0440\u0430\u0437\u0438 \u0440\u0456\u0434\u043d\u0438\u0445, \u0434\u0438\u0441\u043a\u0440\u0438\u043c\u0456\u043d\u0430\u0446\u0456\u0457, \u043f\u043e\u0433\u0440\u043e\u0437, \u0431\u0443\u0434\u044c- \u044f\u043a\u0438\u0445 \u0433\u0440\u043e\u0448\u043e\u0432\u0438\u0445 \u043c\u0430\u0445\u0456\u043d\u0430\u0446\u0456\u0439/\u0431\u0430\u0433\u043e\u044e\u0437\u0443, \u0448\u0430\u0445\u0440\u0430\u0439\u0441\u0442\u0432\u0430 \u0447\u0438 \u043e\u0431\u043c\u0430\u043d\u0443 \u0433\u0440\u0430\u0432\u0446\u0456\u0432.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0445\u0438\u0441\u0442 \u041d\u043e\u0432\u0430\u0447\u043a\u0456\u0432\",\"id\":\"8.5\",\"text\":\"\u041f\u0435\u0440\u0435\u0434 \u0437\u0430\u0441\u0442\u043e\u0441\u0443\u0432\u0430\u043d\u043d\u044f\u043c \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043f\u0435\u0440\u0435\u0432\u0456\u0440\u0438\u0442\u0438 \u0456\u0433\u0440\u043e\u0432\u0438\u0439 \u0440\u0456\u0432\u0435\u043d\u044c \u0433\u0440\u0430\u0432\u0446\u044f \u0447\u0435\u0440\u0435\u0437 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u0438\u0439 \u0444\u0443\u043d\u043a\u0446\u0456\u043e\u043d\u0430\u043b.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.1\",\"text\":\"\u0421\u0456\u043c'\u044f \u2014 \u0446\u0435 \u043d\u0435\u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0430 \u0456\u0433\u0440\u043e\u0432\u0430 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u044f, \u0441\u0442\u0432\u043e\u0440\u0435\u043d\u0430 \u0433\u0440\u0430\u0432\u0446\u044f\u043c\u0438 \u0441\u0430\u043c\u043e\u0441\u0442\u0456\u0439\u043d\u043e. \u0412\u043e\u043d\u0430 \u043d\u0435 \u043c\u0430\u0454 \u0434\u0435\u0440\u0436\u0430\u0432\u043d\u043e\u0433\u043e \u0441\u0442\u0430\u0442\u0443\u0441\u0443 \u0442\u0430 \u0434\u0456\u0454 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0432 \u0440\u0430\u043c\u043a\u0430\u0445 \u043d\u0435\u043b\u0435\u0433\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0430\u0431\u043e \u0437\u043c\u0456\u0448\u0430\u043d\u043e\u0433\u043e RP-\u043d\u0430\u043f\u0440\u044f\u043c\u043a\u0443, \u043e\u0431\u0440\u0430\u043d\u043e\u0433\u043e \u043b\u0456\u0434\u0435\u0440\u043e\u043c.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.2\",\"text\":\"\u0421\u0456\u043c'\u044f \u0442\u0430 \u0457\u0457 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0438 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0456 \u0434\u043e\u0442\u0440\u0438\u043c\u0443\u0432\u0430\u0442\u0438\u0441\u044c \u0443\u0441\u0456\u0445 \u0437\u0430\u0433\u0430\u043b\u044c\u043d\u0438\u0445 \u043f\u0440\u0430\u0432\u0438\u043b \u043f\u0440\u043e\u0454\u043a\u0442\u0443 \u0412\u0435\u0440\u0431\u0430 \u041e\u043d\u043b\u0430\u0439\u043d. \u041d\u0430\u043b\u0435\u0436\u043d\u0456\u0441\u0442\u044c \u0434\u043e \u0441\u0456\u043c'\u0457 \u043d\u0435 \u0434\u0430\u0454 \u0436\u043e\u0434\u043d\u0438\u0445 \u043f\u0440\u0438\u0432\u0456\u043b\u0435\u0457\u0432 \u0443 \u0440\u0430\u0437\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043f\u0440\u0430\u0432\u0438\u043b.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.3\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0441\u0456\u043c'\u0457 \u043d\u0435\u0441\u0435 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u0456\u0441\u0442\u044c \u0437\u0430 \u0434\u0456\u044f\u043b\u044c\u043d\u0456\u0441\u0442\u044c \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0457 \u0442\u0430 \u043f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0443 \u0457\u0457 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432 \u043f\u0435\u0440\u0435\u0434 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e \u043f\u0440\u043e\u0454\u043a\u0442\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.4\",\"text\":\"\u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0440\u043e\u0437\u043f\u0443\u0441\u0442\u0438\u0442\u0438 \u0441\u0456\u043c'\u044e \u0443 \u0440\u0430\u0437\u0456 \u0441\u0438\u0441\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u043d\u0438\u0445 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u044c \u043f\u0440\u0430\u0432\u0438\u043b \u0457\u0457 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0430\u043c\u0438, \u0431\u0435\u0437\u0434\u0456\u044f\u043b\u044c\u043d\u043e\u0441\u0442\u0456 \u043b\u0456\u0434\u0435\u0440\u0430 \u0430\u0431\u043e \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e\u0457 \u0448\u043a\u043e\u0434\u0438 \u0456\u0433\u0440\u043e\u0432\u043e\u043c\u0443 \u043f\u0440\u043e\u0446\u0435\u0441\u0443.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 1.4: \u0420\u043e\u0437\u043f\u0443\u0441\u043a \u0441\u0456\u043c'\u0457 \u0454 \u043a\u0440\u0430\u0439\u043d\u0456\u043c \u0437\u0430\u0445\u043e\u0434\u043e\u043c \u0456 \u0437\u0430\u0441\u0442\u043e\u0441\u043e\u0432\u0443\u0454\u0442\u044c\u0441\u044f \u043f\u0456\u0441\u043b\u044f \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u043d\u0456\u0445 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u044c, \u044f\u043a\u0449\u043e \u0441\u0438\u0442\u0443\u0430\u0446\u0456\u044f \u043d\u0435 \u0431\u0443\u043b\u0430 \u0432\u0438\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0430. \u0423 \u0432\u0438\u043f\u0430\u0434\u043a\u0443 \u0433\u0440\u0443\u0431\u0438\u0445 \u0430\u0431\u043e \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u0438\u0445 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u044c \u2014 \u0431\u0435\u0437 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.5\",\"text\":\"\u041d\u0430\u0437\u0432\u0430 \u0441\u0456\u043c'\u0457 \u043c\u0430\u0454 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u0442\u0438 \u0437\u0430\u0433\u0430\u043b\u044c\u043d\u043e\u043c\u0443 RP-\u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u0443 \u043f\u0440\u043e\u0454\u043a\u0442\u0443. \u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u044e\u0442\u044c\u0441\u044f \u043d\u0430\u0437\u0432\u0438 \u0437 \u043d\u0435\u0446\u0435\u043d\u0437\u0443\u0440\u043d\u043e\u044e \u043b\u0435\u043a\u0441\u0438\u043a\u043e\u044e, \u043e\u0431\u0440\u0430\u0437\u0430\u043c\u0438, \u0440\u0435\u043a\u043b\u0430\u043c\u043e\u044e \u0430\u0431\u043e \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u0438\u043c \u043a\u043e\u043f\u0456\u044e\u0432\u0430\u043d\u043d\u044f\u043c \u043d\u0430\u0437\u0432 \u0432\u0436\u0435 \u0456\u0441\u043d\u0443\u044e\u0447\u0438\u0445 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0439.\",\"punishment\":\"\u041f\u0440\u0438\u043c\u0443\u0441\u043e\u0432\u0430 \u0437\u043c\u0456\u043d\u0430 \u043d\u0430\u0437\u0432\u0438 / \u0412\u0438\u0434\u0430\u043b\u0435\u043d\u043d\u044f \u0441\u0456\u043c'\u0457\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438 \u041b\u0456\u0434\u0435\u0440\u0430 \u0421\u0456\u043c'\u0407\",\"id\":\"2.1\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0441\u0456\u043c'\u0457 \u043d\u0435\u0441\u0435 \u043f\u043e\u0432\u043d\u0443 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u0456\u0441\u0442\u044c \u0437\u0430 \u043c\u043e\u0434\u0435\u0440\u0430\u0446\u0456\u044e \u043f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u0441\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443. \u0412\u0456\u043d \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043d\u0435 \u043b\u0438\u0448\u0435 \u0441\u0442\u0435\u0436\u0438\u0442\u0438 \u0437\u0430 \u0434\u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f\u043c \u043f\u0440\u0430\u0432\u0438\u043b \u043f\u0440\u043e\u0454\u043a\u0442\u0443, \u0430 \u0439 \u043f\u0440\u043e\u0430\u043a\u0442\u0438\u0432\u043d\u043e \u043a\u043e\u043d\u0442\u0440\u043e\u043b\u044e\u0432\u0430\u0442\u0438 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432: \u043f\u0440\u0438\u043f\u0438\u043d\u044f\u0442\u0438 \u043a\u043e\u043d\u0444\u043b\u0456\u043a\u0442\u0438 \u043d\u0430 \u0435\u0442\u0430\u043f\u0456 \u0457\u0445 \u0437\u0430\u0440\u043e\u0434\u0436\u0435\u043d\u043d\u044f, \u0437\u0430\u0441\u0442\u043e\u0441\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u0456 \u0441\u0430\u043d\u043a\u0446\u0456\u0457 \u0434\u043e \u043f\u043e\u0440\u0443\u0448\u043d\u0438\u043a\u0456\u0432 (\u0430\u0436 \u0434\u043e \u0432\u0438\u043a\u043b\u044e\u0447\u0435\u043d\u043d\u044f) \u0442\u0430 \u043d\u0435 \u0447\u0435\u043a\u0430\u0442\u0438 \u0432\u0442\u0440\u0443\u0447\u0430\u043d\u043d\u044f \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457. \u0421\u0456\u043c'\u044f, \u044f\u043a\u0430 \u043f\u043e\u043a\u0440\u0438\u0432\u0430\u0454 \u0442\u043e\u043a\u0441\u0438\u0447\u043d\u0438\u0445 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0430\u0431\u043e \u043f\u043e\u0440\u0443\u0448\u043d\u0438\u043a\u0456\u0432, \u043d\u0435\u0441\u0442\u0438\u043c\u0435 \u0441\u043e\u043b\u0456\u0434\u0430\u0440\u043d\u0443 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u0456\u0441\u0442\u044c.\",\"punishment\":\"\u0423\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f / \u0414\u043e\u0433\u0430\u043d\u0430 \u0441\u0456\u043c'\u0457 - \u0437\u0430\u043b\u0435\u0436\u043d\u043e \u0432\u0456\u0434 \u0441\u0438\u0441\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u043d\u043e\u0441\u0442\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u044c \u0441\u043a\u043b\u0430\u0434\u0443]\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438 \u041b\u0456\u0434\u0435\u0440\u0430 \u0421\u0456\u043c'\u0407\",\"id\":\"2.2\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043c\u043e\u0434\u0435\u0440\u0443\u0432\u0430\u0442\u0438 \u0441\u043a\u043b\u0430\u0434 \u0441\u0432\u043e\u0454\u0457 \u0441\u0456\u043c'\u0457: \u043a\u043e\u043d\u0442\u0440\u043e\u043b\u044e\u0432\u0430\u0442\u0438 \u0437\u043d\u0430\u043d\u043d\u044f \u043f\u0440\u0430\u0432\u0438\u043b \u0441\u0435\u0440\u0432\u0435\u0440\u0430, \u043f\u0440\u043e\u0432\u043e\u0434\u0438\u0442\u0438 \u0456\u043d\u0441\u0442\u0440\u0443\u043a\u0442\u0430\u0436\u0456 \u0434\u043b\u044f \u043d\u043e\u0432\u0430\u0447\u043a\u0456\u0432 \u0442\u0430 \u0441\u0430\u043c\u043e\u0441\u0442\u0456\u0439\u043d\u043e \u0432\u0438\u043a\u043b\u044e\u0447\u0430\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u0456\u0432, \u044f\u043a\u0456 \u0441\u0438\u0441\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u043d\u043e \u043f\u043e\u0440\u0443\u0448\u0443\u044e\u0442\u044c \u043f\u0440\u0430\u0432\u0438\u043b\u0430.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438 \u041b\u0456\u0434\u0435\u0440\u0430 \u0421\u0456\u043c'\u0407\",\"id\":\"2.3\",\"text\":\"\u0417\u0430 \u0441\u0435\u0440\u0439\u043e\u0437\u043d\u0456 \u043c\u0430\u0441\u043e\u0432\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0432\u0456\u0434 \u0441\u043a\u043b\u0430\u0434\u0443 (\u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0447\u0438\u0442\u0456\u0432, \u043c\u0430\u0441\u043e\u0432\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f, \u0431\u0430\u0433\u043e\u044e\u0437) \u0441\u0456\u043c'\u044f \u043c\u043e\u0436\u0435 \u043e\u0442\u0440\u0438\u043c\u0430\u0442\u0438 \u0434\u043e\u0433\u0430\u043d\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438 \u041b\u0456\u0434\u0435\u0440\u0430 \u0421\u0456\u043c'\u0407\",\"id\":\"2.4\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0442\u0430 \u0439\u043e\u0433\u043e \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0438 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0456 \u043f\u0456\u0434\u0442\u0440\u0438\u043c\u0443\u0432\u0430\u0442\u0438 \u0430\u0434\u0435\u043a\u0432\u0430\u0442\u043d\u0443 \u0430\u0442\u043c\u043e\u0441\u0444\u0435\u0440\u0443 \u0432\u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0456 \u0441\u0456\u043c'\u0457. \u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0447\u043d\u043e \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0456\u0433\u043d\u043e\u0440\u0443\u0432\u0430\u0442\u0438, \u043f\u043e\u043a\u0440\u0438\u0432\u0430\u0442\u0438 \u0430\u0431\u043e \u0437\u0430\u043e\u0445\u043e\u0447\u0443\u0432\u0430\u0442\u0438 \u0442\u043e\u043a\u0441\u0438\u0447\u043d\u0443 \u043f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0443, \u043e\u0431\u0440\u0430\u0437\u0438 \u0456\u043d\u0448\u0438\u0445 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0447\u0438 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457.\",\"punishment\":\"\u0423\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438 \u041b\u0456\u0434\u0435\u0440\u0430 \u0421\u0456\u043c'\u0407\",\"id\":\"2.5\",\"text\":\"\u0423 \u0440\u0430\u0437\u0456 \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0441\u0438\u0441\u0442\u0435\u043c\u043d\u043e\u0457 \u0434\u043e\u0433\u0430\u043d\u0438 \u0432\u0456\u0434 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457, \u043b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0443\u0432\u0430\u0442\u0438 \u0457\u0457 \u0441\u0432\u043e\u0454\u0447\u0430\u0441\u043d\u0435 \u0437\u043d\u044f\u0442\u0442\u044f. \u0406\u0433\u043d\u043e\u0440\u0443\u0432\u0430\u043d\u043d\u044f \u043d\u0430\u043a\u043e\u043f\u0438\u0447\u0435\u043d\u0438\u0445 \u0434\u043e\u0433\u0430\u043d \u0432\u0435\u0434\u0435 \u0434\u043e \u0432\u0438\u0434\u0430\u043b\u0435\u043d\u043d\u044f \u0441\u0456\u043c'\u0457.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438 \u041b\u0456\u0434\u0435\u0440\u0430 \u0421\u0456\u043c'\u0407\",\"id\":\"2.6\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0438 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0456 \u043e\u043f\u0435\u0440\u0430\u0442\u0438\u0432\u043d\u043e \u0440\u0435\u0430\u0433\u0443\u0432\u0430\u0442\u0438 \u043d\u0430 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0456 \u0437\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 (\u043d\u0430\u043f\u0440\u0438\u043a\u043b\u0430\u0434, \u0432\u0438\u043c\u043e\u0433\u0430 \u043a\u0456\u043a\u043d\u0443\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u044f \u0437 \u0441\u043e\u0444\u0442\u043e\u043c \u0430\u0431\u043e \u043d\u0430\u0434\u0430\u0442\u0438 \u043f\u043e\u044f\u0441\u043d\u0435\u043d\u043d\u044f \u0449\u043e\u0434\u043e \u043c\u0430\u0441\u043e\u0432\u043e\u0457 \u043f\u0435\u0440\u0435\u0441\u0442\u0440\u0456\u043b\u043a\u0438). \u0423\u043c\u0438\u0441\u043d\u0435 \u0456\u0433\u043d\u043e\u0440\u0443\u0432\u0430\u043d\u043d\u044f \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u043f\u0440\u0438\u0440\u0456\u0432\u043d\u044e\u0454\u0442\u044c\u0441\u044f \u0434\u043e \u0441\u0430\u0431\u043e\u0442\u0430\u0436\u0443.\",\"punishment\":\"\u0423\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f / \u0414\u043e\u0433\u0430\u043d\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438 \u041b\u0456\u0434\u0435\u0440\u0430 \u0421\u0456\u043c'\u0407\",\"id\":\"2.7\",\"text\":\"\u041f\u0440\u043e\u0434\u0430\u0436, \u043e\u0431\u043c\u0456\u043d \u0430\u0431\u043e \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u043b\u0456\u0434\u0435\u0440\u0441\u0442\u0432\u0430 \u0432 \u0441\u0456\u043c'\u0457 \u0456\u043d\u0448\u043e\u043c\u0443 \u0433\u0440\u0430\u0432\u0446\u0435\u0432\u0456 \u0437\u0430 \u0440\u0435\u0430\u043b\u044c\u043d\u0456 \u0433\u0440\u043e\u0448\u0456 \u0447\u0438 \u043f\u043e\u0441\u043b\u0443\u0433\u0438 \u043f\u043e\u0437\u0430 \u0433\u0440\u043e\u044e \u2014 \u0441\u0443\u0432\u043e\u0440\u043e \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u0456. \u0411\u0443\u0434\u044c-\u044f\u043a\u0430 \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u043f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u044c \u043c\u0430\u0454 \u0432\u0456\u0434\u0431\u0443\u0432\u0430\u0442\u0438\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0447\u0435\u0440\u0435\u0437 \u043b\u0435\u0433\u0430\u043b\u044c\u043d\u0438\u0439 \u0456\u0433\u0440\u043e\u0432\u0438\u0439 \u0444\u0443\u043d\u043a\u0446\u0456\u043e\u043d\u0430\u043b.\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f + \u0432\u0438\u0434\u0430\u043b\u0435\u043d\u043d\u044f \u0441\u0456\u043c'\u0457\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432\",\"id\":\"3.1\",\"text\":\"\u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0430\u043c \u0441\u0456\u043c\u0435\u0439 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0447\u043d\u043e \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u043b\u0430\u0448\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u043c\u0456\u0436\u0441\u0456\u043c\u0435\u0439\u043d\u0456 \u0437\u0431\u0440\u043e\u0439\u043d\u0456 \u043a\u043e\u043d\u0444\u043b\u0456\u043a\u0442\u0438 (\u043f\u0435\u0440\u0435\u0441\u0442\u0440\u0456\u043b\u043a\u0438 \u043c\u0456\u0436 \u0432\u043e\u0440\u043e\u0433\u0443\u044e\u0447\u0438\u043c\u0438 \u0441\u0456\u043c'\u044f\u043c\u0438) \u043d\u0430 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u044f\u0445 \u0417\u0435\u043b\u0435\u043d\u0438\u0445 \u0417\u043e\u043d (GZ), \u0433\u0440\u043e\u043c\u0430\u0434\u0441\u044c\u043a\u0438\u0445 \u043c\u0456\u0441\u0446\u044c, \u0440\u043e\u0431\u0456\u0442 \u0434\u043b\u044f \u043d\u043e\u0432\u0430\u0447\u043a\u0456\u0432, \u0436\u0438\u0442\u043b\u043e\u0432\u0438\u0445 \u043a\u043e\u043c\u043f\u043b\u0435\u043a\u0441\u0456\u0432 \u0442\u0430 \u0431\u0456\u043b\u044f \u0442\u043e\u0447\u043e\u043a \u0441\u043f\u0430\u0432\u043d\u0443/\u0432\u0438\u0445\u043e\u0434\u0443 \u0437 \u0456\u043d\u0442\u0435\u0440'\u0454\u0440\u0456\u0432. \u0412\u0430\u0436\u043b\u0438\u0432\u043e: \u043d\u0430\u044f\u0432\u043d\u0456\u0441\u0442\u044c \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u0457 \\\"RP-\u043f\u0440\u0438\u0447\u0438\u043d\u0438\\\" \u0430\u0431\u043e IC-\u043a\u043e\u043d\u0444\u043b\u0456\u043a\u0442\u0443 \u041d\u0415 \u0454 \u0432\u0438\u043f\u0440\u0430\u0432\u0434\u0430\u043d\u043d\u044f\u043c \u0434\u043b\u044f \u0441\u0442\u0440\u0456\u043b\u044f\u043d\u0438\u043d\u0438 \u0447\u0438 \u043d\u0430\u043d\u0435\u0441\u0435\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u0443 \u0437\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0445 \u043b\u043e\u043a\u0430\u0446\u0456\u044f\u0445. \u0423\u0441\u0456 \u043a\u043e\u043d\u0444\u043b\u0456\u043a\u0442\u0438 \u0432 GZ \u0432\u0438\u0440\u0456\u0448\u0443\u044e\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0447\u0435\u0440\u0435\u0437 \u0434\u0456\u0430\u043b\u043e\u0433 \u0430\u0431\u043e \u043f\u0435\u0440\u0435\u043d\u043e\u0441\u044f\u0442\u044c\u0441\u044f \u0443 \u0434\u043e\u0437\u0432\u043e\u043b\u0435\u043d\u0456 \u0437\u043e\u043d\u0438.\",\"punishment\":\"Jail 60-120 \u0445\u0432\u0438\u043b\u0438\u043d / Warn / Ban 3 \u0434\u043d\u0456 + \u0414\u043e\u0433\u0430\u043d\u0430 \u0441\u0456\u043c'\u0457 \u0443 \u0440\u0430\u0437\u0456 \u043c\u0430\u0441\u043e\u0432\u043e\u0433\u043e \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f]\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432\",\"id\":\"3.2\",\"text\":\"\u0414\u043e\u0437\u0432\u043e\u043b\u0435\u043d\u0456 \u043b\u043e\u043a\u0430\u0446\u0456\u0457 \u0434\u043b\u044f \u0441\u0438\u043b\u043e\u0432\u043e\u0433\u043e \u0432\u0438\u0440\u0456\u0448\u0435\u043d\u043d\u044f \u043a\u043e\u043d\u0444\u043b\u0456\u043a\u0442\u0456\u0432 (\u043f\u0435\u0440\u0435\u0441\u0442\u0440\u0456\u043b\u043e\u043a): \u0431\u0435\u0437\u043b\u044e\u0434\u043d\u0456 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0457, \u0437\u0430\u043a\u0438\u043d\u0443\u0442\u0456 \u043f\u0440\u043e\u043c\u0438\u0441\u043b\u043e\u0432\u0456 \u0437\u043e\u043d\u0438, \u043f\u0443\u0441\u0442\u0438\u0449\u0430, \u043b\u0456\u0441\u0438 \u0442\u0430 \u043f\u043e\u043b\u044f \u0437\u0430 \u043c\u0435\u0436\u0430\u043c\u0438 \u043c\u0456\u0441\u044c\u043a\u043e\u0457 \u0437\u0430\u0431\u0443\u0434\u043e\u0432\u0438 (\u0437\u0430 \u0443\u043c\u043e\u0432\u0438 \u0432\u0456\u0434\u0441\u0443\u0442\u043d\u043e\u0441\u0442\u0456 \u0442\u0430\u043c \u0437\u0432\u0438\u0447\u0430\u0439\u043d\u0438\u0445 \u0433\u0440\u0430\u0432\u0446\u0456\u0432).\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432\",\"id\":\"3.3\",\"text\":\"\u041a\u043e\u0436\u043d\u0430 \u0441\u0456\u043c'\u044f \u043c\u0
