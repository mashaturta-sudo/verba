u0435\u043e\u0437\u0430\u043f\u0438\u0441\u0456 \u0432\u0456\u0434\u0441\u0443\u0442\u043d\u0456\u0439 \u0437\u0432\u0443\u043a, \u044f\u043a\u0438\u0439 \u0454 \u043d\u0435\u043e\u0431\u0445\u0456\u0434\u043d\u0438\u043c \u0434\u043b\u044f \u043f\u0456\u0434\u0442\u0432\u0435\u0440\u0434\u0436\u0435\u043d\u043d\u044f \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f. \u0412\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e \u0434\u043e \u043f. 3.7 \u043f\u0440\u0430\u0432\u0438\u043b \u0441\u043a\u0430\u0440\u0433\u0430 \u043d\u0435 \u043c\u043e\u0436\u0435 \u0431\u0443\u0442\u0438 \u0440\u043e\u0437\u0433\u043b\u044f\u043d\u0443\u0442\u0430.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043f\u043e\u0434\u0430\u0447\u0456 \u0441\u043a\u0430\u0440\u0433\",\"section\":\"\u0412\u0438\u043c\u043e\u0433\u0438 \u0434\u043e \u0434\u043e\u043a\u0430\u0437\u0456\u0432\",\"id\":\"3.8\",\"text\":\"\u0421\u043a\u0430\u0440\u0433\u0443 \u0432\u0456\u0434\u0445\u0438\u043b\u0435\u043d\u043e. \u0421\u043a\u0430\u0440\u0433\u0430 \u043e\u0444\u043e\u0440\u043c\u043b\u0435\u043d\u0430 \u043d\u0435\u0447\u0438\u0442\u0430\u0431\u0435\u043b\u044c\u043d\u043e \u0430\u0431\u043e \u0457\u0457 \u0437\u043c\u0456\u0441\u0442 \u043d\u0435\u043c\u043e\u0436\u043b\u0438\u0432\u043e \u043a\u043e\u0440\u0435\u043a\u0442\u043d\u043e \u0437\u0440\u043e\u0437\u0443\u043c\u0456\u0442\u0438, \u0449\u043e \u0454 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f\u043c \u043f. 3.8 \u043f\u0440\u0430\u0432\u0438\u043b.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043f\u043e\u0434\u0430\u0447\u0456 \u0441\u043a\u0430\u0440\u0433\",\"section\":\"\u0412\u0438\u043c\u043e\u0433\u0438 \u0434\u043e \u0434\u043e\u043a\u0430\u0437\u0456\u0432\",\"id\":\"3.9\",\"text\":\"\u0421\u043a\u0430\u0440\u0433\u0443 \u0432\u0456\u0434\u0445\u0438\u043b\u0435\u043d\u043e. \u0412\u0456\u0434\u0435\u043e\u0434\u043e\u043a\u0430\u0437 \u0442\u0440\u0438\u0432\u0430\u0454 \u043f\u043e\u043d\u0430\u0434 5 \u0445\u0432\u0438\u043b\u0438\u043d\u0438, \u043e\u0434\u043d\u0430\u043a \u0442\u0430\u0439\u043c-\u043a\u043e\u0434\u0438 \u043c\u043e\u043c\u0435\u043d\u0442\u0456\u0432 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043d\u0435 \u0431\u0443\u043b\u0438 \u0432\u043a\u0430\u0437\u0430\u043d\u0456. \u0412\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e \u0434\u043e \u043f. 3.9 \u043f\u0440\u0430\u0432\u0438\u043b \u0441\u043a\u0430\u0440\u0433\u0443 \u0432\u0456\u0434\u0445\u0438\u043b\u0435\u043d\u043e.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"}]";
const state={view:'rules',category:'Усі',search:'',screens:[],selected:new Set(),font:1};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').toLowerCase().replace(/ё/g,'е').trim();
function uniqueSections(){return new Set(RULES.map(r=>r.category+'|'+r.section)).size}
function setStatus(t){$('status').textContent=t}
function renderStats(){$('totalRules').textContent=RULES.length;$('totalSections').textContent=uniqueSections();$('totalPoints').textContent=RULES.length}
function score(q,r){q=norm(q);if(!q)return 0;let s=0;for(const x of [r.id,r.text,r.category,r.section,r.punishment,r.notes,r.examples]){const y=norm(x);if(y.includes(q))s+= y===q?100: y.startsWith(q)?50:20}return s}
function filteredRules(){let q=state.search;let arr=RULES.filter(r=>state.category==='Усі'||r.category===state.category);if(!q)return arr;return arr.map(r=>[score(q,r),r]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1])}
function renderCategories(){const cats=['Усі',...Array.from(new Set(RULES.map(r=>r.category)))];$('categories').innerHTML=cats.map(c=>`<div class="category" data-cat="${esc(c)}"><h3>${c==='Усі'?'📚': '📂'} ${esc(c)}</h3><p>${c==='Усі'?RULES.length:RULES.filter(r=>r.category===c).length} правил</p></div>`).join('');document.querySelectorAll('.category').forEach(el=>el.onclick=()=>{state.category=el.dataset.cat;render()})}
function renderRules(){const arr=filteredRules();$('rulesTitle').textContent=state.search?`Результати пошуку: ${arr.length}`:(state.category==='Усі'?'Правила':state.category);$('rulesList').innerHTML=arr.length?arr.map(r=>`<article class="rule" data-id="${esc(r.id)}"><div class="rule-head"><div class="rid">${esc(r.id)}</div><div class="rtext">${esc(r.text)}</div></div>${r.punishment?`<div class="pun">⚖️ ${esc(r.punishment)}</div>`:''}<div class="meta">${esc(r.section)}${r.notes?` · ${esc(r.notes)}`:''}</div></article>`).join(''):`<div class="empty">Нічого не знайдено.</div>`;document.querySelectorAll('.rule').forEach(el=>el.onclick=()=>openRule(el.dataset.id))}
function render(){renderStats();renderCategories();renderRules();}
function openRule(id){const r=RULES.find(x=>x.id===id);if(!r)return;alert(`${r.id} — ${r.text}\n\n${r.punishment?'Покарання: '+r.punishment+'\n\n':''}${r.notes?'Примітка: '+r.notes+'\n\n':''}${r.examples?'Приклад: '+r.examples:''}`)}
function switchView(v){state.view=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('show'));$(v==='rules'?'rulesView':v==='assistant'?'assistantView':v==='complaint'?'complaintView':v==='quick'?'quickView':'feedbackView').classList.add('show');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===v));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchView(b.dataset.view));
$('search').oninput=e=>{state.search=e.target.value;state.category='Усі';renderRules()};
$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('verbaguide-theme',document.body.classList.contains('dark')?'dark':'light');$('themeBtn').textContent=document.body.classList.contains('dark')?'☀':'☾';$('themeColor').content=document.body.classList.contains('dark')?'#061A4F':'#9DE8FF'};
if(localStorage.getItem('verbaguide-theme')==='dark'){$('themeBtn').click()}
$('fontBtn').onclick=()=>{state.font=state.font===1?1.12:state.font===1.12?1.25:1;document.documentElement.style.fontSize=(16*state.font)+'px'};
$('infoBtn').onclick=()=>alert('VerbaGuide — офіційний збірник правил Verba Online. Пошук працює за номером, текстом та ключовими словами. Розгляд скарги дозволяє додавати YouTube-докази, кілька скриншотів та одночасно обирати кілька порушень.');
function youtubeId(url){try{const u=new URL(url);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);if(u.searchParams.get('v'))return u.searchParams.get('v');const p=u.pathname.split('/');const i=p.findIndex(x=>x==='shorts'||x==='embed');return i>=0?p[i+1]:''}catch(e){return ''}}
$('youtubeUrl').oninput=e=>{const id=youtubeId(e.target.value);$('videoPreview').innerHTML=id?`<div class="video"><iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}" allowfullscreen></iframe></div>`:''};
$('screenInput').onchange=e=>{for(const file of e.target.files){const url=URL.createObjectURL(file);state.screens.push({file,url})}renderScreens();e.target.value=''};
function renderScreens(){$('screens').innerHTML=state.screens.map((s,i)=>`<div class="shot"><button class="remove" data-i="${i}">×</button><img src="${s.url}" alt="Скріншот ${i+1}"><span>${esc(s.file.name)}</span></div>`).join('');document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;URL.revokeObjectURL(state.screens[i].url);state.screens.splice(i,1);renderScreens()})}
function complaintCandidates(){const q=$('violationQuery').value;let arr=RULES.map(r=>[score(q,r),r]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,15);if(!q)arr=RULES.slice(0,15).map(r=>[1,r]);$('complaintRules').innerHTML=arr.map(([s,r])=>`<label class="check"><input type="checkbox" data-rule="${esc(r.id)}" ${state.selected.has(r.id)?'checked':''}><span><b>${esc(r.id)}</b> — ${esc(r.text)}${r.punishment?`<br><span class="meta">⚖️ ${esc(r.punishment)}</span>`:''}</span></label>`).join('');document.querySelectorAll('#complaintRules input').forEach(c=>c.onchange=()=>{c.checked?state.selected.add(c.dataset.rule):state.selected.delete(c.dataset.rule)})}
$('violationQuery').oninput=complaintCandidates;
function selectedRules(){return RULES.filter(r=>state.selected.has(r.id))}
document.querySelectorAll('input[name="decision"]').forEach(r=>r.onchange=()=>document.querySelectorAll('.status-choice').forEach(x=>x.classList.toggle('active',x.querySelector('input').checked)));
function makeAnswer(){const situation=$('complaintSituation').value.trim();const status=document.querySelector('input[name="decision"]:checked').value;const rules=selectedRules();let text=`Рішення за скаргою: ${status}.\n\n`;if(situation)text+=`Суть ситуації:\n${situation}\n\n`;if(rules.length)text+=`Встановлені пункти правил:\n${rules.map(r=>`• ${r.id} — ${r.text}`).join('\n')}\n\n`;if($('youtubeUrl').value.trim())text+=`YouTube-доказ: ${$('youtubeUrl').value.trim()}\n\n`;if(state.screens.length)text+=`Додано скриншотів: ${state.screens.length}\n\n`;if($('otherEvidence').value.trim())text+=`Додаткові докази:\n${$('otherEvidence').value.trim()}\n\n`;if(status==='Схвалено')text+='Скаргу схвалено. Рішення прийнято на підставі наданих доказів та відповідних пунктів правил.';else if(status==='Відхилено')text+='Скаргу відхилено. Наданих матеріалів недостатньо для підтвердження порушення або підстави для задоволення скарги відсутні.';else text+='Скарга залишена на розгляді. Необхідна додаткова перевірка наданих матеріалів.';$('complaintResult').textContent=text;return text}
$('makeAnswer').onclick=makeAnswer;$('copyAnswer').onclick=async()=>{const t=makeAnswer();try{await navigator.clipboard.writeText(t);$('copyAnswer').textContent='✓ Скопійовано';setTimeout(()=>$('copyAnswer').textContent='Копіювати відповідь',1400)}catch(e){alert('Не вдалося скопіювати автоматично. Виділи текст відповіді вручну.')}};
$('assistantBtn').onclick=()=>{const q=$('assistantText').value.trim();const arr=RULES.map(r=>[score(q,r),r]).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).slice(0,8);$('assistantResults').innerHTML=arr.length?`<div class="card"><div class="section-title">Можливі відповідності</div>${arr.map(([s,r])=>`<div class="ai-match"><b>${esc(r.id)} — ${esc(r.text)}</b><span class="meta">Релевантність: ${Math.min(99,Math.max(50,s))}%</span>${r.punishment?`<br>⚖️ ${esc(r.punishment)}`:''}</div>`).join('')}</div>`:'<div class="empty">Не знайшов достатньо схожих правил. Спробуй описати ситуацію детальніше.</div>'};
$('copyFeedback').onclick=async()=>{const t=$('feedbackText').value.trim();if(!t)return;try{await navigator.clipboard.writeText(t);$('copyFeedback').textContent='✓ Скопійовано';setTimeout(()=>$('copyFeedback').textContent='Скопіювати текст',1400)}catch(e){alert('Не вдалося скопіювати.')}};

['Не в той розділ','Вітаю, шановний гравець!\n\nВашу скаргу відхилено ❌\n\nПричина: подання скарги не у відповідний розділ.\n\nПеренаправляю Вас у відповідний розділ скарг.\n\nЗ повагою, **Куратор Скарг** 🫡'],
['Відсутні докази','Вітаю, шановний гравець!\n\nВашу скаргу було закрито у зв’язку з недостатньою кількістю доказів. Наданих матеріалів недостатньо для підтвердження факту порушення та винесення об’єктивного рішення.\n\nУ разі наявності додаткових доказів Ви можете повторно звернутися, оформивши нову скаргу відповідно до правил проєкту.\n\nДякуємо за Ваше звернення!\n\nЗ повагою, **Куратор Скарг**'],
['Скарга схвалена','Вітаю, шановний гравець!\n\nВашу скаргу було уважно розглянуто адміністрацією. За результатами перевірки наданих доказів встановлено факт порушення правил проєкту.\n\n**Скаргу схвалено.** Гравець отримає відповідне покарання згідно з чинними правилами проєкту.\n\nДякуємо за Вашу небайдужість та допомогу в підтриманні порядку на сервері!\n\nЗ повагою, **Куратор Скарг**']
];
function quickBlock(items){return items.map(([title,text])=>`<div class="rule"><div class="rule-head"><div class="rtext">${esc(title)}</div></div><div class="meta" style="white-space:pre-wrap">${esc(text)}</div><div class="actions"><button class="secondary copy-template" data-text="${esc(text)}">📋 Копіювати</button></div></div>`).join('')}
$('quickContent').innerHTML=`<div class="section-title">⚡ Відповіді на репорти</div>${quickBlock(QUICK)}<div class="section-title" style="margin-top:24px">🛡️ Відповіді по скаргах</div>${quickBlock(COMPLAINT_QUICK)}`;
document.querySelectorAll('.copy-template').forEach(b=>b.onclick=async()=>{const t=b.dataset.text;try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const old=b.textContent;b.textContent='✓ Скопійовано';setTimeout(()=>b.textContent=old,1400)});
render();setStatus(`🟢 Вбудовані правила готові: ${RULES.length}. Оновлення з rules.json підключаються автоматично при роботі через сайт/сервер.`);
if(location.protocol!=='file:'){fetch('./rules.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject()).then(data=>{if(Array.isArray(data)){RULES.splice(0,RULES.length,...data);render();setStatus(`🟢 Правила оновлено з rules.json: ${RULES.length}`)}}).catch(()=>{})}
</script></body></html>
