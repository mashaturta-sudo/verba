43d\u043d\u044f, \u0432\u0438\u0434\u0430\u0432\u0430\u0442\u0438 \u0440\u043e\u0437\u0448\u0443\u043a, \u043d\u0430\u0434\u044f\u0433\u0430\u0442\u0438 \u043a\u0430\u0439\u0434\u0430\u043d\u043a\u0438, \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0442\u0430\u0439\u0437\u0435\u0440, \u0442\u043e\u0449\u043e.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u0441\u044c\u043a\u043e\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0411\u043e\u0439\u043e\u0432\u043e\u0457 \u0417\u043e\u043d\u0438\",\"id\":\"2.8\",\"text\":\"\u041d\u0430 \u0441\u043a\u043b\u0430\u0434\u0456 \u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f NonRP \u2014 \u0431\u0443\u0434\u044c-\u044f\u043a\u0456 \u0434\u0456\u0457, \u0449\u043e \u0441\u0443\u043f\u0435\u0440\u0435\u0447\u0430\u0442\u044c \u043b\u043e\u0433\u0456\u0446\u0456 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0441\u0432\u0456\u0442\u0443, \u0440\u0443\u0439\u043d\u0443\u044e\u0442\u044c \u0440\u043e\u043b\u044c\u043e\u0432\u0443 \u0430\u0442\u043c\u043e\u0441\u0444\u0435\u0440\u0443 \u0430\u0431\u043e \u043d\u0435 \u043c\u0430\u044e\u0442\u044c \u0436\u043e\u0434\u043d\u043e\u0433\u043e \u043e\u0431\u0491\u0440\u0443\u043d\u0442\u0443\u0432\u0430\u043d\u043d\u044f \u0437 \u0442\u043e\u0447\u043a\u0438 \u0437\u043e\u0440\u0443 \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436\u0430.\",\"punishment\":\"Jail 20 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u0441\u044c\u043a\u043e\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0411\u043e\u0439\u043e\u0432\u043e\u0457 \u0417\u043e\u043d\u0438\",\"id\":\"2.9\",\"text\":\"\u041d\u0430 \u0441\u043a\u043b\u0430\u0434\u0456 \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0430\u043f\u0442\u0435\u0447\u043e\u043a \u043f\u0456\u0434 \u0447\u0430\u0441 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0433\u043e \u0431\u043e\u044e \u0442\u0430 \u043f\u0435\u0440\u0435\u0441\u0442\u0440\u0456\u043b\u043a\u0438.\",\"punishment\":\"Jail 20 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.1\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u2014 \u0446\u0435 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u0430 \u0456\u0433\u0440\u043e\u0432\u0430 \u043f\u043e\u0441\u0430\u0434\u0430, \u0449\u043e \u043f\u0435\u0440\u0435\u0434\u0431\u0430\u0447\u0430\u0454 \u043a\u0435\u0440\u0456\u0432\u043d\u0438\u0446\u0442\u0432\u043e \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0454\u044e, \u043f\u0456\u0434\u0442\u0440\u0438\u043c\u043a\u0443 \u0457\u0457 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0441\u0442\u0456 \u0442\u0430 \u0434\u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u043f\u0440\u0430\u0432\u0438\u043b \u043f\u0440\u043e\u0454\u043a\u0442\u0443. \u041b\u0456\u0434\u0435\u0440 \u0454 \u043e\u0431\u043b\u0438\u0447\u0447\u044f\u043c \u0441\u0432\u043e\u0454\u0457 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u043f\u0435\u0440\u0435\u0434 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e \u0442\u0430 \u0456\u043d\u0448\u0438\u043c\u0438 \u0433\u0440\u0430\u0432\u0446\u044f\u043c\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.2\",\"text\":\"\u0417\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0438 \u043b\u0456\u0434\u0435\u0440\u0430 \u0434\u0456\u044e\u0442\u044c \u0432 \u0456\u043d\u0442\u0435\u0440\u0435\u0441\u0430\u0445 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u043d\u0430\u0440\u0456\u0432\u043d\u0456 \u0437 \u043b\u0456\u0434\u0435\u0440\u043e\u043c \u0443 \u043c\u0435\u0436\u0430\u0445 \u0434\u0435\u043b\u0435\u0433\u043e\u0432\u0430\u043d\u0438\u0445 \u043f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u044c. \u0423 \u0440\u0430\u0437\u0456 \u0432\u0456\u0434\u0441\u0443\u0442\u043d\u043e\u0441\u0442\u0456 \u043b\u0456\u0434\u0435\u0440\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0438 \u043f\u0440\u0438\u0439\u043c\u0430\u044e\u0442\u044c \u043d\u0430 \u0441\u0435\u0431\u0435 \u043f\u043e\u0432\u043d\u0435 \u043a\u0435\u0440\u0456\u0432\u043d\u0438\u0446\u0442\u0432\u043e \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0454\u044e.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.3\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u043d\u0435\u0441\u0435 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u0456\u0441\u0442\u044c \u043d\u0435 \u043b\u0438\u0448\u0435 \u0437\u0430 \u0432\u043b\u0430\u0441\u043d\u0456 \u0434\u0456\u0457, \u0430 \u0439 \u0437\u0430 \u043f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0443 \u0441\u0442\u0430\u0440\u0448\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443 \u0444\u0440\u0430\u043a\u0446\u0456\u0457. \u041c\u0430\u0441\u043e\u0432\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0437 \u0431\u043e\u043a\u0443 \u043f\u0456\u0434\u043b\u0435\u0433\u043b\u0438\u0445 \u0454 \u043f\u0456\u0434\u0441\u0442\u0430\u0432\u043e\u044e \u0434\u043b\u044f \u043f\u0440\u0438\u0442\u044f\u0433\u043d\u0435\u043d\u043d\u044f \u043b\u0456\u0434\u0435\u0440\u0430 \u0434\u043e \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u043e\u0441\u0442\u0456.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 1.3: \u041c\u0430\u0441\u043e\u0432\u0438\u043c\u0438 \u0432\u0432\u0430\u0436\u0430\u044e\u0442\u044c\u0441\u044f \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0432\u0456\u0434 3 \u0440\u0456\u0437\u043d\u0438\u0445 \u043e\u0441\u0456\u0431 \u0430\u0431\u043e \u0432\u0456\u0434 5 \u0456 \u0431\u0456\u043b\u044c\u0448\u0435 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u044c \u043e\u0434\u043d\u043e\u0433\u043e \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0430 \u0441\u0442\u0430\u0440\u0448\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.4\",\"text\":\"\u0421\u043b\u0456\u0434\u043a\u0443\u044e\u0447\u0430 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0432\u0438\u043d\u043e\u0441\u0438\u0442\u0438 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u043b\u0456\u0434\u0435\u0440\u0443 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0430\u043c \u0437\u0430 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0446\u0438\u0445 \u043f\u0440\u0430\u0432\u0438\u043b \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e \u0434\u043e \u0432\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u043e\u0433\u043e \u0440\u0435\u0433\u043b\u0430\u043c\u0435\u043d\u0442\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.5\",\"text\":\"\u0426\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430 \u0454 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u0438\u043c\u0438 \u0434\u043b\u044f \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432 \u0443\u0441\u0456\u0445 \u0444\u0440\u0430\u043a\u0446\u0456\u0439 \u043f\u0440\u043e\u0454\u043a\u0442\u0443 \u0412\u0435\u0440\u0431\u0430 \u041e\u043d\u043b\u0430\u0439\u043d \u0431\u0435\u0437 \u0432\u0438\u043d\u044f\u0442\u043a\u0443. \u041d\u0435\u0437\u043d\u0430\u043d\u043d\u044f \u043f\u0440\u0430\u0432\u0438\u043b \u043d\u0435 \u0437\u0432\u0456\u043b\u044c\u043d\u044f\u0454 \u0432\u0456\u0434 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u043e\u0441\u0442\u0456.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.6\",\"text\":\"\u041a\u0435\u0440\u0456\u0432\u043d\u0438\u0446\u0442\u0432\u043e \u043f\u0440\u043e\u0454\u043a\u0442\u0443 \u043c\u043e\u0436\u0435 \u0432\u043d\u043e\u0441\u0438\u0442\u0438 \u0437\u043c\u0456\u043d\u0438 \u0434\u043e \u0446\u0438\u0445 \u043f\u0440\u0430\u0432\u0438\u043b \u0443 \u0431\u0443\u0434\u044c-\u044f\u043a\u0438\u0439 \u043c\u043e\u043c\u0435\u043d\u0442 \u0437 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u0438\u043c \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u0435\u043d\u043d\u044f\u043c \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0447\u0435\u0440\u0435\u0437 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0456 \u043a\u0430\u043d\u0430\u043b\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.1\",\"text\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u043d\u0430 \u043f\u043e\u0441\u0430\u0434\u0443 \u043b\u0456\u0434\u0435\u0440\u0430 \u0432\u0456\u0434\u0431\u0443\u0432\u0430\u0454\u0442\u044c\u0441\u044f \u0447\u0435\u0440\u0435\u0437 \u0432\u0456\u0434\u043a\u0440\u0438\u0442\u0438\u0439 \u0432\u0456\u0434\u0431\u0456\u0440 \u2014 \u043f\u043e\u0434\u0430\u0447\u0443 \u0437\u0430\u044f\u0432\u043a\u0438 \u0443 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e\u043c\u0443 \u0440\u043e\u0437\u0434\u0456\u043b\u0456 Discord \u0442\u0430 \u043f\u0440\u043e\u0445\u043e\u0434\u0436\u0435\u043d\u043d\u044f \u0441\u043f\u0456\u0432\u0431\u0435\u0441\u0456\u0434\u0438 \u0437 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.2\",\"text\":\"\u0414\u043e \u0443\u0447\u0430\u0441\u0442\u0456 \u0443 \u0432\u0456\u0434\u0431\u043e\u0440\u0456 \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u044e\u0442\u044c\u0441\u044f \u0433\u0440\u0430\u0432\u0446\u0456, \u044f\u043a\u0456 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u044e\u0442\u044c \u0442\u0430\u043a\u0438\u043c \u043c\u0456\u043d\u0456\u043c\u0430\u043b\u044c\u043d\u0438\u043c \u0432\u0438\u043c\u043e\u0433\u0430\u043c: \u0412\u0456\u043a \u2014 \u0432\u0456\u0434 14 \u0440\u043e\u043a\u0456\u0432 \u041c\u0456\u043d\u0456\u043c\u0430\u043b\u044c\u043d\u0438\u0439 \u043e\u043d\u043b\u0430\u0439\u043d \u2014 \u0432\u0456\u0434 3 \u0433\u043e\u0434\u0438\u043d \u043d\u0430 \u0434\u0435\u043d\u044c \u0412\u0456\u0434\u0441\u0443\u0442\u043d\u0456\u0441\u0442\u044c \u0430\u043a\u0442\u0438\u0432\u043d\u0438\u0445 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u043d\u0430 \u0430\u043a\u0430\u0443\u043d\u0442\u0456 \u041d\u0435 \u043c\u0435\u043d\u0448\u0435 3 \u043e\u0431\u0491\u0440\u0443\u043d\u0442\u043e\u0432\u0430\u043d\u0438\u0445 \u0456\u0434\u0435\u0439 \u0449\u043e\u0434\u043e \u0440\u043e\u0437\u0432\u0438\u0442\u043a\u0443 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u0443 \u0437\u0430\u044f\u0432\u0446\u0456\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.3\",\"text\":\"\u0417\u0430\u044f\u0432\u043a\u0438 \u0437 \u043e\u0437\u043d\u0430\u043a\u0430\u043c\u0438 \u043a\u043e\u043f\u0456\u044e\u0432\u0430\u043d\u043d\u044f, \u043d\u0435\u0433\u0440\u0430\u043c\u043e\u0442\u043d\u043e \u0441\u043a\u043b\u0430\u0434\u0435\u043d\u0456 \u0430\u0431\u043e \u0431\u0435\u0437 \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u0438\u0445 \u0456\u0434\u0435\u0439 \u2014 \u0432\u0456\u0434\u0445\u0438\u043b\u044f\u044e\u0442\u044c\u0441\u044f \u0431\u0435\u0437 \u0440\u043e\u0437\u0433\u043b\u044f\u0434\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.4\",\"text\":\"\u0413\u0440\u0430\u0432\u0435\u0446\u044c, \u044f\u043a\u0438\u0439 \u043f\u0435\u0440\u0435\u0431\u0443\u0432\u0430\u0454 \u0443 \u0447\u043e\u0440\u043d\u043e\u043c\u0443 \u0441\u043f\u0438\u0441\u043a\u0443 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0430\u0431\u043e \u043f\u0440\u043e\u0454\u043a\u0442\u0443, \u043d\u0435 \u043c\u043e\u0436\u0435 \u0431\u0440\u0430\u0442\u0438 \u0443\u0447\u0430\u0441\u0442\u044c \u0443 \u0432\u0456\u0434\u0431\u043e\u0440\u0456 \u0434\u043e \u0437\u0430\u043a\u0456\u043d\u0447\u0435\u043d\u043d\u044f \u0442\u0435\u0440\u043c\u0456\u043d\u0443 \u043e\u0431\u043c\u0435\u0436\u0435\u043d\u043d\u044f.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.5\",\"text\":\"\u0413\u0440\u0430\u0432\u0435\u0446\u044c, \u044f\u043a\u0438\u0439 \u043d\u0435\u0449\u043e\u0434\u0430\u0432\u043d\u043e \u0437\u0430\u043b\u0438\u0448\u0438\u0432 \u043f\u043e\u0441\u0430\u0434\u0443 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0430, \u043d\u0435 \u043c\u043e\u0436\u0435 \u043f\u0440\u0435\u0442\u0435\u043d\u0434\u0443\u0432\u0430\u0442\u0438 \u043d\u0430 \u043f\u043e\u0441\u0430\u0434\u0443 \u043b\u0456\u0434\u0435\u0440\u0430 \u0430\u0431\u043e \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0430 \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 14 \u0434\u043d\u0456\u0432 \u0437 \u043c\u043e\u043c\u0435\u043d\u0442\u0443 \u0432\u0456\u0434\u0445\u043e\u0434\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.6\",\"text\":\"\u041f\u0440\u0456\u043e\u0440\u0438\u0442\u0435\u0442\u043d\u0438\u043c \u043f\u0440\u0430\u0432\u043e\u043c \u043d\u0430 \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u043b\u0456\u0434\u0435\u0440\u0441\u0442\u0432\u0430 \u0432\u0432\u0430\u0436\u0430\u0454\u0442\u044c\u0441\u044f \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u043f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u044c \u0437\u0430\u0441\u043b\u0443\u0436\u0435\u043d\u043e\u043c\u0443 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0443 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0457. \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u0441\u0445\u0432\u0430\u043b\u044e\u0454 \u0430\u0431\u043e \u0432\u0456\u0434\u0445\u0438\u043b\u044f\u0454 \u043a\u0430\u043d\u0434\u0438\u0434\u0430\u0442\u0443\u0440\u0443 \u0437\u0430 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0430\u043c\u0438 \u043f\u0435\u0440\u0435\u0432\u0456\u0440\u043a\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.7\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0438\u0442\u0438 \u043e\u0434\u043d\u043e\u0433\u043e \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0430 \u0437\u0430 \u0434\u043e\u0432\u0456\u0440\u043e\u044e \u043d\u0430 \u043f\u043e\u0447\u0430\u0442\u043a\u0443 \u0442\u0435\u0440\u043c\u0456\u043d\u0443 \u0431\u0435\u0437 \u043f\u0440\u043e\u0432\u0435\u0434\u0435\u043d\u043d\u044f \u0432\u0456\u0434\u0431\u043e\u0440\u0443. \u0423\u0441\u0456 \u0456\u043d\u0448\u0456 \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432 \u2014 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0447\u0435\u0440\u0435\u0437 \u043f\u0435\u0440\u0435\u0432\u0456\u0440\u043a\u0443 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 2.7: \u041b\u0456\u0434\u0435\u0440 \u043d\u0435 \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u0430 \u043f\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u0438 \u043f\u043e\u0441\u0442 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0443, \u044f\u043a\u0438\u0439 \u043f\u0435\u0440\u0435\u0431\u0443\u0432\u0430\u0454 \u043d\u0430 \u043f\u043e\u0441\u0430\u0434\u0456 \u043c\u0435\u043d\u0448\u0435 7 \u0434\u043d\u0456\u0432.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.8\",\"text\":\"\u041f\u0456\u0441\u043b\u044f \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u043b\u0456\u0434\u0435\u0440 \u043c\u0430\u0454 48 \u0433\u043e\u0434\u0438\u043d \u043d\u0430 \u043a\u0430\u0434\u0440\u043e\u0432\u0456 \u0440\u0456\u0448\u0435\u043d\u043d\u044f \u0449\u043e\u0434\u043e \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u043d\u044c\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443 \u0442\u0430 \u043f\u0435\u0440\u0435\u0430\u0442\u0435\u0441\u0442\u0430\u0446\u0456\u044e \u0441\u0442\u0430\u0440\u0448\u043e\u0433\u043e \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u043b\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.9\",\"text\":\"\u041f\u0440\u0438\u0439\u043e\u043c \u0434\u043e \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u0434\u043e\u0437\u0432\u043e\u043b\u0435\u043d\u0438\u0439 \u043b\u0438\u0448\u0435 \u0433\u0440\u0430\u0432\u0446\u044f\u043c \u0437 2-\u043c \u0456\u0433\u0440\u043e\u0432\u0438\u043c \u0440\u0456\u0432\u043d\u0435\u043c \u0442\u0430 RP-\u043d\u0456\u043a\u043d\u0435\u0439\u043c\u043e\u043c.\",\"punishment\":\"\u0423\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f \u2014 \u0437\u0430 \u043d\u0430\u044f\u0432\u043d\u043e\u0441\u0442\u0456 3 \u0456 \u0431\u0456\u043b\u044c\u0448\u0435 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0437 NonRP-\u043d\u0456\u043a\u043d\u0435\u0439\u043c\u0430\u043c\u0438\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 2.9: \u0413\u0440\u0430\u0432\u0446\u0456 \u0437 NonRP-\u043d\u0456\u043a\u043d\u0435\u0439\u043c\u0430\u043c\u0438 \u0434\u043e \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u043d\u0435 \u043f\u0440\u0438\u0439\u043c\u0430\u044e\u0442\u044c\u0441\u044f. \u042f\u043a\u0449\u043e \u0443 \u0441\u043a\u043b\u0430\u0434\u0456 \u0432\u0438\u044f\u0432\u043b\u0435\u043d\u043e 3 \u0456 \u0431\u0456\u043b\u044c\u0448\u0435 \u0442\u0430\u043a\u0438\u0445 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u2014 \u043b\u0456\u0434\u0435\u0440 \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u0443\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.10\",\"text\":\"\u0421\u043f\u0456\u0432\u0431\u0435\u0441\u0456\u0434\u0430 \u043f\u0440\u0438 \u0432\u0441\u0442\u0443\u043f\u0456 \u0434\u043e \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u043f\u0440\u043e\u0432\u043e\u0434\u0438\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u043d\u0430 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0456\u0439 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0457 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0457 \u0430\u0431\u043e \u0443 \u0441\u043f\u0435\u0446\u0456\u0430\u043b\u044c\u043d\u043e \u0432\u0456\u0434\u0432\u0435\u0434\u0435\u043d\u043e\u043c\u0443 \u043c\u0456\u0441\u0446\u0456.\",\"punishment\":\"\u041f\u0440\u043e\u0444\u0456\u043b\u0430\u043a\u0442\u0438\u0447\u043d\u0430 \u0431\u0435\u0441\u0456\u0434\u0430 / \u0423\u0441\u043d\u0430 \u0434\u043e\u0433\u0430\u043d\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.11\",\"text\":\"\u0417\u0432\u0456\u043b\u044c\u043d\u0435\u043d\u043d\u044f \u0433\u0440\u0430\u0432\u0446\u044f \u0437 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u043c\u043e\u0436\u043b\u0438\u0432\u0435 \u043b\u0438\u0448\u0435 \u0437\u0430 \u043d\u0430\u044f\u0432\u043d\u043e\u0441\u0442\u0456 \u043e\u0431\u0491\u0440\u0443\u043d\u0442\u043e\u0432\u0430\u043d\u043e\u0457 IC-\u043f\u0440\u0438\u0447\u0438\u043d\u0438 \u0437 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u0438\u043c \u0440\u043e\u043b\u044c\u043e\u0432\u0438\u043c \u0432\u0456\u0434\u0456\u0433\u0440\u0443\u0432\u0430\u043d\u043d\u044f\u043c.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 2.11: \u042f\u043a\u0449\u043e \u043f\u0456\u0434\u0441\u0442\u0430\u0432\u043e\u044e \u0454 OOC-\u043f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u2014 \u0443 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430\u0445 \u0437\u0430\u0437\u043d\u0430\u0447\u0430\u0454\u0442\u044c\u0441\u044f \\\"\u041f\u0440\u043e\u0444\u0435\u0441\u0456\u0439\u043d\u0430 \u043d\u0435\u043f\u0440\u0438\u0434\u0430\u0442\u043d\u0456\u0441\u0442\u044c\\\".\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u041d\u0430 \u041f\u043e\u0441\u0430\u0434\u0443\",\"id\":\"2.12\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0438\u0442\u0438 \u043c\u0430\u043a\u0441\u0438\u043c\u0443\u043c 3-\u0445 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432 (9-\u0439 \u0440\u0430\u043d\u0433). \u0414\u043b\u044f \u0432\u0441\u0456\u0445 \u0456\u043d\u0448\u0438\u0445 \u0440\u0430\u043d\u0433\u0456\u0432 (\u0437 1-\u0433\u043e \u043f\u043e 8-\u0439) \u043e\u0431\u043c\u0435\u0436\u0435\u043d\u044c \u0437\u0430 \u043a\u0456\u043b\u044c\u043a\u0456\u0441\u0442\u044e \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u043d\u0435\u043c\u0430\u0454.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.1\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043f\u0456\u0434\u0442\u0440\u0438\u043c\u0443\u0432\u0430\u0442\u0438 \u0430\u043a\u0442\u0438\u0432\u043d\u0456\u0441\u0442\u044c \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u2014 \u0440\u0435\u0433\u0443\u043b\u044f\u0440\u043d\u043e \u043f\u0440\u043e\u0432\u043e\u0434\u0438\u0442\u0438 \u043d\u0430\u0431\u043e\u0440\u0438, \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u0456 \u0437\u0430\u0445\u043e\u0434\u0438 \u0442\u0430 \u0441\u0442\u0435\u0436\u0438\u0442\u0438 \u0437\u0430 \u043e\u043d\u043b\u0430\u0439\u043d\u043e\u043c \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.2\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043f\u0456\u0434\u0442\u0440\u0438\u043c\u0443\u0432\u0430\u0442\u0438 \u043c\u0456\u043d\u0456\u043c\u0430\u043b\u044c\u043d\u0438\u0439 \u043e\u0441\u043e\u0431\u0438\u0441\u0442\u0438\u0439 \u043e\u043d\u043b\u0430\u0439\u043d \u2014 \u043d\u0435 \u043c\u0435\u043d\u0448\u0435 3 \u0433\u043e\u0434\u0438\u043d \u043d\u0430 \u0434\u0435\u043d\u044c, \u0440\u0435\u0433\u0443\u043b\u044f\u0440\u043d\u043e \u0432\u0438\u043a\u043e\u043d\u0443\u044e\u0447\u0438 \u0444\u0440\u0430\u043a\u0446\u0456\u0439\u043d\u0456 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u0438. \u0421\u0438\u0441\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u043d\u0435 \u043d\u0435\u0432\u0438\u043a\u043e\u043d\u0430\u043d\u043d\u044f \u0446\u0456\u0454\u0457 \u043d\u043e\u0440\u043c\u0438 \u0454 \u043f\u0456\u0434\u0441\u0442\u0430\u0432\u043e\u044e \u0434\u043b\u044f \u0437\u043d\u044f\u0442\u0442\u044f \u0437 \u043f\u043e\u0441\u0430\u0434\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.3\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u0441\u043b\u0456\u0434\u043a\u0443\u0432\u0430\u0442\u0438 \u0437\u0430 \u0434\u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f\u043c \u043f\u0440\u0430\u0432\u0438\u043b \u043f\u0440\u043e\u0454\u043a\u0442\u0443 \u0432\u0441\u0456\u043c\u0430 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0430\u043c\u0438 \u0444\u0440\u0430\u043a\u0446\u0456\u0457. \u041c\u0430\u0441\u043e\u0432\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0437 \u0431\u043e\u043a\u0443 \u0447\u043b\u0435\u043d\u0456\u0432 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0457 \u043c\u043e\u0436\u0443\u0442\u044c \u0441\u0442\u0430\u0442\u0438 \u043f\u0456\u0434\u0441\u0442\u0430\u0432\u043e\u044e \u0434\u043b\u044f \u043f\u0440\u0438\u0442\u044f\u0433\u043d\u0435\u043d\u043d\u044f \u043b\u0456\u0434\u0435\u0440\u0430 \u0434\u043e \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u043e\u0441\u0442\u0456.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.4\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u0432\u0456\u0434\u043f\u0440\u0430\u0446\u044e\u0432\u0430\u0442\u0438 \u043c\u0456\u043d\u0456\u043c\u0443\u043c 28 \u0434\u043d\u0456\u0432 \u2014 \u043e\u0434\u0438\u043d \u043f\u043e\u0432\u043d\u0438\u0439 \u0442\u0435\u0440\u043c\u0456\u043d \u0437 \u043c\u043e\u043c\u0435\u043d\u0442\u0443 \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f. \u041f\u0456\u0441\u043b\u044f \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044f \u043f\u0435\u0440\u0448\u043e\u0433\u043e \u0442\u0435\u0440\u043c\u0456\u043d\u0443 \u043b\u0456\u0434\u0435\u0440 \u043c\u043e\u0436\u0435 \u043f\u0440\u043e\u0434\u043e\u0432\u0436\u0438\u0442\u0438 \u0440\u043e\u0431\u043e\u0442\u0443 \u0449\u0435 \u0434\u043e \u0434\u0432\u043e\u0445 \u0442\u0435\u0440\u043c\u0456\u043d\u0456\u0432 \u043f\u043e\u0441\u043f\u0456\u043b\u044c.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 3.4: \u0423 \u0440\u0430\u0437\u0456 \u0434\u043e\u0441\u0442\u0440\u043e\u043a\u043e\u0432\u043e\u0433\u043e \u0437\u043d\u044f\u0442\u0442\u044f \u0437\u0430\u0441\u0442\u043e\u0441\u043e\u0432\u0443\u044e\u0442\u044c\u0441\u044f \u0442\u0430\u043a\u0456 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u0437\u0430\u043b\u0435\u0436\u043d\u043e \u0432\u0456\u0434 \u0432\u0456\u0434\u043f\u0440\u0430\u0446\u044c\u043e\u0432\u0430\u043d\u043e\u0433\u043e \u0442\u0435\u0440\u043c\u0456\u043d\u0443: - 0\u20137 \u0434\u043d\u0456\u0432 \u2192 Warn + \u0427\u0421 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u043d\u0430 1 \u043c\u0456\u0441\u044f\u0446\u044c - 7\u201314 \u0434\u043d\u0456\u0432 \u2192 Warn + \u0427\u0421 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u043d\u0430 2 \u0442\u0438\u0436\u043d\u0456 - 14\u201328 \u0434\u0435\u043d\u044c \u2192 \u0417\u043d\u044f\u0442\u0442\u044f \u0437 \u043f\u043e\u0441\u0430\u0434\u0438 \u0431\u0435\u0437 \u0434\u043e\u0434\u0430\u0442\u043a\u043e\u0432\u0438\u0445 \u0441\u0430\u043d\u043a\u0446\u0456\u0439\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.5\",\"text\":\"\u041b\u0456\u0434\u0435\u0440\u0443 \u043c\u043e\u0436\u0435 \u0431\u0443\u0442\u0438 \u0437\u0430\u0440\u0430\u0445\u043e\u0432\u0430\u043d\u043e \u043f\u043e\u0432\u043d\u0438\u0439 \u0442\u0435\u0440\u043c\u0456\u043d, \u044f\u043a\u0449\u043e \u0432\u0456\u043d \u0432\u0456\u0434\u043f\u0440\u0430\u0446\u044e\u0432\u0430\u0432 14+ \u0434\u043d\u0456\u0432 \u0456\u0437 \u043f\u0456\u0434\u0442\u0432\u0435\u0440\u0434\u0436\u0435\u043d\u0438\u043c \u0440\u043e\u0437\u0432\u0438\u0442\u043a\u043e\u043c \u0442\u0430 \u0430\u043a\u0442\u0438\u0432\u043d\u0456\u0441\u0442\u044e \u0444\u0440\u0430\u043a\u0446\u0456\u0457.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.6\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043e\u0442\u0440\u0438\u043c\u0430\u0442\u0438 \u043c\u043e\u0434\u0435\u0440\u0430\u0446\u0456\u044e \u0432 Discord-\u0444\u043e\u0440\u0443\u043c\u0456 \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 24 \u0433\u043e\u0434\u0438\u043d \u043f\u0456\u0441\u043b\u044f \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u0442\u0430 \u0441\u0444\u043e\u0440\u043c\u0443\u0432\u0430\u0442\u0438 \u043c\u0456\u043d\u0456\u043c\u0430\u043b\u044c\u043d\u0438\u0439 \u0441\u043a\u043b\u0430\u0434 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 3 \u0434\u043d\u0456\u0432.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.7\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043f\u0456\u0434\u0442\u0440\u0438\u043c\u0443\u0432\u0430\u0442\u0438 \u043f\u043e\u0440\u044f\u0434\u043e\u043a \u0443 \u0440\u043e\u0437\u0434\u0456\u043b\u0456 \u0441\u0432\u043e\u0454\u0457 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0457 \u0432 Discord \u2014 \u044f\u043a \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u0439 \u043c\u043e\u0434\u0435\u0440\u0430\u0442\u043e\u0440 \u0446\u044c\u043e\u0433\u043e \u0440\u043e\u0437\u0434\u0456\u043b\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.8\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0430\u0431\u043e \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0438 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0456 \u0449\u043e\u0434\u0435\u043d\u043d\u043e \u043f\u0440\u043e\u0432\u043e\u0434\u0438\u0442\u0438 \u043d\u0430\u0431\u043e\u0440\u0438 \u0434\u043e \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u0442\u0430 \u043c\u0456\u043d\u0456\u043c\u0443\u043c 2 \u0441\u043f\u0456\u0432\u0431\u0435\u0441\u0456\u0434\u0438 \u043d\u0430 \u0434\u0435\u043d\u044c \u0456\u0437 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u043e\u044e \u0444\u0456\u043a\u0441\u0430\u0446\u0456\u0454\u044e \u043a\u043e\u0436\u043d\u043e\u0457 \u0443 \u0441\u043a\u0440\u0456\u043d\u0448\u043e\u0442\u0430\u0445.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.9\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0456 \u0440\u0435\u0430\u0433\u0443\u0432\u0430\u0442\u0438 \u043d\u0430 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0456 \u0437\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 24 \u0433\u043e\u0434\u0438\u043d. \u0412\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0456 \u0443 Discord-\u0444\u043e\u0440\u0443\u043c\u0456 \u043c\u0430\u044e\u0442\u044c \u0431\u0443\u0442\u0438 \u0440\u043e\u0437\u0433\u043e\u0440\u043d\u0443\u0442\u0438\u043c\u0438 \u0442\u0430 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0438\u043c\u0438 \u2014 \u0456\u0437 \u043e\u0431\u0491\u0440\u0443\u043d\u0442\u0443\u0432\u0430\u043d\u043d\u044f\u043c \u0443 \u0440\u0430\u0437\u0456 \u0432\u0456\u0434\u043c\u043e\u0432\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.10\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043f\u0456\u0434\u0442\u0440\u0438\u043c\u0443\u0432\u0430\u0442\u0438 \u0434\u0456\u043b\u043e\u0432\u0456 \u0432\u0456\u0434\u043d\u043e\u0441\u0438\u043d\u0438 \u0437 \u043b\u0456\u0434\u0435\u0440\u0430\u043c\u0438 \u0456\u043d\u0448\u0438\u0445 \u0444\u0440\u0430\u043a\u0446\u0456\u0439, \u0443\u043d\u0438\u043a\u0430\u0442\u0438 OOC-\u043a\u043e\u043d\u0444\u043b\u0456\u043a\u0442\u0456\u0432 \u0442\u0430 \u043f\u0440\u043e\u0432\u043e\u043a\u0430\u0446\u0456\u0439.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.11\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u0431\u0443\u0442\u0438 \u043f\u0440\u0438\u0441\u0443\u0442\u043d\u0456\u043c \u043d\u0430 \u043b\u0456\u0434\u0435\u0440\u0441\u044c\u043a\u0438\u0445 \u0437\u0431\u043e\u0440\u0430\u0445, \u0449\u043e \u043f\u0440\u043e\u0432\u043e\u0434\u044f\u0442\u044c\u0441\u044f \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e. \u0412\u0456\u0434\u0441\u0443\u0442\u043d\u0456\u0441\u0442\u044c \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0454\u0442\u044c\u0441\u044f \u043b\u0438\u0448\u0435 \u0437 \u043f\u043e\u0432\u0430\u0436\u043d\u043e\u0457 \u043f\u0440\u0438\u0447\u0438\u043d\u0438, \u043f\u0440\u043e \u044f\u043a\u0443 \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u044f\u0454\u0442\u044c\u0441\u044f \u0437\u0430\u0437\u0434\u0430\u043b\u0435\u0433\u0456\u0434\u044c.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.12\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0456 \u0441\u0442\u0435\u0436\u0438\u0442\u0438 \u0437\u0430 \u0431\u0430\u043b\u0430\u043d\u0441\u043e\u043c \u0444\u0440\u0430\u043a\u0446\u0456\u0439\u043d\u043e\u0457 \u043a\u0430\u0437\u043d\u0438 \u0442\u0430 \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u044f\u0442\u0438 \u0441\u043b\u0456\u0434\u043a\u0443\u044e\u0447\u0443 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044e \u0443 \u0440\u0430\u0437\u0456 \u0432\u0438\u044f\u0432\u043b\u0435\u043d\u043d\u044f \u043f\u0440\u043e\u0431\u043b\u0435\u043c.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.13\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0456 \u0449\u043e\u0434\u043d\u044f \u043a\u043e\u043d\u0442\u0440\u043e\u043b\u044e\u0432\u0430\u0442\u0438 \u0440\u043e\u0431\u043e\u0442\u0443 \u0441\u043a\u043b\u0430\u0434\u0443, \u043d\u0430\u0432\u0447\u0430\u0442\u0438 \u043d\u043e\u0432\u0430\u0447\u043a\u0456\u0432 \u0442\u0430 \u0437\u0430\u043b\u0443\u0447\u0430\u0442\u0438 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432 \u0434\u043e \u0444\u0440\u0430\u043a\u0446\u0456\u0439\u043d\u0438\u0445 \u0437\u0430\u0432\u0434\u0430\u043d\u044c.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.14\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u0432\u0435\u0441\u0442\u0438 \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430\u0446\u0456\u044e \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u2014 \u043f\u0435\u0440\u0435\u0434 \u0437\u0430\u043d\u0435\u0441\u0435\u043d\u043d\u044f\u043c \u0433\u0440\u0430\u0432\u0446\u044f \u0434\u043e \u0447\u043e\u0440\u043d\u043e\u0433\u043e \u0441\u043f\u0438\u0441\u043a\u0443 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0457 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u043e \u043c\u0430\u0442\u0438 \u0434\u043e\u043a\u0430\u0437\u0438 \u0442\u0430 \u043e\u0431\u0491\u0440\u0443\u043d\u0442\u0443\u0432\u0430\u043d\u043d\u044f.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.15\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0442\u0430 \u0439\u043e\u0433\u043e \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0456 \u043d\u0430\u0434\u0430\u0432\u0430\u0442\u0438 \u0434\u043e\u043a\u0430\u0437\u0438 \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u0433\u043e \u0441\u043f\u0456\u0432\u0440\u043e\u0431\u0456\u0442\u043d\u0438\u043a\u0430 \u0444\u0440\u0430\u043a\u0446\u0456\u0457.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 3.15: \u041b\u0456\u0434\u0435\u0440 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a \u043d\u0430\u0434\u0430\u044e\u0442\u044c \u0434\u043e\u043a\u0430\u0437\u0438 \u043d\u0430 \u043a\u0430\u0434\u0440\u043e\u0432\u0456 \u0437\u043c\u0456\u043d\u0438 \u0431\u0443\u0434\u044c- \u044f\u043a\u043e\u0433\u043e \u0441\u043f\u0456\u0432\u0440\u043e\u0431\u0456\u0442\u043d\u0438\u043a\u0430 \u043d\u0430 \u0432\u0438\u043c\u043e\u0433\u0443 \u0441\u043b\u0456\u0434\u043a\u0443\u044e\u0447\u043e\u0457 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457. \u041a\u0430\u0434\u0440\u043e\u0432\u0456 \u0437\u043c\u0456\u043d\u0438 \u0432 \u0441\u0435\u0431\u0435 \u0432\u043a\u043b\u044e\u0447\u0430\u044e\u0442\u044c: \u0414\u043e\u043a\u0430\u0437\u0438 \u043f\u0440\u043e\u0432\u0435\u0434\u0435\u043d\u043d\u044f \u0441\u043f\u0456\u0432\u0431\u0435\u0441\u0456\u0434\u0438 (\u0432\u0456\u0434\u0435\u043e\u0444\u0456\u043a\u0441\u0430\u0446\u0456\u044f) \u043d\u0430 7, 8 \u0442\u0430 9 \u0440\u0430\u043d\u0433\u0438; \u0414\u043e\u043a\u0430\u0437 \u043f\u0456\u0434\u0432\u0438\u0449\u0435\u043d\u043d\u044f \u0433\u0440\u0430\u0432\u0446\u044f \u0437\u0433\u0456\u0434\u043d\u043e \u0441\u0438\u0441\u0442\u0435\u043c\u0438 \u043f\u0456\u0434\u0432\u0438\u0449\u0435\u043d\u043d\u044f.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041e\u0431\u043e\u0432'\u042f\u0437\u043a\u0438\",\"id\":\"3.16\",\"text\":\"\u041b\u0456\u0434\u0435\u0440\u0443 \u0442\u0430 \u0439\u043e\u0433\u043e \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0430\u043c \u0441\u0443\u0432\u043e\u0440\u043e \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043d\u0435\u0430\u0434\u0435\u043a\u0432\u0430\u0442\u043d\u0435 \u0441\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f, \u043e\u0431\u0440\u0430\u0437\u0438, \u043f\u0440\u043e\u0432\u043e\u043a\u0430\u0446\u0456\u0457 \u0442\u0430 \u0431\u0443\u0434\u044c-\u044f\u043a\u0456 \u0434\u0456\u0457, \u0441\u043f\u0440\u044f\u043c\u043e\u0432\u0430\u043d\u0456 \u043d\u0430 \u0434\u0438\u0441\u043a\u0440\u0435\u0434\u0438\u0442\u0430\u0446\u0456\u044e \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u043f\u0440\u043e\u0435\u043a\u0442\u0443 \u044f\u043a \u0443 \u0433\u0440\u0456 (\u0443\u0441\u0456 \u0432\u0438\u0434\u0438 \u0447\u0430\u0442\u0456\u0432), \u0442\u0430\u043a \u0456 \u043d\u0430 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0438\u0445 \u043f\u043b\u0430\u0442\u0444\u043e\u0440\u043c\u0430\u0445 \u043f\u0440\u043e\u0435\u043a\u0442\u0443.\",\"punishment\":\"\u0423\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f / \u0421\u0443\u0432\u043e\u0440\u0430 \u0434\u043e\u0433\u0430\u043d\u0430 / \u0417\u043d\u044f\u0442\u0442\u044f \u0437 \u043f\u043e\u0441\u0430\u0434\u0438 \u0437 \u0437\u0430\u043d\u0435\u0441\u0435\u043d\u043d\u044f\u043c \u0434\u043e \u0427\u0421 \u041b\u0456\u0434\u0435\u0440\u0456\u0432 \u0434\u043e 6 \u043c\u0456\u0441\u044f\u0446\u0456\u0432\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 3.16: \u041a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0442\u0438\u0432\u043d\u0430 \u043a\u0440\u0438\u0442\u0438\u043a\u0430 \u0434\u0456\u0439 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u0434\u043e\u043f\u0443\u0441\u043a\u0430\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0443 \u043f\u0440\u0438\u0432\u0430\u0442\u043d\u043e\u043c\u0443 \u0441\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u0456 \u0437 \u0413\u043e\u043b\u043e\u0432\u043d\u0438\u043c \u0421\u043b\u0456\u0434\u043a\u0443\u044e\u0447\u0438\u043c (\u0413\u0421) \u0430\u0431\u043e \u0413\u043e\u043b\u043e\u0432\u043d\u043e\u044e \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e (\u0413\u0410/\u0417\u0413\u0410) \u0443 \u0441\u0442\u0440\u0438\u043c\u0430\u043d\u0456\u0439 \u0442\u0430 \u043f\u043e\u0432\u0430\u0436\u043d\u0456\u0439 \u0444\u043e\u0440\u043c\u0456.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u043d\u044f \u041b\u0456\u0434\u0435\u0440\u0430\",\"id\":\"4.1\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a \u043c\u0430\u044e\u0442\u044c \u043f\u0440\u0430\u0432\u043e \u0441\u0430\u043c\u043e\u0441\u0442\u0456\u0439\u043d\u043e \u043f\u0440\u0438\u0439\u043c\u0430\u0442\u0438 \u0442\u0430 \u0437\u0432\u0456\u043b\u044c\u043d\u044f\u0442\u0438 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e \u0434\u043e \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u044c\u043e\u0433\u043e \u0440\u0435\u0433\u043b\u0430\u043c\u0435\u043d\u0442\u0443 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0457 \u0442\u0430 \u043f\u0440\u0430\u0432\u0438\u043b \u043f\u0440\u043e\u0454\u043a\u0442\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u043d\u044f \u041b\u0456\u0434\u0435\u0440\u0430\",\"id\":\"4.2\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0430\u0442\u0438 \u0442\u0430 \u0437\u043d\u0456\u043c\u0430\u0442\u0438 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432 \u0437\u0430 \u0432\u043b\u0430\u0441\u043d\u0438\u043c \u0440\u0456\u0448\u0435\u043d\u043d\u044f\u043c \u0437 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u0438\u043c \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u043d\u0456\u043c \u043f\u043e\u0433\u043e\u0434\u0436\u0435\u043d\u043d\u044f\u043c \u0437\u0456 \u0441\u043b\u0456\u0434\u043a\u0443\u044e\u0447\u0438\u043c \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u043e\u043c.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u043d\u044f \u041b\u0456\u0434\u0435\u0440\u0430\",\"id\":\"4.3\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a \u043c\u0430\u044e\u0442\u044c \u043f\u0440\u0430\u0432\u043e \u0432\u0438\u0434\u0430\u0432\u0430\u0442\u0438 \u0442\u0430 \u0437\u043d\u0438\u0436\u0443\u0432\u0430\u0442\u0438 \u0440\u0430\u043d\u0433\u0438 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0430\u043c \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u0432 \u043c\u0435\u0436\u0430\u0445 \u043d\u0430\u044f\u0432\u043d\u043e\u0457 \u0440\u0430\u043d\u0433\u043e\u0432\u043e\u0457 \u0441\u0438\u0441\u0442\u0435\u043c\u0438, \u0441\u0438\u0441\u0442\u0435\u043c\u0438 \u043f\u0456\u0434\u0432\u0438\u0449\u0435\u043d\u044c, \u0441\u0442\u0430\u0442\u0443\u0442\u0443 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u0442\u0430 \u0456\u043d\u0448\u0438\u0445 \u043f\u0440\u0430\u0432\u0438\u043b.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u043d\u044f \u041b\u0456\u0434\u0435\u0440\u0430\",\"id\":\"4.4\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0437\u043d\u0456\u043c\u0430\u0442\u0438 \u043a\u043e\u0448\u0442\u0438 \u0437 \u0444\u0440\u0430\u043a\u0446\u0456\u0439\u043d\u043e\u0457 \u043a\u0430\u0437\u043d\u0438 \u0432 \u043c\u0435\u0436\u0430\u0445 500 000 \u20b4 \u043d\u0430 \u0434\u043e\u0431\u0443 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u043d\u0430 \u043f\u043e\u0442\u0440\u0435\u0431\u0438 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0457 \u2014 \u0437 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u0438\u043c \u0437\u0432\u0456\u0442\u043e\u043c \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c \u0433\u043e\u0434\u0438\u043d\u0438 \u043f\u0456\u0441\u043b\u044f \u0437\u043d\u044f\u0442\u0442\u044f.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 4.4: \u042f\u043a\u0449\u043e \u0437\u0432\u0456\u0442 \u043d\u0435 \u043d\u0430\u0434\u0430\u043d\u043e \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c \u0433\u043e\u0434\u0438\u043d\u0438 \u2014 \u043b\u0456\u0434\u0435\u0440 \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u0434\u043e\u0433\u0430\u043d\u0443. \u0421\u0438\u0441\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u043d\u0435 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043c\u043e\u0436\u0435 \u043f\u0440\u0438\u0437\u0432\u0435\u0441\u0442\u0438 \u0434\u043e \u0437\u043d\u044f\u0442\u0442\u044f \u0437 \u043f\u043e\u0441\u0430\u0434\u0438 \u0442\u0430 \u043e\u0431\u043d\u0443\u043b\u0435\u043d\u043d\u044f \u0431\u0430\u043b\u0430\u043d\u0441\u0443 \u0430\u043a\u0430\u0443\u043d\u0442\u0443.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u043d\u044f \u041b\u0456\u0434\u0435\u0440\u0430\",\"id\":\"4.5\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a \u043c\u0430\u044e\u0442\u044c \u043f\u0440\u0430\u0432\u043e \u0443\u043f\u0440\u0430\u0432\u043b\u044f\u0442\u0438 \u0441\u043a\u043b\u0430\u0434\u043e\u043c \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u2014 \u0440\u043e\u0437\u043f\u043e\u0434\u0456\u043b\u044f\u0442\u0438 \u0437\u0431\u0440\u043e\u044e, \u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442 \u0442\u0430 \u0456\u043d\u0448\u0456 \u0440\u0435\u0441\u0443\u0440\u0441\u0438 \u2014 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0432 \u0456\u043d\u0442\u0435\u0440\u0435\u0441\u0430\u0445 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0457 \u0442\u0430 \u0432 \u043c\u0435\u0436\u0430\u0445 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0438\u0445 \u0456\u0433\u0440\u043e\u0432\u0438\u0445 \u043c\u0435\u0445\u0430\u043d\u0456\u043a.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u043d\u044f \u041b\u0456\u0434\u0435\u0440\u0430\",\"id\":\"4.6\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a \u043c\u0430\u044e\u0442\u044c \u043f\u0440\u0430\u0432\u043e \u0437\u0430\u0441\u0442\u043e\u0441\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u0456 \u0434\u0438\u0441\u0446\u0438\u043f\u043b\u0456\u043d\u0430\u0440\u043d\u0456 \u0437\u0430\u0445\u043e\u0434\u0438 \u0434\u043e \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432 \u2014 \u0448\u0442\u0440\u0430\u0444\u0438, \u043f\u043e\u043d\u0438\u0436\u0435\u043d\u043d\u044f \u0432 \u0440\u0430\u043d\u0437\u0456 \u2014 \u0437\u0430 \u0443\u043c\u043e\u0432\u0438 \u043d\u0430\u044f\u0432\u043d\u043e\u0441\u0442\u0456 \u0434\u043e\u043a\u0430\u0437\u0456\u0432 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0442\u0430 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u0438\u0445 \u043f\u0440\u0430\u0432\u0438\u043b \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u044c.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u043d\u044f \u041b\u0456\u0434\u0435\u0440\u0430\",\"id\":\"4.7\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0432\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u044e\u0432\u0430\u0442\u0438 \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u0437\u0430 \u0443\u043c\u043e\u0432\u0438, \u0449\u043e \u0432\u043e\u043d\u0438 \u043d\u0435 \u0441\u0443\u043f\u0435\u0440\u0435\u0447\u0430\u0442\u044c \u0437\u0430\u0433\u0430\u043b\u044c\u043d\u0438\u043c \u043f\u0440\u0430\u0432\u0438\u043b\u0430\u043c \u043f\u0440\u043e\u0454\u043a\u0442\u0443 \u0442\u0430 \u043f\u043e\u0433\u043e\u0434\u0436\u0435\u043d\u0456 \u0437 \u0433\u043e\u043b\u043e\u0432\u043d\u043e\u044e \u0441\u043b\u0456\u0434\u043a\u0443\u044e\u0447\u043e\u044e \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.1\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0440\u0435\u0441\u0443\u0440\u0441\u0438 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u2014 \u0441\u043a\u043b\u0430\u0434, \u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442, \u043a\u043e\u0448\u0442\u0438 \u2014 \u0432 \u043e\u0441\u043e\u0431\u0438\u0441\u0442\u0438\u0445 \u0446\u0456\u043b\u044f\u0445.\",\"punishment\":\"\u0417\u043d\u044f\u0442\u0442\u044f \u0437 \u043f\u043e\u0441\u0430\u0434\u0438 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.2\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e \u0432\u0438\u0441\u043d\u0430\u0436\u0443\u0432\u0430\u0442\u0438 \u0441\u043a\u043b\u0430\u0434 \u0444\u0440\u0430\u043a\u0446\u0456\u0457 \u043f\u0435\u0440\u0435\u0434 \u0437\u0432\u0456\u043b\u044c\u043d\u0435\u043d\u043d\u044f\u043c \u0430\u0431\u043e \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0435\u044e \u043f\u043e\u0441\u0430\u0434\u0438.\",\"punishment\":\"\u0417\u043d\u044f\u0442\u0442\u044f \u0437 \u043f\u043e\u0441\u0430\u0434\u0438 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.3\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043f\u0456\u0434\u0432\u0438\u0449\u0443\u0432\u0430\u0442\u0438 \u0430\u0431\u043e \u043f\u0440\u0438\u0439\u043c\u0430\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0437\u0430 \u043a\u043e\u0448\u0442\u0438, \u0440\u0435\u0430\u043b\u044c\u043d\u0456 \u0433\u0440\u043e\u0448\u0456 \u0430\u0431\u043e \u0431\u0443\u0434\u044c-\u044f\u043a\u0456 \u0456\u043d\u0448\u0456 \u0446\u0456\u043d\u043d\u043e\u0441\u0442\u0456.\",\"punishment\":\"\u0417\u043d\u044f\u0442\u0442\u044f \u0437 \u043f\u043e\u0441\u0430\u0434\u0438 + \u0427\u0421 \u043b\u0456\u0434\u0435\u0440\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.4\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043c\u0430\u0433\u0430\u0442\u0438 \u0432\u0456\u0434 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u043a\u043e\u0448\u0442\u0438 \u0430\u0431\u043e \u043c\u0430\u0439\u043d\u043e \u043f\u0456\u0434 \u0431\u0443\u0434\u044c-\u044f\u043a\u0438\u043c \u043f\u0440\u0438\u0432\u043e\u0434\u043e\u043c.\",\"punishment\":\"\u0417\u043d\u044f\u0442\u0442\u044f \u0437 \u043f\u043e\u0441\u0430\u0434\u0438 + \u0427\u0421 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u043d\u0430 14 \u0434\u043d\u0456\u0432 ! \u0412\u0438\u043a\u043b\u044e\u0447\u0435\u043d\u043d\u044f \u0434\u043e \u043f. 5.4: \u041c\u043e\u0436\u043d\u0430 \u0432\u0438\u043c\u0430\u0433\u0430\u0442\u0438 \u0441\u043f\u043b\u0430\u0442\u0443 \u0448\u0442\u0440\u0430\u0444\u0456\u0432 \u0437\u0430 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u0456\u0445 \u043f\u0440\u0430\u0432\u0438\u043b \u0434\u0438\u0441\u0446\u0438\u043f\u043b\u0456\u043d\u0438 \u0437 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u043e\u044e \u043d\u0430\u044f\u0432\u043d\u0456\u0441\u0442\u044e \u0434\u043e\u043a\u0430\u0437\u0456\u0432 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0442\u0430 \u043f\u0443\u043d\u043a\u0442\u0443 \u043f\u0440\u0430\u0432\u0438\u043b, \u044f\u043a\u0438\u0439 \u0431\u0443\u043b\u043e \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043e.\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.5\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0437\u043c\u0456\u043d\u044e\u0432\u0430\u0442\u0438 \u043d\u0456\u043a\u043d\u0435\u0439\u043c \u043f\u0456\u0434 \u0447\u0430\u0441 \u043f\u0435\u0440\u0435\u0431\u0443\u0432\u0430\u043d\u043d\u044f \u043d\u0430 \u043f\u043e\u0441\u0430\u0434\u0456 \u0431\u0435\u0437 \u043f\u043e\u0433\u043e\u0434\u0436\u0435\u043d\u043d\u044f \u0437\u0456 \u0441\u043b\u0456\u0434\u043a\u0443\u044e\u0447\u0438\u043c \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u043e\u043c.\",\"punishment\":\"\u041f\u0440\u043e\u0444\u0456\u043b\u0430\u043a\u0442\u0438\u0447\u043d\u0430 \u0431\u0435\u0441\u0456\u0434\u0430 / \u0423\u0441\u043d\u0430 \u0434\u043e\u0433\u0430\u043d\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.6\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0442\u0432\u0456\u043d\u043a-\u0430\u043a\u0430\u0443\u043d\u0442\u0438 \u043f\u0456\u0434 \u0447\u0430\u0441 \u043f\u0435\u0440\u0435\u0431\u0443\u0432\u0430\u043d\u043d\u044f \u043d\u0430 \u043f\u043e\u0441\u0430\u0434\u0456.\",\"punishment\":\"\u0421\u0443\u0432\u043e\u0440\u0430 \u0434\u043e\u0433\u0430\u043d\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.7\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043e\u0431\u0456\u0439\u043c\u0430\u0442\u0438 \u043a\u0435\u0440\u0456\u0432\u043d\u0456 \u043f\u043e\u0441\u0430\u0434\u0438 \u2014 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0430, \u043b\u0456\u0434\u0435\u0440\u0430, \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0430 \u2014 \u043d\u0430 \u0456\u043d\u0448\u0438\u0445 \u0441\u0435\u0440\u0432\u0435\u0440\u0430\u0445 \u0430\u0431\u043e \u043f\u0440\u043e\u0454\u043a\u0442\u0430\u0445.\",\"punishment\":\"\u0417\u043d\u044f\u0442\u0442\u044f \u0437 \u043f\u043e\u0441\u0430\u0434\u0438 + \u0427\u0421 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u043d\u0430 30 \u0434\u043d\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.8\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0432\u043e\u0434\u0438\u0442\u0438 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044e \u0432 \u043e\u043c\u0430\u043d\u0443 \u0430\u0431\u043e \u043d\u0430\u0434\u0430\u0432\u0430\u0442\u0438 \u0457\u0439 \u043d\u0435\u043f\u0440\u0430\u0432\u0434\u0438\u0432\u0443 \u0456\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0456\u044e.\",\"punishment\":\"\u0421\u0443\u0432\u043e\u0440\u0430 \u0434\u043e\u0433\u0430\u043d\u0430 / \u0417\u043d\u044f\u0442\u0442\u044f \u0437 \u043f\u043e\u0441\u0430\u0434\u0438\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.9\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043f\u0443\u0431\u043b\u0456\u0447\u043d\u043e \u043e\u0431\u0433\u043e\u0432\u043e\u0440\u044e\u0432\u0430\u0442\u0438 \u0430\u0431\u043e \u043a\u0440\u0438\u0442\u0438\u043a\u0443\u0432\u0430\u0442\u0438 \u0440\u0456\u0448\u0435\u043d\u043d\u044f \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u0432\u0456\u0434 \u0456\u043c\u0435\u043d\u0456 \u0444\u0440\u0430\u043a\u0446\u0456\u0457.\",\"punishment\":\"\u0414\u043e\u0433\u0430\u043d\u0430 / \u0417\u043d\u044f\u0442\u0442\u044f \u0437 \u043f\u043e\u0441\u0430\u0434\u0438\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.10\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0441\u0442\u0432\u043e\u0440\u044e\u0432\u0430\u0442\u0438 \u043f\u0456\u0434\u0441\u0442\u0430\u0432\u043d\u0456 RP-\u0441\u0438\u0442\u0443\u0430\u0446\u0456\u0457 \u2014 \u043b\u0438\u0448\u0435 \u0434\u043b\u044f \u0444\u043e\u0442\u043e \u0430\u0431\u043e \u0432\u0456\u0434\u0435\u043e \u0431\u0435\u0437 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0432\u0456\u0434\u0456\u0433\u0440\u0430\u0432\u0430\u043d\u043d\u044f.\",\"punishment\":\"\u041f\u0440\u043e\u0444\u0456\u043b\u0430\u043a\u0442\u0438\u0447\u043d\u0430 \u0431\u0435\u0441\u0456\u0434\u0430 / \u0423\u0441\u043d\u0430 \u0434\u043e\u0433\u0430\u043d\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.11\",\"text\":\"\u041b\u0456\u0434\u0435\u0440\u0430\u043c \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0430\u043c \u0434\u0435\u0440\u0436\u0430\u0432\u043d\u0438\u0445 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0439 \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0431\u0440\u0430\u0442\u0438 \u0443\u0447\u0430\u0441\u0442\u044c \u0443 \u0441\u0443\u0442\u0438\u0447\u043a\u0430\u0445 \u043c\u0456\u0436 \u0441\u0456\u043c'\u044f\u043c\u0438 \u0443 \u0440\u043e\u0431\u043e\u0447\u0438\u0439 \u0447\u0430\u0441, \u043d\u0430\u0432\u0456\u0442\u044c \u0431\u0435\u0437 \u0444\u043e\u0440\u043c\u0438.\",\"punishment\":\"\u0423\u0441\u043d\u0430 \u0434\u043e\u0433\u0430\u043d\u0430 / \u0421\u0443\u0432\u043e\u0440\u0430 \u0434\u043e\u0433\u0430\u043d\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0438\",\"id\":\"5.12\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0441\u0430\u043c\u043e\u0432\u0456\u043b\u044c\u043d\u043e \u0434\u043e\u0434\u0430\u0432\u0430\u0442\u0438 \u0430\u0431\u043e \u0432\u0438\u0434\u0430\u043b\u044f\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0456\u0437 \u0447\u043e\u0440\u043d\u043e\u0433\u043e \u0441\u043f\u0438\u0441\u043a\u0443 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0457 \u0431\u0435\u0437 \u043f\u043e\u0434\u0430\u043d\u043e\u0457 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e\u0457 \u0437\u0430\u044f\u0432\u0438.\",\"punishment\":\"\u0423\u0441\u043d\u0430 \u0434\u043e\u0433\u0430\u043d\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041d\u0435\u0430\u043a\u0442\u0438\u0432 \u0422\u0430 \u041f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u041f\u043e\u0441\u0430\u0434\u0438\",\"id\":\"6.1\",\"text\":\"\u041b\u0456\u0434\u0435\u0440\u0443 \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0431\u0440\u0430\u0442\u0438 \u043d\u0435\u0430\u043a\u0442\u0438\u0432 \u0431\u0435\u0437 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u043d\u044c\u043e\u0433\u043e \u0441\u0445\u0432\u0430\u043b\u0435\u043d\u043d\u044f \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u0443 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e\u043c\u0443 \u0440\u043e\u0437\u0434\u0456\u043b\u0456.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041d\u0435\u0430\u043a\u0442\u0438\u0432 \u0422\u0430 \u041f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u041f\u043e\u0441\u0430\u0434\u0438\",\"id\":\"6.2\",\"text\":\"\u0417\u0430\u043f\u043b\u0430\u043d\u043e\u0432\u0430\u043d\u0438\u0439 \u043d\u0435\u0430\u043a\u0442\u0438\u0432 \u043f\u043e\u043d\u0430\u0434 3 \u0434\u043e\u0431\u0438 \u0443\u0437\u0433\u043e\u0434\u0436\u0443\u0454\u0442\u044c\u0441\u044f \u0437\u0456 \u0441\u043b\u0456\u0434\u043a\u0443\u044e\u0447\u0438\u043c \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u043e\u043c \u043d\u0435 \u043f\u0456\u0437\u043d\u0456\u0448\u0435 \u043d\u0456\u0436 \u0437\u0430 24 \u0433\u043e\u0434\u0438\u043d\u0438. \u041c\u0430\u043a\u0441\u0438\u043c\u0430\u043b\u044c\u043d\u0438\u0439 \u0442\u0435\u0440\u043c\u0456\u043d \u043f\u043e\u0433\u043e\u0434\u0436\u0435\u043d\u043e\u0433\u043e \u043d\u0435\u0430\u043a\u0442\u0438\u0432\u0443 \u2014 7 \u0434\u0456\u0431, \u0446\u0456 \u0434\u043d\u0456 \u043d\u0435 \u0437\u0430\u0440\u0430\u0445\u043e\u0432\u0443\u044e\u0442\u044c\u0441\u044f \u0434\u043e \u0442\u0435\u0440\u043c\u0456\u043d\u0443 \u043b\u0456\u0434\u0435\u0440\u0441\u0442\u0432\u0430.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 6.2: \u0414\u043b\u044f \u043e\u0444\u043e\u0440\u043c\u043b\u0435\u043d\u043d\u044f \u043d\u0435\u0430\u043a\u0442\u0438\u0432\u0443 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u0430 \u043d\u0430\u044f\u0432\u043d\u0456\u0441\u0442\u044c \u0445\u043e\u0447\u0430 \u0431 \u043e\u0434\u043d\u043e\u0433\u043e \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0433\u043e \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0430. \u041f\u0456\u0434 \u0447\u0430\u0441 \u043d\u0435\u0430\u043a\u0442\u0438\u0432\u0443 \u0444\u0440\u0430\u043a\u0446\u0456\u044f \u043f\u043e\u0432\u0438\u043d\u043d\u0430 \u0437\u0430\u043b\u0438\u0448\u0430\u0442\u0438\u0441\u044f \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u044e \u2014 \u043d\u0430\u0431\u043e\u0440\u0438, RP-\u0432\u0456\u0434\u0456\u0433\u0440\u0430\u0432\u0430\u043d\u043d\u044f \u0442\u0430 \u043d\u0430\u0432\u0447\u0430\u043d\u043d\u044f \u043e\u0441\u043e\u0431\u043e\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041d\u0435\u0430\u043a\u0442\u0438\u0432 \u0422\u0430 \u041f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u041f\u043e\u0441\u0430\u0434\u0438\",\"id\":\"6.3\",\"text\":\"\u041d\u0430 \u0447\u0430\u0441 \u043d\u0435\u0430\u043a\u0442\u0438\u0432\u0443 \u043b\u0456\u0434\u0435\u0440\u0430 \u0439\u043e\u0433\u043e \u043f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u043d\u044f \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u043d\u043e \u043f\u0435\u0440\u0435\u0445\u043e\u0434\u044f\u0442\u044c \u0434\u043e \u043e\u0434\u043d\u043e\u0433\u043e \u0456\u0437 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432. \u042f\u043a\u0449\u043e \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a \u0442\u0430\u043a\u043e\u0436 \u0432\u0456\u0434\u0441\u0443\u0442\u043d\u0456\u0439 \u2014 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0430\u0454 \u0442\u0438\u043c\u0447\u0430\u0441\u043e\u0432\u043e \u0432\u0438\u043a\u043e\u043d\u0443\u044e\u0447\u043e\u0433\u043e \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041d\u0435\u0430\u043a\u0442\u0438\u0432 \u0422\u0430 \u041f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u041f\u043e\u0441\u0430\u0434\u0438\",\"id\":\"6.4\",\"text\":\"\u041b\u0456\u0434\u0435\u0440, \u044f\u043a\u0438\u0439 \u043f\u043b\u0430\u043d\u0443\u0454 \u0434\u043e\u0431\u0440\u043e\u0432\u0456\u043b\u044c\u043d\u043e \u0437\u0430\u043b\u0438\u0448\u0438\u0442\u0438 \u043f\u043e\u0441\u0430\u0434\u0443, \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u0438\u0442\u0438 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044e \u043d\u0435 \u043c\u0435\u043d\u0448\u0435 \u043d\u0456\u0436 \u0437\u0430 24 \u0433\u043e\u0434\u0438\u043d\u0438 \u0442\u0430 \u043f\u0435\u0440\u0435\u0434\u0430\u0442\u0438 \u0441\u043f\u0440\u0430\u0432\u0438 \u0443 \u043f\u043e\u0432\u043d\u043e\u043c\u0443 \u043e\u0431\u0441\u044f\u0437\u0456 \u2014 \u0441\u043a\u043b\u0430\u0434, \u0434\u043e\u043a\u0443\u043c\u0435\u043d\u0442\u0430\u0446\u0456\u044e, \u0434\u043e\u0441\u0442\u0443\u043f\u0438.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 6.4: \u041b\u0456\u0434\u0435\u0440, \u044f\u043a\u0438\u0439 \u0437\u0430\u043b\u0438\u0448\u0438\u0432 \u043f\u043e\u0441\u0430\u0434\u0443 \u0431\u0435\u0437 \u043d\u0430\u043b\u0435\u0436\u043d\u043e\u0457 \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0456 \u0441\u043f\u0440\u0430\u0432, \u0432\u043d\u043e\u0441\u0438\u0442\u044c\u0441\u044f \u0434\u043e \u0447\u043e\u0440\u043d\u043e\u0433\u043e \u0441\u043f\u0438\u0441\u043a\u0443 \u043b\u0456\u0434\u0435\u0440\u0456\u0432.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0442\u0430 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0456\u0432\",\"section\":\"\u041d\u0435\u0430\u043a\u0442\u0438\u0432 \u0422\u0430 \u041f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u041f\u043e\u0441\u0430\u0434\u0438\",\"id\":\"6.5\",\"text\":\"\u041b\u0456\u0434\u0435\u0440, \u0437\u043d\u044f\u0442\u0438\u0439 \u0437 \u043f\u043e\u0441\u0430\u0434\u0438 \u0430\u0431\u043e \u0442\u0430\u043a\u0438\u0439, \u0449\u043e \u0437\u0430\u043b\u0438\u0448\u0438\u0432 \u0457\u0457 \u0434\u043e\u0431\u0440\u043e\u0432\u0456\u043b\u044c\u043d\u043e, \u043d\u0435 \u043c\u043e\u0436\u0435 \u043f\u0440\u0435\u0442\u0435\u043d\u0434\u0443\u0432\u0430\u0442\u0438 \u043d\u0430 \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u0435 \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 4 \u0442\u0438\u0436\u043d\u0456\u0432. \u0423 \u0440\u0430\u0437\u0456 \u043f\u043e\u0432\u0442\u043e\u0440\u043d\u043e\u0433\u043e \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u2014 \u0442\u0435\u0440\u043c\u0456\u043d \u043c\u043e\u0436\u0435 \u0431\u0443\
