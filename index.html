.search{width:100%;border:1px solid var(--border);border-radius:30px;padding:18px 28px;background:rgba(235,251,255,.82);color:#06245d;outline:none;font-size:18px;box-shadow:var(--shadow)}body.dark .search{background:rgba(5,35,88,.78);color:#fff}.search::placeholder{color:#46749b}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 18px}.tab{border:1px solid var(--border);border-radius:15px;padding:12px 16px;background:var(--card);color:var(--text);font-weight:800}.tab.active{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#05265e}

.field{margin:14px 0}.field label{display:block;font-weight:900;margin-bottom:7px}textarea,input[type=url],input[type=text]{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;background:rgba(0,24,88,.42);color:#fff;outline:none}body.light textarea,body.light input[type=url],body.light input[type=text]{background:rgba(238,252,255,.9);color:var(--text)}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.primary,.secondary{border-radius:12px;padding:11px 15px;font-weight:900;border:1px solid var(--border)}.primary{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#05265e}.secondary{background:rgba(255,255,255,.16);color:var(--text)}

043d\u0438\u043a\u0456\u0432. \u0416\u043e\u0434\u043d\u0438\u0445 \u0432\u0438\u043d\u044f\u0442\u043a\u0456\u0432 \u0437\u0430 \u0441\u0442\u0430\u0442\u0443\u0441\u043e\u043c \u043d\u0435 \u0456\u0441\u043d\u0443\u0454.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.3\",\"text\":\"\u0410\u043a\u0442\u0443\u0430\u043b\u044c\u043d\u0430 \u0432\u0435\u0440\u0441\u0456\u044f \u043f\u0440\u0430\u0432\u0438\u043b \u0437\u0430\u0432\u0436\u0434\u0438 \u0440\u043e\u0437\u043c\u0456\u0449\u0435\u043d\u0430 \u043d\u0430 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0438\u0445 \u0440\u0435\u0441\u0443\u0440\u0441\u0430\u0445 \u043f\u0440\u043e\u0454\u043a\u0442\u0443. \u041a\u0435\u0440\u0456\u0432\u043d\u0438\u0446\u0442\u0432\u043e \u043c\u043e\u0436\u0435 \u0432\u043d\u043e\u0441\u0438\u0442\u0438 \u0437\u043c\u0456\u043d\u0438 \u0431\u0435\u0437 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u043d\u044c\u043e\u0433\u043e \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u0435\u043d\u043d\u044f.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.4\",\"text\":\"\u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u0434\u0456\u0454 \u0432 \u0456\u043d\u0442\u0435\u0440\u0435\u0441\u0430\u0445 \u043f\u0440\u043e\u0454\u043a\u0442\u0443 \u0442\u0430 \u0439\u043e\u0433\u043e \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432. \u0412\u043e\u043d\u0430 \u043d\u0435 \u0432\u0442\u0440\u0443\u0447\u0430\u0454\u0442\u044c\u0441\u044f \u0432 \u0440\u043e\u043b\u044c\u043e\u0432\u0438\u0439 \u043f\u0440\u043e\u0446\u0435\u0441, \u043d\u0435 \u043d\u0430\u0434\u0430\u0454 \u0456\u0433\u0440\u043e\u0432\u0438\u0445 \u043f\u0435\u0440\u0435\u0432\u0430\u0433 \u0456 \u043d\u0435 \u0437\u0430\u043f\u0438\u0442\u0443\u0454 \u0434\u0430\u043d\u0438\u0445 \u0432\u0456\u0434 \u0430\u043a\u0430\u0443\u043d\u0442\u0456\u0432 \u2014 \u044f\u043a\u0449\u043e \u0445\u0442\u043e\u0441\u044c \u0440\u043e\u0431\u0438\u0442\u044c \u0446\u0435 \u0432\u0456\u0434 \u0456\u043c\u0435\u043d\u0456 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457, \u0441\u043b\u0456\u0434 \u043d\u0435\u0433\u0430\u0439\u043d\u043e \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u0438\u0442\u0438 \u043f\u0440\u043e \u0446\u0435.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u0441\u043f\u043e\u0441\u043e\u0431\u0438 \u0434\u043b\u044f \u0437\u0432'\u044f\u0437\u043a\u0443 \u0437 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e \u2014 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0456 \u0440\u0435\u0441\u0443\u0440\u0441\u0438 \u043f\u0440\u043e\u0454\u043a\u0442\u0443: Discord, \u0440\u0435\u043f\u043e\u0440\u0442 \u0443 \u0433\u0440\u0456, \u0442\u0435\u0445\u043d\u0456\u0447\u043d\u0430 \u043f\u0456\u0434\u0442\u0440\u0438\u043c\u043a\u0430.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.5\",\"text\":\"\u041f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u0432\u0438\u0434\u0430\u044e\u0442\u044c\u0441\u044f \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e \u0434\u043e \u043f\u0440\u0430\u0432\u0438\u043b. \u0423 \u0432\u0438\u043d\u044f\u0442\u043a\u043e\u0432\u0438\u0445 \u0430\u0431\u043e \u043d\u0435\u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u0438\u0445 \u0441\u0438\u0442\u0443\u0430\u0446\u0456\u044f\u0445 \u0433\u043e\u043b\u043e\u0432\u043d\u0430 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0432\u0456\u0434\u0441\u0442\u0443\u043f\u0438\u0442\u0438 \u0432\u0456\u0434 \u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u043e\u0457 \u0448\u043a\u0430\u043b\u0438 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0456\u0437 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u0438\u043c \u043f\u043e\u044f\u0441\u043d\u0435\u043d\u043d\u044f\u043c \u0440\u0456\u0448\u0435\u043d\u043d\u044f.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.6\",\"text\":\"\u042f\u043a\u0449\u043e \u043f\u0435\u0432\u043d\u0430 \u0441\u0438\u0442\u0443\u0430\u0446\u0456\u044f \u043d\u0435 \u043e\u043f\u0438\u0441\u0430\u043d\u0430 \u0443 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\u0445, \u0430\u043b\u0435 \u043e\u0447\u0435\u0432\u0438\u0434\u043d\u043e \u0441\u0443\u043f\u0435\u0440\u0435\u0447\u0438\u0442\u044c \u043f\u0440\u0438\u043d\u0446\u0438\u043f\u0430\u043c \u0447\u0435\u0441\u043d\u043e\u0457 \u0433\u0440\u0438 \u2014 \u043a\u0435\u0440\u0456\u0432\u043d\u0438\u0446\u0442\u0432\u043e \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0432\u0438\u0434\u0430\u0442\u0438 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u043d\u0430 \u0432\u043b\u0430\u0441\u043d\u0438\u0439 \u0440\u043e\u0437\u0441\u0443\u0434. \u0422\u0430\u043a\u0456 \u0432\u0438\u043f\u0430\u0434\u043a\u0438 \u043d\u0430\u0434\u0430\u043b\u0456 \u0444\u0456\u043a\u0441\u0443\u044e\u0442\u044c\u0441\u044f \u0443 \u0440\u0435\u0433\u043b\u0430\u043c\u0435\u043d\u0442\u0456.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.7\",\"text\":\"\u0421\u043a\u0430\u0440\u0433\u0438, \u0430\u043f\u0435\u043b\u044f\u0446\u0456\u0457 \u0442\u0430 \u0431\u0443\u0434\u044c-\u044f\u043a\u0456 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0456 \u0437\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0440\u043e\u0437\u0433\u043b\u044f\u0434\u0430\u044e\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0447\u0435\u0440\u0435\u0437 \u0432\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u0456 \u043a\u0430\u043d\u0430\u043b\u0438 \u043f\u0440\u043e\u0454\u043a\u0442\u0443. \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u043d\u0435 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0430 \u0440\u0435\u0430\u0433\u0443\u0432\u0430\u0442\u0438 \u043d\u0430 \u0437\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u043f\u043e\u0437\u0430 \u043d\u0438\u043c\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.8\",\"text\":\"\u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u043d\u0435 \u043d\u0435\u0441\u0435 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u043e\u0441\u0442\u0456 \u0437\u0430 \u0437\u0431\u0435\u0440\u0435\u0436\u0435\u043d\u043d\u044f \u0430\u043a\u0430\u0443\u043d\u0442\u0456\u0432, \u0456\u0433\u0440\u043e\u0432\u043e\u0433\u043e \u043c\u0430\u0439\u043d\u0430 \u0442\u0430 \u043e\u0441\u043e\u0431\u0438\u0441\u0442\u0438\u0445 \u0434\u0430\u043d\u0438\u0445 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0443 \u0440\u0430\u0437\u0456 \u0457\u0445 \u0432\u0442\u0440\u0430\u0442\u0438 \u0437 \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u0457 \u043f\u0440\u0438\u0447\u0438\u043d\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.9\",\"text\":\"\u041d\u0435\u0440\u0443\u0445\u043e\u043c\u0456\u0441\u0442\u044c (\u0431\u0443\u0434\u0438\u043d\u043a\u0438, \u043a\u0432\u0430\u0440\u0442\u0438\u0440\u0438, \u0431\u0456\u0437\u043d\u0435\u0441\u0438) \u0454 \u043a\u043b\u044e\u0447\u043e\u0432\u0438\u043c \u0435\u043b\u0435\u043c\u0435\u043d\u0442\u043e\u043c \u0435\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0438 \u043f\u0440\u043e\u0454\u043a\u0442\u0443. \u0414\u043b\u044f \u0443\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u043c\u0430\u0439\u043d\u0430 \u0433\u0440\u0430\u0432\u0435\u0446\u044c \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u043f\u0440\u043e\u044f\u0432\u043b\u044f\u0442\u0438 \u0440\u0435\u0433\u0443\u043b\u044f\u0440\u043d\u0443 \u0456\u0433\u0440\u043e\u0432\u0443 \u0430\u043a\u0442\u0438\u0432\u043d\u0456\u0441\u0442\u044c. \u0423 \u0440\u0430\u0437\u0456 \u0442\u0440\u0438\u0432\u0430\u043b\u043e\u0457 \u0432\u0456\u0434\u0441\u0443\u0442\u043d\u043e\u0441\u0442\u0456 \u0432\u043b\u0430\u0441\u043d\u0438\u043a\u0430 \u0432 \u0433\u0440\u0456, \u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u0437\u0430\u043b\u0438\u0448\u0430\u0454 \u0437\u0430 \u0441\u043e\u0431\u043e\u044e \u043f\u0440\u0430\u0432\u043e \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u043d\u043e \u0430\u043d\u0443\u043b\u044e\u0432\u0430\u0442\u0438 \u043f\u0440\u0430\u0432\u043e \u0432\u043b\u0430\u0441\u043d\u043e\u0441\u0442\u0456 \u0442\u0430 \u043f\u043e\u0432\u0435\u0440\u043d\u0443\u0442\u0438 \u043c\u0430\u0439\u043d\u043e \u043d\u0430 \u043a\u043e\u0440\u0438\u0441\u0442\u044c \u0434\u0435\u0440\u0436\u0430\u0432\u0438. \u0410\u043b\u0433\u043e\u0440\u0438\u0442\u043c\u0438 \u043e\u0446\u0456\u043d\u043a\u0438 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0441\u0442\u0456 \u0454 \u0434\u0438\u043d\u0430\u043c\u0456\u0447\u043d\u0438\u043c\u0438 \u0456 \u043d\u0435 \u0440\u043e\u0437\u0433\u043e\u043b\u043e\u0448\u0443\u044e\u0442\u044c\u0441\u044f \u0437 \u043c\u0435\u0442\u043e\u044e \u0443\u043d\u0438\u043a\u043d\u0435\u043d\u043d\u044f \u0448\u0442\u0443\u0447\u043d\u0438\u0445 \u043d\u0430\u043a\u0440\u0443\u0442\u043e\u043a \u043e\u043d\u043b\u0430\u0439\u043d\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041e\u0431\u043b\u0456\u043a\u043e\u0432\u0438\u0439 \u0417\u0430\u043f\u0438\u0441 \u0422\u0430 \u041d\u0456\u043a\u043d\u0435\u0439\u043c\",\"id\":\"2.1\",\"text\":\"\u041d\u0456\u043a\u043d\u0435\u0439\u043c \u0433\u0440\u0430\u0432\u0446\u044f \u043c\u0430\u0454 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u0442\u0438 \u0444\u043e\u0440\u043c\u0430\u0442\u0443 \u0406\u043c'\u044f_\u041f\u0440\u0456\u0437\u0432\u0438\u0449\u0435 \u0442\u0430 \u0431\u0443\u0442\u0438 \u0437\u0430\u043f\u0438\u0441\u0430\u043d\u0438\u0439 \u043b\u0430\u0442\u0438\u043d\u0438\u0446\u0435\u044e. \u0406\u043c'\u044f \u0442\u0430 \u043f\u0440\u0456\u0437\u0432\u0438\u0449\u0435 \u043c\u0430\u044e\u0442\u044c \u0431\u0443\u0442\u0438 \u0440\u0435\u0430\u043b\u044c\u043d\u043e \u0456\u0441\u043d\u0443\u044e\u0447\u0438\u043c\u0438 \u2014 \u043d\u0435 \u0432\u0438\u0433\u0430\u0434\u0430\u043d\u0438\u043c\u0438 \u0441\u043b\u043e\u0432\u0430\u043c\u0438, \u043f\u0440\u0456\u0437\u0432\u0438\u0441\u044c\u043a\u0430\u043c\u0438 \u0447\u0438 \u0430\u0431\u0440\u0435\u0432\u0456\u0430\u0442\u0443\u0440\u0430\u043c\u0438.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u044f\u043a\u0449\u043e \u043d\u0435 \u043c\u043e\u0436\u0435\u0442\u0435 \u043f\u0456\u0434\u0456\u0431\u0440\u0430\u0442\u0438 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u0438\u0439 \u043d\u0456\u043a\u043d\u0435\u0439\u043c \u2014 \u0441\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u0439\u0441\u044f \u0433\u0435\u043d\u0435\u0440\u0430\u0442\u043e\u0440\u043e\u043c RP-\u043d\u0456\u043a\u043d\u0435\u0439\u043c\u0456\u0432. \u041f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u0456 \u043f\u0440\u0438\u043a\u043b\u0430\u0434\u0438: Andriy_Bondar, Sofia_Lytvyn. \u041d\u0435\u043f\u0440\u0430\u0432\u0438\u043b\u044c\u043d\u0456: Ghost_Kill, Maloy_Tawer, SASHA_TOP.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041e\u0431\u043b\u0456\u043a\u043e\u0432\u0438\u0439 \u0417\u0430\u043f\u0438\u0441 \u0422\u0430 \u041d\u0456\u043a\u043d\u0435\u0439\u043c\",\"id\":\"2.2\",\"text\":\"\u041d\u0456\u043a\u043d\u0435\u0439\u043c \u043d\u0435 \u043c\u043e\u0436\u0435 \u043c\u0456\u0441\u0442\u0438\u0442\u0438: \u0432\u0435\u043b\u0438\u043a\u0456 \u043b\u0456\u0442\u0435\u0440\u0438 \u0443 \u0434\u043e\u0432\u0456\u043b\u044c\u043d\u043e\u043c\u0443 \u043f\u043e\u0440\u044f\u0434\u043a\u0443, \u043d\u0435\u0446\u0435\u043d\u0437\u0443\u0440\u043d\u0443 \u043b\u0435\u043a\u0441\u0438\u043a\u0443 \u0430\u0431\u043e \u043d\u0430\u0442\u044f\u043a\u0438 \u043d\u0430 \u043d\u0435\u0457, \u043e\u0431\u0440\u0430\u0437\u043b\u0438\u0432\u0456 \u0441\u043b\u043e\u0432\u0430, \u0440\u0435\u043a\u043b\u0430\u043c\u0443, \u0430 \u0442\u0430\u043a\u043e\u0436 \u0431\u0443\u0442\u0438 \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e \u0441\u0445\u043e\u0436\u0438\u043c \u043d\u0430 \u043d\u0456\u043a\u043d\u0435\u0439\u043c \u0447\u043b\u0435\u043d\u0430 \u043a\u043e\u043c\u0430\u043d\u0434\u0438 \u043f\u0440\u043e\u0454\u043a\u0442\u0443.\",\"punishment\":\"\u041f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f \u0456\u0437 \u0432\u0438\u043c\u043e\u0433\u043e\u044e \u0437\u043c\u0456\u043d\u0438\u0442\u0438 \u043d\u0456\u043a\u043d\u0435\u0439\u043c / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u2014 \u0437\u0430\u043b\u0435\u0436\u043d\u043e \u0432\u0456\u0434 \u0445\u0430\u0440\u0430\u043a\u0442\u0435\u0440\u0443 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f]\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u0443\u0441\u0456 \u043f\u0435\u0440\u0435\u043b\u0456\u0447\u0435\u043d\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043e\u0431'\u0454\u0434\u043d\u0430\u043d\u0456 \u0432 \u043e\u0434\u0438\u043d \u043f\u0443\u043d\u043a\u0442, \u043e\u0441\u043a\u0456\u043b\u044c\u043a\u0438 \u0441\u0442\u043e\u0441\u0443\u044e\u0442\u044c\u0441\u044f \u0437\u043e\u0432\u043d\u0456\u0448\u043d\u044c\u043e\u0433\u043e \u0432\u0438\u0433\u043b\u044f\u0434\u0443 \u043d\u0456\u043a\u043d\u0435\u0439\u043c\u0443. \u0422\u044f\u0436\u043a\u0456\u0441\u0442\u044c \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u0437\u0430\u043b\u0435\u0436\u0438\u0442\u044c \u0432\u0456\u0434 \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u043e\u0433\u043e \u0432\u0438\u043f\u0430\u0434\u043a\u0443 \u2014 \u043a\u0430\u043f\u0441\u043b\u043e\u043a \u0456 \u0440\u0435\u043a\u043b\u0430\u043c\u0430 \u043c\u0430\u0442\u0438\u043c\u0443\u0442\u044c \u0440\u0456\u0437\u043d\u0456 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041e\u0431\u043b\u0456\u043a\u043e\u0432\u0438\u0439 \u0417\u0430\u043f\u0438\u0441 \u0422\u0430 \u041d\u0456\u043a\u043d\u0435\u0439\u043c\",\"id\":\"2.3\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0441\u0442\u0432\u043e\u0440\u044e\u0432\u0430\u0442\u0438 \u0430\u043a\u0430\u0443\u043d\u0442\u0438 \u0430\u0431\u043e \u0437\u043c\u0456\u043d\u044e\u0432\u0430\u0442\u0438 \u043d\u0456\u043a\u043d\u0435\u0439\u043c \u043d\u0430 \u0442\u0430\u043a\u0438\u0439, \u0449\u043e \u043f\u0435\u0440\u0435\u043a\u0440\u0443\u0447\u0443\u0454 \u0447\u0438 \u0441\u043f\u043e\u0442\u0432\u043e\u0440\u044e\u0454 \u043d\u0456\u043a-\u043d\u0435\u0439\u043c\u0438 \u0456\u043d\u0448\u0438\u0445 \u0433\u0440\u0430\u0432\u0446\u0456\u0432, \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0456\u0432 \u0447\u0438 \u043a\u043e\u043c\u0430\u043d\u0434\u0438 \u043f\u0440\u043e\u0454\u043a\u0442\u0443\",\"punishment\":\"\u0411\u0430\u043d 7 \u0434\u043d\u0456\u0432 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041e\u0431\u043b\u0456\u043a\u043e\u0432\u0438\u0439 \u0417\u0430\u043f\u0438\u0441 \u0422\u0430 \u041d\u0456\u043a\u043d\u0435\u0439\u043c\",\"id\":\"2.4\",\"text\":\"\u041a\u043e\u0436\u0435\u043d \u0437\u0430\u0440\u0435\u0454\u0441\u0442\u0440\u043e\u0432\u0430\u043d\u0438\u0439 \u043e\u0431\u043b\u0456\u043a\u043e\u0432\u0438\u0439 \u0437\u0430\u043f\u0438\u0441 \u043d\u0430\u043b\u0435\u0436\u0438\u0442\u044c \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0442\u0456\u0439 \u043e\u0441\u043e\u0431\u0456, \u044f\u043a\u0430 \u0439\u043e\u0433\u043e \u0441\u0442\u0432\u043e\u0440\u0438\u043b\u0430. \u041f\u0435\u0440\u0435\u0434\u0430\u0447\u0430, \u043f\u0440\u043e\u0434\u0430\u0436 \u0430\u0431\u043e \u0441\u043f\u0456\u043b\u044c\u043d\u0435 \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0430\u043a\u0430\u0443\u043d\u0442\u0443 \u2014 \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u0456.\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u0431\u043b\u0456\u043a\u043e\u0432\u043e\u0433\u043e \u0437\u0430\u043f\u0438\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041e\u0431\u043b\u0456\u043a\u043e\u0432\u0438\u0439 \u0417\u0430\u043f\u0438\u0441 \u0422\u0430 \u041d\u0456\u043a\u043d\u0435\u0439\u043c\",\"id\":\"2.5\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u0434\u0430\u0432\u0430\u0442\u0438 \u0441\u0435\u0431\u0435 \u0437\u0430 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0430 \u0430\u0431\u043e \u043f\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u043d\u0438\u043a\u0430 \u043a\u043e\u043c\u0430\u043d\u0434\u0438 \u043f\u0440\u043e\u0454\u043a\u0442\u0443.\",\"punishment\":\"\u0411\u0430\u043d 7 \u0434\u043d\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041e\u0431\u043b\u0456\u043a\u043e\u0432\u0438\u0439 \u0417\u0430\u043f\u0438\u0441 \u0422\u0430 \u041d\u0456\u043a\u043d\u0435\u0439\u043c\",\"id\":\"2.6\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0431\u0443\u0434\u044c-\u044f\u043a\u0430 \u0442\u043e\u0440\u0433\u0456\u0432\u043b\u044f \u0456\u0433\u0440\u043e\u0432\u0438\u043c\u0438 \u0446\u0456\u043d\u043d\u043e\u0441\u0442\u044f\u043c\u0438 \u0437\u0430 \u0440\u0435\u0430\u043b\u044c\u043d\u0456 \u0433\u0440\u043e\u0448\u0456 \u2014 \u0430\u043a\u0430\u0443\u043d\u0442\u0430\u043c\u0438, \u0432\u0430\u043b\u044e\u0442\u043e\u044e, \u043c\u0430\u0439\u043d\u043e\u043c \u0430\u0431\u043e \u0431\u0443\u0434\u044c-\u0447\u0438\u043c \u0456\u043d\u0448\u0438\u043c, \u0449\u043e \u043c\u0430\u0454 \u0456\u0433\u0440\u043e\u0432\u0443 \u0432\u0430\u0440\u0442\u0456\u0441\u0442\u044c (\u0437\u0434\u0456\u0439\u0441\u043d\u0435\u043d\u0438\u0439 \u0444\u0430\u043a\u0442 \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0456).\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u0431\u043b\u0456\u043a\u043e\u0432\u043e\u0433\u043e \u0437\u0430\u043f\u0438\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041e\u0431\u043b\u0456\u043a\u043e\u0432\u0438\u0439 \u0417\u0430\u043f\u0438\u0441 \u0422\u0430 \u041d\u0456\u043a\u043d\u0435\u0439\u043c\",\"id\":\"2.6.1\",\"text\":\"\u0421\u043f\u0440\u043e\u0431\u0430 \u0442\u043e\u0440\u0433\u0456\u0432\u043b\u0456 \u0456\u0433\u0440\u043e\u0432\u0438\u043c\u0438 \u0446\u0456\u043d\u043d\u043e\u0441\u0442\u044f\u043c\u0438 \u0437\u0430 \u0440\u0435\u0430\u043b\u044c\u043d\u0456 \u0433\u0440\u043e\u0448\u0456, \u043f\u0440\u044f\u043c\u0456 \u0447\u0438 \u0437\u0430\u0432\u0443\u0430\u043b\u044c\u043e\u0432\u0430\u043d\u0456 \u043f\u0440\u043e\u043f\u043e\u0437\u0438\u0446\u0456\u0457 \u043f\u0440\u043e \u043a\u0443\u043f\u0456\u0432\u043b\u044e/\u043f\u0440\u043e\u0434\u0430\u0436, \u0430 \u0442\u0430\u043a\u043e\u0436 \u0436\u0430\u0440\u0442\u0438 \u043d\u0430 \u0446\u044e \u0442\u0435\u043c\u0443 \u0432 \u0431\u0443\u0434\u044c-\u044f\u043a\u0438\u0445 \u0456\u0433\u0440\u043e\u0432\u0438\u0445 \u0447\u0430\u0442\u0430\u0445.\",\"punishment\":\"\u0411\u0430\u043d 15 \u0434\u043d\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041e\u0431\u043b\u0456\u043a\u043e\u0432\u0438\u0439 \u0417\u0430\u043f\u0438\u0441 \u0422\u0430 \u041d\u0456\u043a\u043d\u0435\u0439\u043c\",\"id\":\"2.7\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043e\u0431\u043c\u0456\u043d\u044e\u0432\u0430\u0442\u0438 \u0456\u0433\u0440\u043e\u0432\u0456 \u0446\u0456\u043d\u043d\u043e\u0441\u0442\u0456 \u043c\u0456\u0436 \u0440\u0456\u0437\u043d\u0438\u043c\u0438 \u0441\u0435\u0440\u0432\u0435\u0440\u0430\u043c\u0438 \u043f\u0440\u043e\u0454\u043a\u0442\u0443.\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u0431\u043b\u0456\u043a\u043e\u0432\u043e\u0433\u043e \u0437\u0430\u043f\u0438\u0441\u0443 \u043d\u0430 \u0432\u0441\u0456\u0445 \u0441\u0435\u0440\u0432\u0435\u0440\u0430\u0445\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041e\u0431\u043b\u0456\u043a\u043e\u0432\u0438\u0439 \u0417\u0430\u043f\u0438\u0441 \u0422\u0430 \u041d\u0456\u043a\u043d\u0435\u0439\u043c\",\"id\":\"2.8\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0431\u0440\u0430\u0442\u0438 \u0443\u0447\u0430\u0441\u0442\u044c \u0432 \u0430\u043a\u0446\u0456\u044f\u0445 \u0430\u0431\u043e \u043a\u043e\u043d\u043a\u0443\u0440\u0441\u0430\u0445 \u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0456\u0445 \u0440\u0435\u0441\u0443\u0440\u0441\u0456\u0432, \u043f\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0445 \u0437 \u0442\u043e\u0440\u0433\u0456\u0432\u043b\u0435\u044e \u0456\u0433\u0440\u043e\u0432\u0438\u043c\u0438 \u0446\u0456\u043d\u043d\u043e\u0441\u0442\u044f\u043c\u0438.\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u0431\u043b\u0456\u043a\u043e\u0432\u043e\u0433\u043e \u0437\u0430\u043f\u0438\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.1\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0454 \u043f\u0440\u043e\u0433\u0440\u0430\u043c\u043d\u0435 \u0437\u0430\u0431\u0435\u0437\u043f\u0435\u0447\u0435\u043d\u043d\u044f (\u0447\u0438\u0442\u044b \u043d\u0430 \u0448\u0432\u0438\u0434\u043a\u0456\u0441\u0442\u044c, \u0430\u0432\u0442\u043e\u043f\u0440\u0438\u0446\u0456\u043b\u044e\u0432\u0430\u043d\u043d\u044f, \u043f\u0456\u0434\u0432\u0438\u0449\u0435\u043d\u0430 \u0432\u0438\u0434\u0438\u043c\u0456\u0441\u0442\u044c \u0442\u043e\u0449\u043e).\",\"punishment\":\"\u0411\u0430\u043d 30 \u0434\u043d\u0456\u0432 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.2\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0431\u0430\u0433\u0438 \u043c\u043e\u0434\u0430 \u0443 \u0432\u043b\u0430\u0441\u043d\u0438\u0445 \u0456\u043d\u0442\u0435\u0440\u0435\u0441\u0430\u0445.\",\"punishment\":\"Jail 60 \u0445\u0432 / \u0411\u0430\u043d 7\u201315 \u0434\u043d\u0456\u0432\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u0432\u0438\u044f\u0432\u043b\u0435\u043d\u0438\u0439 \u0431\u0430\u0433 \u043e\u0434\u0440\u0430\u0437\u0443 \u043f\u043e\u0432\u0456\u0434\u043e\u043c \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 (\u0440\u0435\u043f\u043e\u0440\u0442 / Discord). \u0421\u0432\u043e\u0454\u0447\u0430\u0441\u043d\u0435 \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u0435\u043d\u043d\u044f \u2014 \u043f\u043e\u043c'\u044f\u043a\u0448\u0443\u044e\u0447\u0430 \u043e\u0431\u0441\u0442\u0430\u0432\u0438\u043d\u0430.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.3\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0431\u0430\u0433\u0456\u0432 \u0434\u043b\u044f \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0456\u0433\u0440\u043e\u0432\u0438\u0445 \u0446\u0456\u043d\u043d\u043e\u0441\u0442\u0435\u0439.\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0430\u043a\u0430\u0443\u043d\u0442\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.4\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043e\u0431\u0445\u043e\u0434\u0438\u0442\u0438 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0456 \u0456\u0433\u0440\u043e\u0432\u0456 \u0441\u0438\u0441\u0442\u0435\u043c\u0438 \u0443 \u043d\u0435\u043f\u0435\u0440\u0435\u0434\u0431\u0430\u0447\u0435\u043d\u0438\u0439 \u0440\u043e\u0437\u0440\u043e\u0431\u043d\u0438\u043a\u0430\u043c\u0438 \u0441\u043f\u043e\u0441\u0456\u0431.\",\"punishment\":\"\u0411\u0430\u043d 14\u201330 \u0434\u043d\u0456\u0432 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u043d\u0430\u043f\u0440. \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u043a\u043e\u0448\u0442\u0456\u0432 \u0447\u0435\u0440\u0435\u0437 \u043f\u0440\u043e\u0434\u0430\u0436 \u043f\u0440\u0435\u0434\u043c\u0435\u0442\u0456\u0432 \u0437\u0430 \u043d\u0435\u0440\u0435\u0430\u043b\u044c\u043d\u043e\u044e \u0446\u0456\u043d\u043e\u044e \u0437\u0430\u043c\u0456\u0441\u0442\u044c \u0431\u0430\u043d\u043a. \u043f\u0435\u0440\u0435\u043a\u0430\u0437\u0443 \u0447\u0438 \u043c\u0435\u043d\u044e \u043e\u0431\u043c\u0456\u043d\u0443.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.5\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e \u043f\u0456\u0434\u0441\u0442\u0430\u0432\u043b\u044f\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u0456\u0432, \u043b\u0456\u0434\u0435\u0440\u0456\u0432 \u0447\u0438 \u0430\u0434\u043c\u0456\u043d\u0456\u0432 (\u043d\u0435\u043f\u0440\u0430\u0432\u0434\u0438\u0432\u0430 \u0456\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0456\u044f, \u043f\u0440\u043e\u0432\u043e\u043a\u0430\u0446\u0456\u0457, \u043c\u0430\u043d\u0456\u043f\u0443\u043b\u044f\u0446\u0456\u0457).\",\"punishment\":\"\u0411\u0430\u043d 14 \u0434\u043d\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.6\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u0438\u043c\u0430\u0433\u0430\u0442\u0438 \u043a\u043e\u0448\u0442\u0438/\u043c\u0430\u0439\u043d\u043e/\u043f\u043e\u0441\u043b\u0443\u0433\u0438 \u043f\u0456\u0434 \u0442\u0438\u0441\u043a\u043e\u043c (\u043f\u043e\u0433\u0440\u043e\u0437\u0438, \u0448\u0430\u043d\u0442\u0430\u0436, \u0448\u0442\u0443\u0447\u043d\u0456 \u043e\u0431\u043c\u0435\u0436\u0435\u043d\u043d\u044f).\",\"punishment\":\"\u0411\u0430\u043d 14 \u0434\u043d\u0456\u0432 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u043d\u0430\u043f\u0440. \\\"\u041f\u0435\u0440\u0435\u0432\u0435\u0434\u0438 \u043a\u043e\u0448\u0442\u0438, \u0430\u0431\u043e \u043f\u043e\u0434\u0430\u043c \u0441\u043a\u0430\u0440\u0433\u0443\\\". \u0412\u0438\u043d\u044f\u0442\u043e\u043a \u2014 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0456 \u0432\u043d\u0435\u0441\u043a\u0438 \u0442\u0430 \u0448\u0442\u0440\u0430\u0444\u0438 \u0437\u0430 RP-\u043c\u0435\u0445\u0430\u043d\u0456\u043a\u0430\u043c\u0438.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.7\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0440\u043e\u0437\u043f\u0430\u043b\u044e\u0432\u0430\u043d\u043d\u044f \u0432\u043e\u0440\u043e\u0436\u043d\u0435\u0447\u0456 (\u0440\u0430\u0441\u0438\u0437\u043c, \u043d\u0430\u0446\u0438\u0441\u0442\u0441\u044c\u043a\u0430 \u0441\u0438\u043c\u0432\u043e\u043b\u0456\u043a\u0430, \u0440\u0435\u043b\u0456\u0433\u0456\u0439\u043d\u0456 \u043f\u0440\u043e\u0432\u043e\u043a\u0430\u0446\u0456\u0457, \u0437\u0430\u043a\u043b\u0438\u043a\u0438 \u0434\u043e \u043d\u0430\u0441\u0438\u043b\u044c\u0441\u0442\u0432\u0430, \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u0456 \u0456\u0434\u0435\u043e\u043b\u043e\u0433\u0456\u0457).\",\"punishment\":\"\u041c\u0443\u0442 180 \u0445\u0432 / \u0411\u0430\u043d 7\u201330 \u0434\u043d\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.8\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0441\u043f\u0456\u0432\u043f\u0440\u0430\u0446\u044e\u0432\u0430\u0442\u0438 \u0437 \u0433\u0440\u0430\u0432\u0446\u044f\u043c\u0438 \u0437 \u0447\u043e\u0440\u043d\u043e\u0433\u043e \u0441\u043f\u0438\u0441\u043a\u0443 \u0430\u0431\u043e \u043f\u0456\u0434\u0442\u0432\u0435\u0440\u0434\u0436\u0435\u043d\u0438\u043c\u0438 \u043f\u043e\u0440\u0443\u0448\u043d\u0438\u043a\u0430\u043c\u0438.\",\"punishment\":\"\u041f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f, \u0430\u043d\u0430\u043b\u043e\u0433\u0456\u0447\u043d\u0435 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044e \u043f\u043e\u0440\u0443\u0448\u043d\u0438\u043a\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.9\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043f\u043e\u0448\u0438\u0440\u044e\u0432\u0430\u0442\u0438 \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u044e \u0456\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0456\u044e \u043f\u0440\u043e\u0454\u043a\u0442\u0443 (\u0430\u0434\u043c\u0456\u043d-\u043c\u0430\u0442\u0435\u0440\u0456\u0430\u043b\u0438, \u0437\u0430\u043a\u0440\u0438\u0442\u0456 \u0447\u0430\u0442\u0438, \u0441\u0438\u0441\u0442\u0435\u043c\u043d\u0456 \u0434\u0430\u043d\u0456).\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0430\u043a\u0430\u0443\u043d\u0442\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.10\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e \u0434\u0435\u0441\u0442\u0430\u0431\u0456\u043b\u0456\u0437\u0443\u0432\u0430\u0442\u0438 \u0435\u043a\u043e\u043d\u043e\u043c\u0456\u043a\u0443 (\u043c\u0430\u0441\u043e\u0432\u0430 \u0440\u043e\u0437\u0434\u0430\u0447\u0430 \u043a\u043e\u0448\u0442\u0456\u0432/\u043c\u0430\u0439\u043d\u0430, \u043c\u0430\u043d\u0456\u043f\u0443\u043b\u044f\u0446\u0456\u0457 \u0446\u0456\u043d\u0430\u043c\u0438).\",\"punishment\":\"\u0411\u0430\u043d 14\u201330 \u0434\u043d\u0456\u0432 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.11\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0437\u043b\u043e\u0432\u0436\u0438\u0432\u0430\u0442\u0438 \u043b\u0456\u0434\u0435\u0440\u0441\u044c\u043a\u0438\u043c\u0438, \u0444\u0440\u0430\u043a\u0446\u0456\u0439\u043d\u0438\u043c\u0438, \u0441\u0456\u043c\u0435\u0439\u043d\u0438\u043c\u0438 \u0430\u0431\u043e \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u0438\u0432\u043d\u0438\u043c\u0438 \u043f\u043e\u0432\u043d\u043e\u0432\u0430\u0436\u0435\u043d\u043d\u044f\u043c\u0438 \u043d\u0430 \u0448\u043a\u043e\u0434\u0443 \u0433\u0440\u0430\u0432\u0446\u044f\u043c \u0447\u0438 \u043f\u0440\u043e\u0454\u043a\u0442\u0443.\",\"punishment\":\"\u0411\u0430\u043d 30 \u0434\u043d\u0456\u0432 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0430\u043a\u0430\u0443\u043d\u0442\u0430\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u0414\u043e \u0437\u043b\u043e\u0432\u0436\u0438\u0432\u0430\u043d\u044c \u043d\u0430\u043b\u0435\u0436\u0430\u0442\u044c: \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u0438\u0439 \u0437\u043b\u0438\u0432 \u0441\u043a\u043b\u0430\u0434\u0443 \u0444\u0440\u0430\u043a\u0446\u0456\u0457/\u0441\u0456\u043c'\u0457, \u043a\u0440\u0430\u0434\u0456\u0436\u043a\u0430 \u043c\u0430\u0442\u0435\u0440\u0456\u0430\u043b\u0456\u0432/\u043f\u0430\u0442\u0440\u043e\u043d\u0456\u0432/\u0431\u044e\u0434\u0436\u0435\u0442\u0443 \u0432 \u043e\u0441\u043e\u0431\u043b\u0438\u0432\u043e \u0432\u0435\u043b\u0438\u043a\u0438\u0445 \u0440\u043e\u0437\u043c\u0456\u0440\u0430\u0445, \u0431\u0435\u0437\u043f\u0456\u0434\u0441\u0442\u0430\u0432\u043d\u0435 \u043c\u0430\u0441\u043e\u0432\u0435 \u0437\u0432\u0456\u043b\u044c\u043d\u0435\u043d\u043d\u044f \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0430\u0431\u043e \u0437\u043c\u0456\u043d\u0430 \u0440\u0430\u043d\u0433\u0456\u0432\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.12\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u0432\u043e\u0434\u0438\u0442\u0438 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044e \u0432 \u043e\u043c\u0430\u043d\u0443 (\u043d\u0435\u043f\u0440\u0430\u0432\u0434\u0438\u0432\u0456 \u043f\u043e\u044f\u0441\u043d\u0435\u043d\u043d\u044f, \u043f\u0456\u0434\u0440\u043e\u0431\u043b\u0435\u043d\u0456 \u0434\u043e\u043a\u0430\u0437\u0438, \u043f\u0440\u0438\u0445\u043e\u0432\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u0431\u0441\u0442\u0430\u0432\u0438\u043d).\",\"punishment\":\"\u0411\u0430\u043d 7\u201330 \u0434\u043d\u0456\u0432 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.13\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043f\u0435\u0440\u0435\u0448\u043a\u043e\u0434\u0436\u0430\u0442\u0438 \u0440\u043e\u0431\u043e\u0442\u0456 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u043f\u0456\u0434 \u0447\u0430\u0441 \u0432\u0438\u043a\u043e\u043d\u0430\u043d\u043d\u044f \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u0456\u0432.\",\"punishment\":\"Kick / Jail 10 \u0445\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.14\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0443\u0445\u0438\u043b\u044f\u0442\u0438\u0441\u044f \u0432\u0456\u0434 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f (\u0437\u043c\u0456\u043d\u0430 \u043d\u0456\u043a\u0443, \u043f\u0435\u0440\u0435\u043a\u0430\u0437 \u043c\u0430\u0439\u043d\u0430 \u043d\u0430 \u0456\u043d\u0448\u0456 \u0430\u043a\u0430\u0443\u043d\u0442\u0438 \u0442\u043e\u0449\u043e).\",\"punishment\":\"\u0414\u043e\u0434\u0430\u0442\u043a\u043e\u0432\u0438\u0439 \u0431\u0430\u043d 14\u201330 \u0434\u043d\u0456\u0432 + \u043e\u0441\u043d\u043e\u0432\u043d\u0435 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.15\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0437\u043b\u043e\u0432\u0436\u0438\u0432\u0430\u0442\u0438 \u043f\u0440\u043e\u0433\u0430\u043b\u0438\u043d\u0430\u043c\u0438 \u0443 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\u0445 \u0430\u0431\u043e \u0434\u0456\u044f\u0442\u0438 \u0432\u0441\u0443\u043f\u0435\u0440\u0435\u0447 \u0457\u0445\u043d\u044c\u043e\u043c\u0443 \u0434\u0443\u0445\u0443.\",\"punishment\":\"\u041f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u043d\u0430 \u0440\u043e\u0437\u0441\u0443\u0434 \u043a\u0435\u0440\u0456\u0432\u043d\u0438\u0446\u0442\u0432\u0430\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u043e\u0447\u0435\u0432\u0438\u0434\u043d\u0435 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0431\u0435\u0437 \u043f\u0440\u044f\u043c\u043e\u0433\u043e \u043f\u0443\u043d\u043a\u0442\u0443 \u043a\u0430\u0440\u0430\u0454\u0442\u044c\u0441\u044f \u043d\u0430 \u0440\u043e\u0437\u0441\u0443\u0434 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u0437 \u043f\u043e\u0434\u0430\u043b\u044c\u0448\u043e\u044e \u0444\u0456\u043a\u0441\u0430\u0446\u0456\u0454\u044e.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.16\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043f\u0435\u0440\u0435\u0434\u0430\u0432\u0430\u0442\u0438 \u043a\u043e\u0448\u0442\u0438/\u043c\u0430\u0439\u043d\u043e \u0437\u0430 \u043f\u043e\u0441\u0430\u0434\u0443, \u043f\u0456\u0434\u0432\u0438\u0449\u0435\u043d\u043d\u044f \u0447\u0438 \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f \u0443 \u0444\u0440\u0430\u043a\u0446\u0456\u0457/\u0430\u0434\u043c\u0456\u043d\u0446\u0456.\",\"punishment\":\"\u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0432\u0441\u0456\u0445 \u043f\u0440\u0438\u0447\u0435\u0442\u043d\u0438\u0445 \u0430\u043a\u0430\u0443\u043d\u0442\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.17\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043f\u0435\u0440\u0435\u0431\u0443\u0432\u0430\u0442\u0438 \u0432 AFK \u043d\u0430 \u0434\u043e\u0440\u043e\u0437\u0456, \u0443 \u0441\u043f\u0430\u0432\u043d\u0456 \u0447\u0438 \u043f\u0440\u043e\u0445\u043e\u0434\u0430\u0445, \u044f\u043a\u0449\u043e \u0446\u0435 \u0437\u0430\u0432\u0430\u0436\u0430\u0454 \u0456\u043d\u0448\u0438\u043c.\",\"punishment\":\"Kick\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.18\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0437\u0431\u0438\u0432\u0430\u0442\u0438 \u0456\u0433\u0440\u043e\u0432\u0443 \u0430\u043d\u0456\u043c\u0430\u0446\u0456\u044e (\u0441\u0442\u0440\u0456\u043b\u044c\u0431\u0438, \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u043c\u0430\u0441\u043a\u0438, \u0430\u043f\u0442\u0435\u0447\u043a\u0438, \u0440\u0435\u043c\u043a\u043e\u043c\u043f\u043b\u0435\u043a\u0442\u0443 \u0442\u043e\u0449\u043e).\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438 \u041d\u0430 \u0421\u0435\u0440\u0432\u0435\u0440\u0456\",\"id\":\"3.19\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u0430 \u0431\u0443\u0434\u044c-\u044f\u043a\u0430 \u0437\u043c\u043e\u0432\u0430 \u0437 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e (\u0431\u043b\u0430\u0442) \u0437 \u043c\u0435\u0442\u043e\u044e \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0456\u0433\u0440\u043e\u0432\u0438\u0445 \u0446\u0456\u043d\u043d\u043e\u0441\u0442\u0435\u0439, \u043c\u0430\u0439\u043d\u0430, \u0437\u043c\u0456\u043d\u0438 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043a\u0438 \u0430\u0431\u043e \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u043d\u0435\u0447\u0435\u0441\u043d\u043e\u0457 \u043f\u0435\u0440\u0435\u0432\u0430\u0433\u0438 \u0432 RP-\u043f\u0440\u043e\u0446\u0435\u0441\u0456 (\u0432\u043a\u043b\u044e\u0447\u0430\u044e\u0447\u0438 \u0431\u0435\u0437\u043f\u0456\u0434\u0441\u0442\u0430\u0432\u043d\u0435 \u0442\u0435\u043b\u0435\u043f\u043e\u0440\u0442\u0443\u0432\u0430\u043d\u043d\u044f \u0433\u0440\u0430\u0432\u0446\u044f \u0434\u043e \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432, \u0440\u043e\u0431\u0456\u0442 \u0442\u043e\u0449\u043e). \u0413\u0440\u0430\u0432\u0435\u0446\u044c, \u044f\u043a\u0438\u0439 \u043f\u0440\u0438\u0439\u043d\u044f\u0432 \u0432\u0456\u0434 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0430 \u043c\u0430\u0439\u043d\u043e \u0430\u0431\u043e \u043f\u0440\u0438\u0432\u0456\u043b\u0435\u0457 \u043f\u043e\u0437\u0430 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0438\u043c\u0438 \u0437\u0430\u0445\u043e\u0434\u0430\u043c\u0438 (\u041c\u041f), \u043d\u0435\u0441\u0435 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u0430\u043b\u044c\u043d\u0456\u0441\u0442\u044c \u043d\u0430 \u0440\u0456\u0432\u043d\u0456 \u0437 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u043e\u043c-\u043f\u043e\u0440\u0443\u0448\u043d\u0438\u043a\u043e\u043c.\",\"punishment\":\"\u0411\u0430\u043d 15-30 \u0434\u043d\u0456\u0432 / \u041f\u0435\u0440\u043c\u0430\u043d\u0435\u043d\u0442\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f / \u041e\u0431\u043d\u0443\u043b\u0435\u043d\u043d\u044f \u043c\u0430\u0439\u043d\u0430 / \u0427\u043e\u0440\u043d\u0438\u0439 \u0441\u043f\u0438\u0441\u043e\u043a \u043f\u0440\u043e\u0454\u043a\u0442\u0443.]\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.1\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043e\u0431\u0440\u0430\u0436\u0430\u0442\u0438, \u043f\u0440\u0438\u043d\u0438\u0436\u0443\u0432\u0430\u0442\u0438 \u0430\u0431\u043e \u0446\u044c\u043a\u0443\u0432\u0430\u0442\u0438 (\u0431\u0443\u043b\u0438\u0442\u0438) \u0456\u043d\u0448\u0438\u0445 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u043f\u043e\u0437\u0430 RolePlay \u043f\u0440\u043e\u0446\u0435\u0441\u043e\u043c (OOC).\",\"punishment\":\"\u0411\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0447\u0430\u0442\u0443 (Mute) 30\u2013120 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\u0412\u0438\u043d\u044f\u0442\u043e\u043a: \u0440\u043e\u043b\u044c\u043e\u0432\u0456 \u0441\u0438\u0442\u0443\u0430\u0446\u0456\u0457, \u0434\u0435 \u043f\u043e\u0434\u0456\u0431\u043d\u0435 \u0441\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0454 \u0447\u0430\u0441\u0442\u0438\u043d\u043e\u044e \u0432\u0456\u0434\u0456\u0433\u0440\u0430\u0432\u0430\u043d\u043d\u044f \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436\u0430 \u0442\u0430 \u043d\u0435 \u0441\u043f\u0440\u044f\u043c\u043e\u0432\u0430\u043d\u0435 \u043d\u0430 \u0440\u0435\u0430\u043b\u044c\u043d\u0443 \u043e\u0431\u0440\u0430\u0437\u0443 \u0433\u0440\u0430\u0432\u0446\u044f.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.2\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043d\u0430\u0434\u043c\u0456\u0440\u043d\u0435 \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u043d\u0435\u0446\u0435\u043d\u0437\u0443\u0440\u043d\u043e\u0457 \u043b\u0435\u043a\u0441\u0438\u043a\u0438 \u0443 \u043d\u0435 \u0456\u0433\u0440\u043e\u0432\u0438\u0445 \u0447\u0430\u0442\u0430\u0445 (VIP, \u0447\u0430\u0442\u0438 \u0440\u043e\u0431\u0456\u0442, OOC \u0447\u0430\u0442).\",\"punishment\":\"\u0411\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0447\u0430\u0442\u0443 (Mute) 10 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u0432 \u0456\u0433\u0440\u043e\u0432\u043e\u043c\u0443 \u0447\u0430\u0442\u0456 (IC) \u043b\u0430\u0439\u043a\u0430 \u0434\u043e\u0437\u0432\u043e\u043b\u0435\u043d\u0430 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u044f\u043a \u0447\u0430\u0441\u0442\u0438\u043d\u0430 \u0432\u0456\u0434\u0456\u0433\u0440\u043e\u0432\u043a\u0438 \u0432\u0430\u0448\u043e\u0433\u043e \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436\u0430, \u0430\u043b\u0435 \u0431\u0435\u0437 \u0437\u043b\u043e\u0432\u0436\u0438\u0432\u0430\u043d\u043d\u044f \u0442\u0430 \u0430\u0434\u0440\u0435\u0441\u043d\u0438\u0445 \u043e\u0431\u0440\u0430\u0437 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0433\u0440\u0430\u0432\u0446\u044f.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.3\",\"text\":\"\u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0447\u043d\u043e \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043e\u0431\u0440\u0430\u0436\u0430\u0442\u0438 \u0431\u0430\u0442\u044c\u043a\u0456\u0432, \u0440\u0456\u0434\u043d\u0438\u0445 \u0442\u0430 \u0431\u043b\u0438\u0437\u044c\u043a\u0438\u0445 \u0456\u043d\u0448\u043e\u0433\u043e \u0433\u0440\u0430\u0432\u0446\u044f \u0443 \u0431\u0443\u0434\u044c- \u044f\u043a\u043e\u043c\u0443 \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u0456.\",\"punishment\":\"\u0411\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u0431\u043b\u0456\u043a\u043e\u0432\u043e\u0433\u043e \u0437\u0430\u043f\u0438\u0441\u0443 (Ban) \u043d\u0430 7\u201314 \u0434\u043d\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.4\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0437\u0433\u0430\u0434\u0443\u0432\u0430\u0442\u0438 \u0431\u0430\u0442\u044c\u043a\u0456\u0432, \u0440\u0456\u0434\u043d\u0438\u0445 \u0442\u0430 \u0431\u043b\u0438\u0437\u044c\u043a\u0438\u0445 \u0456\u043d\u0448\u043e\u0433\u043e \u0433\u0440\u0430\u0432\u0446\u044f \u0443 \u0436\u0430\u0440\u0442\u0456\u0432\u043b\u0438\u0432\u043e\u043c\u0443, \u043e\u0431\u0440\u0430\u0437\u043b\u0438\u0432\u043e\u043c\u0443 \u043a\u043e\u043d\u0442\u0435\u043a\u0441\u0442\u0456 (\u043d\u0435\u0434\u043e\u0440\u0435\u0447\u043d\u0456 \u043f\u0438\u0442\u0430\u043d\u043d\u044f, \u0437\u0430\u0432\u0443\u0430\u043b\u044c\u043e\u0432\u0430\u043d\u0456 \u043d\u0430\u0442\u044f\u043a\u0438, \u0436\u0430\u0440\u0442\u0438 \u0430\u0431\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0444\u0440\u0430\u0437-\u043a\u043b\u0456\u0448\u0435).\",\"punishment\":\"\u0411\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0447\u0430\u0442\u0443 (Mute) 120 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.5\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u0456 \u0431\u0443\u0434\u044c-\u044f\u043a\u0456 \u043f\u0440\u043e\u044f\u0432\u0438 \u0434\u0438\u0441\u043a\u0440\u0438\u043c\u0456\u043d\u0430\u0446\u0456\u0457, \u0440\u0430\u0441\u0438\u0437\u043c\u0443, \u043d\u0430\u0446\u0438\u0437\u043c\u0443 \u0430\u0431\u043e \u0441\u0435\u043a\u0441\u0438\u0437\u043c\u0443.\",\"punishment\":\"\u0411\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0447\u0430\u0442\u0443 (Mute) 120 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.6\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0456\u0433\u0440\u043e\u0432\u0456 \u0430\u043d\u0456\u043c\u0430\u0446\u0456\u0457 \u0442\u0430 RolePlay \u043a\u043e\u043c\u0430\u043d\u0434\u0438 (/me, /do, /todo) \u0434\u043b\u044f \u0441\u0435\u043a\u0441\u0443\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0447\u0438 \u043c\u043e\u0440\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u043f\u0440\u0438\u043d\u0438\u0436\u0435\u043d\u043d\u044f \u0456\u043d\u0448\u043e\u0433\u043e \u0433\u0440\u0430\u0432\u0446\u044f.\",\"punishment\":\"Jail 60\u2013120 \u0445\u0432\u0438\u043b\u0438\u043d / \u0411\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0447\u0430\u0442\u0443 (Mute) 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.7\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043e\u0431\u0440\u0430\u0436\u0430\u0442\u0438 \u0430\u0431\u043e \u0434\u0438\u0441\u043a\u0440\u0435\u0434\u0438\u0442\u0443\u0432\u0430\u0442\u0438 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0456\u0432, \u0430 \u0442\u0430\u043a\u043e\u0436 \u043f\u043e\u0433\u0440\u043e\u0436\u0443\u0432\u0430\u0442\u0438 \u0457\u043c \u0441\u043a\u0430\u0440\u0433\u0430\u043c\u0438 \u0447\u0438 \u0437\u043d\u044f\u0442\u0442\u044f\u043c \u0437 \u043c\u0435\u0442\u043e\u044e \u0442\u0438\u0441\u043a\u0443.\",\"punishment\":\"\u0411\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0447\u0430\u0442\u0443 (Mute) 60\u2013120 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u044f\u043a\u0449\u043e \u0433\u0440\u0430\u0432\u0435\u0446\u044c \u0432\u0432\u0430\u0436\u0430\u0454 \u0434\u0456\u0457 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0430 \u043d\u0435\u043f\u0440\u0430\u0432\u043e\u043c\u0456\u0440\u043d\u0438\u043c\u0438 \u2014 \u0432\u0456\u043d \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u043f\u043e\u0434\u0430\u0442\u0438 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0443 \u0441\u043a\u0430\u0440\u0433\u0443. \u041f\u043e\u0433\u0440\u043e\u0437\u0438 \u0442\u0430 \u043f\u0443\u0431\u043b\u0456\u0447\u043d\u0438\u0439 \u0442\u0438\u0441\u043a \u043d\u0435 \u0454 \u043f\u0440\u0438\u0439\u043d\u044f\u0442\u043d\u043e\u044e \u0430\u043b\u044c\u0442\u0435\u0440\u043d\u0430\u0442\u0438\u0432\u043e\u044e.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.8\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0444\u043b\u0443\u0434 \u2014 \u043d\u0430\u0434\u0441\u0438\u043b\u0430\u043d\u043d\u044f \u043e\u0434\u043d\u0430\u043a\u043e\u0432\u0438\u0445 \u0430\u0431\u043e \u0431\u0435\u0437\u0437\u043c\u0456\u0441\u0442\u043e\u0432\u043d\u0438\u0445 \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u0435\u043d\u044c, \u043d\u0430\u0434\u043c\u0456\u0440\u043d\u0430 \u043a\u0456\u043b\u044c\u043a\u0456\u0441\u0442\u044c \u0441\u0438\u043c\u0432\u043e\u043b\u0456\u0432 \u043f\u0456\u0434\u0440\u044f\u0434, \u0430 \u0442\u0430\u043a\u043e\u0436 \u043f\u043e\u0432\u0442\u043e\u0440\u0435\u043d\u043d\u044f \u043e\u0434\u043d\u043e\u0433\u043e \u0439 \u0442\u043e\u0433\u043e \u0441\u0430\u043c\u043e\u0433\u043e \u0442\u0435\u043a\u0441\u0442\u0443 \u0431\u0456\u043b\u044c\u0448\u0435 \u0434\u0432\u043e\u0445 \u0440\u0430\u0437\u0456\u0432.\",\"punishment\":\"\u041c\u0443\u0442 10 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.9\",\"text\":\"\u0417\u041f\u041f 4.9 \u043a\u0430\u0440\u0430\u0454\u0442\u044c\u0441\u044f \u043b\u0438\u0448\u0435 \u0437\u043b\u043e\u0432\u0436\u0438\u0432\u0430\u043d\u043d\u044f: \u043d\u0430\u043f\u0438\u0441\u0430\u043d\u043d\u044f \u0432\u0441\u044c\u043e\u0433\u043e \u043f\u043e\u0432\u0456\u0434\u043e\u043c\u043b\u0435\u043d\u043d\u044f \u0430\u0431\u043e \u0431\u0456\u043b\u044c\u0448\u0435 \u0434\u0432\u043e\u0445 \u0441\u043b\u0456\u0432 \u0443 \u0440\u0435\u0447\u0435\u043d\u043d\u0456 \u0432\u0435\u043b\u0438\u043a\u0438\u043c\u0438 \u043b\u0456\u0442\u0435\u0440\u0430\u043c\u0438. \u0410\u0431\u0440\u0435\u0432\u0456\u0430\u0442\u0443\u0440\u0438 (\u0417\u0421\u0423, \u0421\u0422\u041e \u0442\u043e\u0449\u043e) \u0434\u043e\u0437\u0432\u043e\u043b\u0435\u043d\u0456.\",\"punishment\":\"\u041c\u0443\u0442 10 \u0445\u0432.\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.10\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u043c\u0438\u043a\u0430\u0442\u0438 \u043c\u0443\u0437\u0438\u043a\u0443, \u043f\u0456\u0441\u043d\u0456 \u0430\u0431\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u043f\u0440\u043e\u0433\u0440\u0430\u043c\u0438 \u0434\u043b\u044f \u0437\u043c\u0456\u043d\u0438 \u0433\u043e\u043b\u043e\u0441\u0443 \u0443 \u0433\u043e\u043b\u043e\u0441\u043e\u0432\u043e\u043c\u0443 \u0447\u0430\u0442\u0456 \u0431\u0435\u0437 \u0437\u0433\u043e\u0434\u0438 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432 \u043f\u043e\u0442\u043e\u0447\u043d\u043e\u0457 RP-\u0441\u0438\u0442\u0443\u0430\u0446\u0456\u0457.\",\"punishment\":\"\u041c\u0443\u0442 15 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.11\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043f\u043e\u0448\u0438\u0440\u044e\u0432\u0430\u0442\u0438 \u0432 \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u043c\u0443 \u0447\u0430\u0442\u0456 \u0440\u0435\u043a\u043b\u0430\u043c\u0443 \u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0456\u0445 \u0440\u0435\u0441\u0443\u0440\u0441\u0456\u0432 \u2014 \u0441\u0435\u0440\u0432\u0435\u0440\u0456\u0432, \u0441\u0430\u0439\u0442\u0456\u0432, \u0441\u043e\u0446\u0456\u0430\u043b\u044c\u043d\u0438\u0445 \u043c\u0435\u0440\u0435\u0436, \u043a\u0430\u043d\u0430\u043b\u0456\u0432 \u0442\u043e\u0449\u043e.\",\"punishment\":\"\u041c\u0443\u0442 60 \u0445\u0432\u0438\u043b\u0438\u043d / \u0411\u0430\u043d 7\u201330 \u0434\u043d\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.12\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u044e\u0442\u044c\u0441\u044f \u0432\u0438\u0441\u043b\u043e\u0432\u043b\u044e\u0432\u0430\u043d\u043d\u044f, \u0449\u043e \u0440\u043e\u0437\u043f\u0430\u043b\u044e\u044e\u0442\u044c \u043c\u0456\u0436\u043d\u0430\u0446\u0456\u043e\u043d\u0430\u043b\u044c\u043d\u0443 \u0430\u0431\u043e \u0440\u0435\u043b\u0456\u0433\u0456\u0439\u043d\u0443 \u0432\u043e\u0440\u043e\u0436\u043d\u0435\u0447\u0443, \u0430 \u0442\u0430\u043a\u043e\u0436 \u043f\u0440\u043e\u044f\u0432\u0438 \u043d\u0430\u0446\u0438\u0437\u043c\u0443, \u0440\u0430\u0441\u0438\u0437\u043c\u0443 \u0430\u0431\u043e \u043f\u043e\u043b\u0456\u0442\u0438\u0447\u043d\u0438\u0445 \u043f\u0440\u043e\u0432\u043e\u043a\u0430\u0446\u0456\u0439 \u0443 \u0431\u0443\u0434\u044c-\u044f\u043a\u0456\u0439 \u0444\u043e\u0440\u043c\u0456.\",\"punishment\":\"\u041c\u0443\u0442 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u043e\u0431\u0433\u043e\u0432\u043e\u0440\u0435\u043d\u043d\u044f \u043f\u043e\u0434\u0456\u0439, \u043f\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0445 \u0456\u0437 \u0440\u043e\u0441\u0456\u0439\u0441\u044c\u043a\u043e\u044e \u0430\u0433\u0440\u0435\u0441\u0456\u0454\u044e \u043f\u0440\u043e\u0442\u0438 \u0423\u043a\u0440\u0430\u0457\u043d\u0438, \u043d\u0435 \u043f\u0456\u0434\u043f\u0430\u0434\u0430\u0454 \u043f\u0456\u0434 \u0434\u0456\u044e \u0446\u044c\u043e\u0433\u043e \u043f\u0443\u043d\u043a\u0442\u0443.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.13\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043e\u0431\u0433\u043e\u0432\u043e\u0440\u044e\u0432\u0430\u0442\u0438 \u0430\u0431\u043e \u043f\u0443\u0431\u043b\u0456\u0447\u043d\u043e \u043a\u0440\u0438\u0442\u0438\u043a\u0443\u0432\u0430\u0442\u0438 \u0440\u0456\u0448\u0435\u043d\u043d\u044f \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u0443 \u0431\u0443\u0434\u044c- \u044f\u043a\u043e\u043c\u0443 \u0447\u0430\u0442\u0456. \u0414\u043b\u044f \u0446\u044c\u043e\u0433\u043e \u0456\u0441\u043d\u0443\u0454 \u043e\u0444\u0456\u0446\u0456\u0439\u043d\u0438\u0439 \u0440\u043e\u0437\u0434\u0456\u043b \u0441\u043a\u0430\u0440\u0433 \u0442\u0430 \u0430\u043f\u0435\u043b\u044f\u0446\u0456\u0439.\",\"punishment\":\"\u041c\u0443\u0442 30 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.14\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043f\u043e\u0433\u0440\u043e\u0436\u0443\u0432\u0430\u0442\u0438 \u0456\u043d\u0448\u0438\u043c \u0433\u0440\u0430\u0432\u0446\u044f\u043c \u0430\u0431\u043e \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u0443 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u043c\u0443 \u0436\u0438\u0442\u0442\u0456 \u2014 \u043d\u0435\u0437\u0430\u043b\u0435\u0436\u043d\u043e \u0432\u0456\u0434 \u0442\u043e\u0433\u043e, \u0432 \u044f\u043a\u043e\u043c\u0443 \u0447\u0430\u0442\u0456 \u0446\u0435 \u0432\u0456\u0434\u0431\u0443\u0432\u0430\u0454\u0442\u044c\u0441\u044f.\",\"punishment\":\"\u041c\u0443\u0442 60\u2013120 \u0445\u0432\u0438\u043b\u0438\u043d / \u0411\u0430\u043d 3\u20137 \u0434\u043d\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.15\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u0434\u0430\u0432\u0430\u0442\u0438 \u0441\u0435\u0431\u0435 \u0437\u0430 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0430 \u0430\u0431\u043e \u0447\u043b\u0435\u043d\u0430 \u043a\u043e\u043c\u0430\u043d\u0434\u0438 \u043f\u0440\u043e\u0454\u043a\u0442\u0443 \u0443 \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u043c\u0443 \u0447\u0430\u0442\u0456.\",\"punishment\":\"\u041c\u0443\u0442 120 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.16\",\"text\":\"\u041a\u043e\u043c\u0430\u043d\u0434\u0438 /me, /do, /try \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u0456 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0434\u043b\u044f \u0432\u0456\u0434\u0456\u0433\u0440\u0430\u0432\u0430\u043d\u043d\u044f \u0434\u0456\u0439 \u0442\u0430 \u043e\u043f\u0438\u0441\u0456\u0432 \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436\u0430. \u0407\u0445 \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u043d\u0435 \u0437\u0430 \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u043d\u044f\u043c, \u0443 \u0433\u043b\u0443\u0437\u043b\u0438\u0432\u0456\u0439 \u0430\u0431\u043e \u043f\u0440\u043e\u0432\u043e\u043a\u0430\u0446\u0456\u0439\u043d\u0456\u0439 \u0444\u043e\u0440\u043c\u0456 \u2014 \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u0435.\",\"punishment\":\"\u041c\u0443\u0442 5\u201320 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.17\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e MG (Metagaming) \u2014 \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0456\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0456\u0457 \u0437 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0436\u0438\u0442\u0442\u044f (OOC) \u0432 \u0456\u0433\u0440\u043e\u0432\u043e\u043c\u0443 \u0441\u0432\u0456\u0442\u0456 (IC).\",\"punishment\":\"\u041c\u0443\u0442 20 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\u041f\u0440\u0438\u043a\u043b\u0430\u0434: \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0432 \u0456\u0433\u0440\u043e\u0432\u043e\u043c\u0443 \u0447\u0430\u0442\u0456 \u0441\u043b\u0456\u0432 \u0456\u0437 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u0436\u0438\u0442\u0442\u044f \u0430\u0431\u043e \u0456\u0433\u0440\u043e\u0432\u043e\u0433\u043e \u0441\u043b\u0435\u043d\u0433\u0443: \\\"\u0430\u0434\u043c\u0456\u043d\\\", \\\"\u043f\u0456\u043d\u0433\\\", \\\"Discord\\\", \\\"\u0437\u0430\u043b\u0430\u0433\u0430\u043b\u043e\\\", \\\"\u043a\u0440\u0430\u0448\u043d\u0443\u043b\u043e\\\", \\\"\u0442\u043f \u0441\u044e\u0434\u0438\\\". \u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u0434\u043b\u044f \u0441\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u043d\u0430 \u043d\u0435\u0456\u0433\u0440\u043e\u0432\u0456 \u0442\u0435\u043c\u0438 \u0456\u0441\u043d\u0443\u0454 \u0441\u043f\u0435\u0446\u0456\u0430\u043b\u044c\u043d\u0438\u0439 \u041d\u043e\u043d\u0420\u041f (OOC) \u0447\u0430\u0442, \u043d\u0430 \u044f\u043a\u0438\u0439 \u043c\u043e\u0436\u043d\u0430 \u043f\u0435\u0440\u0435\u043a\u043b\u044e\u0447\u0438\u0442\u0438\u0441\u044c \u0443 \u043f\u0435\u0440\u0435\u043b\u0456\u043a\u0443 \u0447\u0430\u0442\u0456\u0432.\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.18\",\"text\":\"\u0420\u043e\u043b\u044c\u043e\u0432\u0456 \u0434\u0456\u0457 /me \u0442\u0430 /do \u043c\u043e\u0436\u0443\u0442\u044c \u0432\u0456\u0434\u0442\u0432\u043e\u0440\u044e\u0432\u0430\u0442\u0438\u0441\u044f \u0433\u043e\u043b\u043e\u0441\u043e\u043c \u0443 \u0433\u043e\u043b\u043e\u0441\u043e\u0432\u043e\u043c\u0443 \u0447\u0430\u0442\u0456 \u0437\u0430 \u0443\u043c\u043e\u0432\u0438, \u0449\u043e \u0432\u043e\u043d\u0438 \u0447\u0456\u0442\u043a\u0456 \u0442\u0430 \u0437\u0440\u043e\u0437\u0443\u043c\u0456\u043b\u0456. \u042f\u043a\u0449\u043e \u0445\u043e\u0447\u0430 \u0431 \u043e\u0434\u0438\u043d \u0443\u0447\u0430\u0441\u043d\u0438\u043a \u0441\u0438\u0442\u0443\u0430\u0446\u0456\u0457 \u043d\u0435 \u0447\u0443\u0454 \u0433\u043e\u043b\u043e\u0441\u043e\u0432\u0438\u0439 \u0447\u0430\u0442 \u2014 \u0434\u0456\u044f \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u043e \u0434\u0443\u0431\u043b\u044e\u0454\u0442\u044c\u0441\u044f \u0443 \u0442\u0435\u043a\u0441\u0442\u043e\u0432\u0438\u0439 \u0447\u0430\u0442.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.19\",\"text\":\"\u0427\u0430\u0442\u0438 \u0444\u0440\u0430\u043a\u0446\u0456\u0439 \u0442\u0430 \u0440\u043e\u0431\u043e\u0447\u0456 \u0447\u0430\u0442\u0438 \u043f\u0440\u0438\u0437\u043d\u0430\u0447\u0435\u043d\u0456 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0434\u043b\u044f \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u044c\u043e\u0444\u0440\u0430\u043a\u0446\u0456\u0439\u043d\u043e\u0433\u043e \u0441\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0442\u0430 \u043a\u043e\u043e\u0440\u0434\u0438\u043d\u0430\u0446\u0456\u0457. \u041a\u0443\u043f\u0456\u0432\u043b\u044f, \u043f\u0440\u043e\u0434\u0430\u0436 \u0430\u0431\u043e \u043e\u0431\u043c\u0456\u043d \u043c\u0430\u0439\u043d\u043e\u043c \u0443 \u0446\u0438\u0445 \u0447\u0430\u0442\u0430\u0445 \u2014 \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u0456.\",\"punishment\":\"\u041c\u0443\u0442 10 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.20\",\"text\":\"VIP-\u0447\u0430\u0442 \u0442\u0430 \u0447\u0430\u0442\u0438 \u043f\u043e\u0447\u0430\u0442\u043a\u043e\u0432\u0438\u0445 \u0442\u0430 \u043e\u0441\u043d\u043e\u0432\u043d\u0438\u0445 \u0440\u043e\u0431\u0456\u0442 \u0437\u0430 \u0437\u0430\u043c\u043e\u0432\u0447\u0443\u0432\u0430\u043d\u043d\u044f\u043c \u0454 OOC-\u043f\u0440\u043e\u0441\u0442\u043e\u0440\u043e\u043c \u0456 \u043d\u0435 \u043f\u0456\u0434\u043f\u0430\u0434\u0430\u044e\u0442\u044c \u043f\u0456\u0434 \u0432\u0438\u043c\u043e\u0433\u0438 IC-\u0441\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0421\u043f\u0456\u043b\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0422\u0430 \u0427\u0430\u0442\u0456\u0432\",\"id\":\"4.21\",\"text\":\"\u0411\u0443\u0434\u044c-\u044f\u043a\u0456 \u043f\u0443\u0431\u043b\u0456\u0447\u043d\u0456 \u043e\u0431\u0440\u0430\u0437\u0438 \u043f\u0440\u043e\u0435\u043a\u0442\u0443, \u0440\u043e\u0437\u043f\u043e\u0432\u0441\u044e\u0434\u0436\u0435\u043d\u043d\u044f \u043d\u0435\u043f\u0440\u0430\u0432\u0434\u0438\u0432\u043e\u0457 \u0456\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0456\u0457, \u0442\u043e\u043a\u0441\u0438\u0447\u043d\u0430 \u0430\u0431\u043e \u043d\u0435\u043a\u043e\u043d\u0441\u0442\u0440\u0443\u043a\u0442\u0438\u0432\u043d\u0430 \u043a\u0440\u0438\u0442\u0438\u043a\u0430 \u0440\u043e\u0431\u043e\u0442\u0438 \u0440\u043e\u0437\u0440\u043e\u0431\u043d\u0438\u043a\u0456\u0432 \u0442\u0430 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u2014 \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0447\u043d\u043e \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u0456.\",\"punishment\":\"\u041c\u0443\u0442 60-120 \u0445\u0432\u0438\u043b\u0438\u043d / \u0411\u0430\u043d 3-30 \u0434\u043d\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.1\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e \u0443\u043d\u0438\u043a\u0430\u0442\u0438 \u0440\u043e\u043b\u044c\u043e\u0432\u0438\u0445 \u0441\u0438\u0442\u0443\u0430\u0446\u0456\u0439, \u0456\u0433\u043d\u043e\u0440\u0443\u0432\u0430\u0442\u0438 \u0432\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u044e \u0437 \u0456\u043d\u0448\u0438\u043c\u0438 \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436\u0430\u043c\u0438 \u0430\u0431\u043e \u0432\u0438\u0445\u043e\u0434\u0438\u0442\u0438 \u0437 RP \u0431\u0435\u0437 \u043e\u0431\u0491\u0440\u0443\u043d\u0442\u043e\u0432\u0430\u043d\u043e\u0457 \u043f\u0440\u0438\u0447\u0438\u043d\u0438.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041e\u0441\u043d\u043e\u0432\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 Role Play \u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0438\",\"id\":\"5.2\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u0445\u043e\u0434\u0438\u0442\u0438 \u0437 \u0433\u0440\u0438 \u043f\u0456\u0434 \u0447\u0430\u0441 \u0430\u043a
