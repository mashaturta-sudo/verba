430\u0454 \u043f\u0440\u0430\u0432\u043e \u043d\u0430 \u0441\u0438\u043b\u043e\u0432\u0438\u0439 \u0437\u0430\u0445\u0438\u0441\u0442 \u0441\u0432\u043e\u0454\u0457 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0457 \u0442\u0430 \u043c\u0430\u0439\u043d\u0430 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0443 \u0432\u0438\u043f\u0430\u0434\u043a\u0443 \u0440\u0435\u0430\u043b\u044c\u043d\u043e\u0457 \u0437\u0430\u0433\u0440\u043e\u0437\u0438: \u043d\u0435\u0437\u0430\u043a\u043e\u043d\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u043d\u0438\u043a\u043d\u0435\u043d\u043d\u044f \u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0456\u0445 \u043e\u0441\u0456\u0431 (\u043d\u0435 \u0447\u043b\u0435\u043d\u0456\u0432 \u0441\u0456\u043c'\u0457), \u0446\u0456\u043b\u0435\u0441\u043f\u0440\u044f\u043c\u043e\u0432\u0430\u043d\u0438\u0445 \u043f\u0440\u043e\u0432\u043e\u043a\u0430\u0446\u0456\u0439 \u0430\u0431\u043e \u0432\u0442\u0440\u0443\u0447\u0430\u043d\u043d\u044f \u0443 \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u0456 \u043f\u0440\u043e\u0446\u0435\u0441\u0438 \u0441\u0456\u043c'\u0457 \u043d\u0430 \u0457\u0457 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0457.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d \u0437\u0430 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043f\u0440\u043e\u0446\u0435\u0434\u0443\u0440\u0438 \u0437\u0430\u0445\u0438\u0441\u0442\u0443 (\u044f\u043a \u0437\u0430 DM) Jail 60-120 \u0445\u0432\u0438\u043b\u0438\u043d \u0434\u043b\u044f \u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0456\u0445 \u043e\u0441\u0456\u0431 \u0437\u0430 \u0441\u0442\u0440\u0456\u043b\u044f\u043d\u0438\u043d\u0443 \u0443 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u044c (SK)\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 3.3.: \u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0447\u043d\u043e \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u0456\u0434\u043a\u0440\u0438\u0432\u0430\u0442\u0438 \u0432\u043e\u0433\u043e\u043d\u044c \u043e\u0434\u0440\u0430\u0437\u0443. \u0421\u0456\u043c'\u044f \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0430 \u0432\u0438\u0441\u0443\u043d\u0443\u0442\u0438 \u0447\u0456\u0442\u043a\u0443 IC-\u0432\u0438\u043c\u043e\u0433\u0443 \u043f\u043e\u043a\u0438\u043d\u0443\u0442\u0438 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u044e (\u0443 \u0433\u043e\u043b\u043e\u0441\u043e\u0432\u0438\u0439 \u0430\u0431\u043e \u0442\u0435\u043a\u0441\u0442\u043e\u0432\u0438\u0439 \u0447\u0430\u0442) \u0442\u0430 \u043d\u0430\u0434\u0430\u0442\u0438 \u043f\u043e\u0440\u0443\u0448\u043d\u0438\u043a\u0443 \u0447\u0430\u0441 \u043d\u0430 \u0457\u0457 \u0432\u0438\u043a\u043e\u043d\u0430\u043d\u043d\u044f. \u0426\u0435\u0439 \u043f\u0440\u043e\u0446\u0435\u0441 \u043c\u0430\u0454 \u0431\u0443\u0442\u0438 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u043e \u0437\u0430\u0444\u0456\u043a\u0441\u043e\u0432\u0430\u043d\u0438\u0439 (\u0432\u0456\u0434\u0435\u043e \u0430\u0431\u043e \u0447\u0456\u0442\u043a\u0438\u0439 \u0441\u043a\u0440\u0456\u043d\u0448\u043e\u0442). \u042f\u043a\u0449\u043e \u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0456 \u043e\u0441\u043e\u0431\u0438 \u0456\u0433\u043d\u043e\u0440\u0443\u044e\u0442\u044c \u0432\u0438\u043c\u043e\u0433\u0443 \u0430\u0431\u043e \u0432\u0456\u0434\u043a\u0440\u0438\u0432\u0430\u044e\u0442\u044c \u0432\u043e\u0433\u043e\u043d\u044c \u0443 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u044c \u043d\u0430 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0457 \u0440\u0435\u0437\u0438\u0434\u0435\u043d\u0446\u0456\u0457, \u0457\u0445\u043d\u0456 \u0434\u0456\u0457 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u043d\u043e \u043f\u0440\u0438\u0440\u0456\u0432\u043d\u044e\u044e\u0442\u044c\u0441\u044f \u0434\u043e Spawn Kill (SK).\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432\",\"id\":\"3.3.1\",\"text\":\"\\\"\u0422\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0454\u044e \u0441\u0456\u043c'\u0457\\\" \u0432\u0432\u0430\u0436\u0430\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u0456\u0439 \u0434\u0432\u0456\u0440 \u0431\u0443\u0434\u0438\u043d\u043a\u0443 (\u0440\u0435\u0437\u0438\u0434\u0435\u043d\u0446\u0456\u0457), \u0449\u043e \u0437\u043d\u0430\u0445\u043e\u0434\u0438\u0442\u044c\u0441\u044f \u0432 \u043c\u0435\u0436\u0430\u0445 \u0441\u0438\u0441\u0442\u0435\u043c\u043d\u043e\u0433\u043e \u043f\u0430\u0440\u043a\u0430\u043d\u0443, \u043e\u0433\u043e\u0440\u043e\u0436\u0456 \u0430\u0431\u043e \u0441\u0442\u0456\u043d \u0431\u0443\u0434\u0456\u0432\u043b\u0456. \u041f\u0440\u043e\u0457\u0436\u0434\u0436\u0430 \u0447\u0430\u0441\u0442\u0438\u043d\u0430, \u0433\u0440\u043e\u043c\u0430\u0434\u0441\u044c\u043a\u0456 \u0442\u0440\u043e\u0442\u0443\u0430\u0440\u0438 \u0442\u0430 \u043f\u0440\u0438\u043b\u0435\u0433\u043b\u0456 \u0434\u043e\u0440\u043e\u0433\u0438 \u0437\u0430\u0433\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u043a\u043e\u0440\u0438\u0441\u0442\u0443\u0432\u0430\u043d\u043d\u044f \u043f\u043e\u0440\u0443\u0447 \u0456\u0437 \u0431\u0443\u0434\u0438\u043d\u043a\u043e\u043c \u041d\u0415 \u0454 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0454\u044e \u0441\u0456\u043c'\u0457. \u0411\u0443\u0434\u044c-\u044f\u043a\u0430 \u0430\u0433\u0440\u0435\u0441\u0456\u044f \u0437\u0430 \u043c\u0435\u0436\u0430\u043c\u0438 \u043e\u0433\u043e\u0440\u043e\u0436\u0456 \u0440\u043e\u0437\u0446\u0456\u043d\u044e\u0454\u0442\u044c\u0441\u044f \u044f\u043a DM.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432\",\"id\":\"3.4\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e \u043f\u0440\u043e\u0432\u043e\u043a\u0443\u0432\u0430\u0442\u0438 \u0456\u043d\u0448\u0456 \u0441\u0456\u043c'\u0457 \u043d\u0430 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043f\u0440\u0430\u0432\u0438\u043b (\u043d\u0430\u043f\u0440\u0438\u043a\u043b\u0430\u0434: \u0441\u0442\u0440\u0456\u043b\u044f\u0442\u0438 \u043f\u043e \u0433\u0440\u0430\u0432\u0446\u044f\u0445 \u0456 \u0432\u0442\u0456\u043a\u0430\u0442\u0438 \u0432 \u0417\u0435\u043b\u0435\u043d\u0443 \u0417\u043e\u043d\u0443, \u0430\u0431\u043e \u0431\u0430\u0439\u0442\u0438\u0442\u0438 \u043d\u0430 \u0441\u0435\u0431\u0435 \u0432\u043e\u0433\u043e\u043d\u044c \u0431\u0456\u043b\u044f \u0432\u0445\u043e\u0434\u0443 \u0432 \u0447\u0443\u0436\u0438\u0439 \u0431\u0443\u0434\u0438\u043d\u043e\u043a \u0434\u043b\u044f \u043f\u043e\u0434\u0430\u0447\u0456 \u0441\u043a\u0430\u0440\u0433\u0438).\",\"punishment\":\"Jail 60-90 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432\",\"id\":\"3.5\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0441\u0456\u043c\u0435\u0439\u043d\u0438\u0439 \u0447\u0438 \u043e\u0441\u043e\u0431\u0438\u0441\u0442\u0438\u0439 \u0430\u0432\u0442\u043e\u043f\u0430\u0440\u043a, \u0430 \u0442\u0430\u043a\u043e\u0436 \u0440\u043e\u0437\u0441\u0442\u0430\u0432\u043b\u044f\u0442\u0438 \u043e\u0431'\u0454\u043a\u0442\u0438 \u0434\u043b\u044f \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0432\u0445\u043e\u0434\u0456\u0432/\u0432\u0438\u0445\u043e\u0434\u0456\u0432 (\u0447\u0435\u043a\u043f\u043e\u0456\u043d\u0442\u0456\u0432) \u0434\u043e \u0431\u0443\u0434\u0438\u043d\u043a\u0456\u0432 \u043a\u043e\u043d\u043a\u0443\u0440\u0435\u043d\u0442\u0456\u0432 \u0430\u0431\u043e NPC-\u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436\u0456\u0432.\",\"punishment\":\"\u0421\u043f\u0430\u0432\u043d \u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442\u0443 + Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d + \u0434\u043e\u0433\u0430\u043d\u0430 \u0441\u0456\u043c'\u0457 \u0443 \u0440\u0430\u0437\u0456 \u043d\u0435\u043e\u0434\u043d\u043e\u0440\u0430\u0437\u043e\u0432\u0438\u0445 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u044c\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432\",\"id\":\"3.6\",\"text\":\"\u041f\u0456\u0434 \u0447\u0430\u0441 \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u0457 \u0432\u0437\u0430\u0454\u043c\u043e\u0434\u0456\u0457 (\u043d\u0430\u0432\u0456\u0442\u044c \u0432\u043e\u0440\u043e\u0436\u043e\u0457) \u043a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0447\u043d\u043e \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u0430 \u043d\u0430\u0434\u043c\u0456\u0440\u043d\u0430 \u0442\u043e\u043a\u0441\u0438\u0447\u043d\u0456\u0441\u0442\u044c: \u043f\u0435\u0440\u0435\u0445\u0456\u0434 \u043d\u0430 \u043e\u0441\u043e\u0431\u0438\u0441\u0442\u043e\u0441\u0442\u0456 \u0432 OOC, \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u043f\u0440\u0438\u043d\u0438\u0437\u043b\u0438\u0432\u0438\u0445 \u0430\u043d\u0456\u043c\u0430\u0446\u0456\u0439 \u043d\u0430\u0434 \\\"\u0432\u0431\u0438\u0442\u0438\u043c\u0438\\\" \u0433\u0440\u0430\u0432\u0446\u044f\u043c\u0438, \u0441\u043f\u0430\u043c \u043e\u0431\u0440\u0430\u0437\u0430\u043c\u0438.\",\"punishment\":\"Mute 60-120 \u0445\u0432\u0438\u043b\u0438\u043d / Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432\",\"id\":\"3.7\",\"text\":\"\u042f\u043a\u0449\u043e \u0432\u0438\u043f\u0430\u0434\u043a\u043e\u0432\u0438\u0439 \u043a\u043e\u043d\u0444\u043b\u0456\u043a\u0442 \u043f\u0435\u0440\u0435\u0440\u043e\u0441\u0442\u0430\u0454 \u0443 \u043c\u0430\u0441\u043e\u0432\u0443 \u0441\u0443\u0442\u0438\u0447\u043a\u0443 (5+ \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0437 \u043a\u043e\u0436\u043d\u043e\u0457 \u0441\u0442\u043e\u0440\u043e\u043d\u0438) \u0443 \u043c\u0435\u0436\u0430\u0445 \u043c\u0456\u0441\u0442\u0430, \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0438 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0456 \u043f\u0440\u0438\u043f\u0438\u043d\u0438\u0442\u0438 \u0432\u043e\u0433\u043e\u043d\u044c \u0442\u0430 \u043f\u0435\u0440\u0435\u043d\u0435\u0441\u0442\u0438 \u0437'\u044f\u0441\u0443\u0432\u0430\u043d\u043d\u044f \u0441\u0442\u043e\u0441\u0443\u043d\u043a\u0456\u0432 \u0443 \u0434\u043e\u0437\u0432\u043e\u043b\u0435\u043d\u0456 \u0431\u0435\u0437\u043b\u044e\u0434\u043d\u0456 \u0437\u043e\u043d\u0438.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d \u0443\u0441\u0456\u043c \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0430\u043c\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432\",\"id\":\"3.8\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043e\u0431'\u0454\u0434\u043d\u0443\u0432\u0430\u0442\u0438\u0441\u044f \u0437 \u0456\u043d\u0448\u0438\u043c\u0438 \u0441\u0456\u043c'\u044f\u043c\u0438 \u0434\u043b\u044f \u043c\u0430\u0441\u043e\u0432\u043e\u0433\u043e \u0441\u0430\u0431\u043e\u0442\u0430\u0436\u0443 \u0456\u0433\u0440\u043e\u0432\u043e\u0433\u043e \u043f\u0440\u043e\u0446\u0435\u0441\u0443: \u0446\u0456\u043b\u0435\u0441\u043f\u0440\u044f\u043c\u043e\u0432\u0430\u043d\u043e\u0433\u043e \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043f\u0440\u0430\u0432\u0438\u043b, \u043f\u0435\u0440\u0435\u043a\u0440\u0438\u0442\u0442\u044f \u0434\u043e\u0441\u0442\u0443\u043f\u0443 \u0434\u043e \u0432\u0430\u0436\u043b\u0438\u0432\u0438\u0445 \u043b\u043e\u043a\u0430\u0446\u0456\u0439 (\u0440\u043e\u0431\u0456\u0442, \u0441\u043f\u0430\u0432\u043d\u0456\u0432) \u0430\u0431\u043e \u0437\u0440\u0438\u0432\u0443 \u0440\u043e\u0431\u043e\u0442\u0438 \u0441\u0435\u0440\u0432\u0435\u0440\u0430.\",\"punishment\":\"Jail 120 \u0445\u0432\u0438\u043b\u0438\u043d / \u0414\u043e\u0433\u0430\u043d\u0430 / \u0412\u0438\u0434\u0430\u043b\u0435\u043d\u043d\u044f \u0441\u0456\u043c'\u0457\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432\",\"id\":\"3.9\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0456\u0432\u0435\u043d\u0442\u0438, \u0444\u043b\u0435\u0448\u043c\u043e\u0431\u0438 \u0430\u0431\u043e \u043c\u0430\u0441\u043e\u0432\u0456 \u0430\u043a\u0446\u0456\u0457 \u0432\u0456\u0434 \u0456\u043c\u0435\u043d\u0456 \u0441\u0456\u043c'\u0457, \u044f\u043a\u0456 \u043f\u0440\u043e\u043f\u0430\u0433\u0443\u044e\u0442\u044c \u043d\u0435\u0430\u0434\u0435\u043a\u0432\u0430\u0442\u043d\u0443 \u043f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0443, \u0432\u0456\u0434\u043a\u0440\u0438\u0442\u0438\u0439 \u0431\u0443\u043b\u0456\u043d\u0433 \u0456\u043d\u0448\u0438\u0445 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0430\u0431\u043e \u0437\u0430\u0432\u0434\u0430\u044e\u0442\u044c \u043f\u0440\u044f\u043c\u043e\u0457 \u0440\u0435\u043f\u0443\u0442\u0430\u0446\u0456\u0439\u043d\u043e\u0457 \u0448\u043a\u043e\u0434\u0438 \u043f\u0440\u043e\u0454\u043a\u0442\u0443.\",\"punishment\":\"\u0423\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f / \u0414\u043e\u0433\u0430\u043d\u0430 / \u0412\u0438\u0434\u0430\u043b\u0435\u043d\u043d\u044f \u0441\u0456\u043c'\u0457\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u0423\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432\",\"id\":\"3.10\",\"text\":\"\u041a\u0430\u0442\u0435\u0433\u043e\u0440\u0438\u0447\u043d\u043e \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0432\u0440\u0430\u0437\u043b\u0438\u0432\u043e\u0441\u0442\u0456 \u0433\u0440\u0438 (\u0431\u0430\u0433\u0438, \u0434\u044e\u043f\u0438, \u0447\u0438\u0442\u0438) \u0434\u043b\u044f \u0437\u0431\u0430\u0433\u0430\u0447\u0435\u043d\u043d\u044f, \u0430 \u0442\u0430\u043a\u043e\u0436 \u0437\u0431\u0435\u0440\u0456\u0433\u0430\u0442\u0438 \u0430\u0431\u043e \u043b\u0435\u0433\u0430\u043b\u0456\u0437\u0443\u0432\u0430\u0442\u0438 \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u0435 \u0442\u0430\u043a\u0438\u043c \u0448\u043b\u044f\u0445\u043e\u043c \u043c\u0430\u0439\u043d\u043e \u0447\u0435\u0440\u0435\u0437 \u0444\u0443\u043d\u043a\u0446\u0456\u043e\u043d\u0430\u043b \u0441\u0456\u043c'\u0457 (\u0441\u043a\u043b\u0430\u0434\u0438, \u0431\u0430\u043d\u043a \u0441\u0456\u043c'\u0457, \u0431\u0430\u0433\u0430\u0436\u043d\u0438\u043a\u0438 \u0430\u0432\u0442\u043e\u043f\u0430\u0440\u043a\u0443, \u0442\u043e\u0449\u043e).\",\"punishment\":\"\u0412\u0438\u0434\u0430\u043b\u0435\u043d\u043d\u044f \u0441\u0456\u043c'\u0457 + Ban 30 \u0434\u043d\u0456\u0432 \u0443\u0441\u0456\u043c \u043f\u0440\u0438\u0447\u0435\u0442\u043d\u0438\u043c + \u041f\u043e\u0432\u043d\u0430 \u043a\u043e\u043d\u0444\u0456\u0441\u043a\u0430\u0446\u0456\u044f \u043c\u0430\u0439\u043d\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.1\",\"text\":\"\u0411\u0430\u0437\u043e\u0432\u0430 \u0456\u0454\u0440\u0430\u0440\u0445\u0456\u044f \u0441\u0438\u0441\u0442\u0435\u043c\u043d\u0438\u0445 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0441\u043a\u043b\u0430\u0434\u0430\u0454\u0442\u044c\u0441\u044f \u0437 \u0442\u0440\u044c\u043e\u0445 \u0440\u0456\u0432\u043d\u0456\u0432: \u0423\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f (\u0434\u0440\u0456\u0431\u043d\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f) \u2794 \u0414\u043e\u0433\u0430\u043d\u0430 (\u0441\u0435\u0440\u0435\u0434\u043d\u0456 \u0442\u0430 \u043c\u0430\u0441\u043e\u0432\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f) \u2794 \u0412\u0438\u0434\u0430\u043b\u0435\u043d\u043d\u044f \u0441\u0456\u043c'\u0457 (\u043a\u0440\u0438\u0442\u0438\u0447\u043d\u0456 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f, \u0441\u0430\u0431\u043e\u0442\u0430\u0436).\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.2\",\"text\":\"\u041d\u0430\u043a\u043e\u043f\u0438\u0447\u0435\u043d\u043d\u044f \u0441\u0456\u043c'\u0454\u044e 2 \u0430\u043a\u0442\u0438\u0432\u043d\u0438\u0445 \u0443\u0441\u043d\u0438\u0445 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u044c \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u043d\u043e \u0433\u0435\u043d\u0435\u0440\u0443\u0454 1 \u0414\u043e\u0433\u0430\u043d\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.3\",\"text\":\"\u041c\u0430\u043a\u0441\u0438\u043c\u0430\u043b\u044c\u043d\u0438\u0439 \u0434\u043e\u0433\u0430\u043d \u0434\u043b\u044f \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u0457 \u0441\u0456\u043c'\u0457 \u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u044c 3/3. \u041f\u0440\u0438 \u0434\u043e\u0441\u044f\u0433\u043d\u0435\u043d\u043d\u0456 \u043b\u0456\u043c\u0456\u0442\u0443 \u0456\u043d\u0456\u0446\u0456\u044e\u0454\u0442\u044c\u0441\u044f \u0440\u043e\u0437\u0433\u043b\u044f\u0434 \u043f\u0438\u0442\u0430\u043d\u043d\u044f \u043f\u0440\u043e \u0432\u0438\u0434\u0430\u043b\u0435\u043d\u043d\u044f \u0441\u0456\u043c'\u0457.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.4\",\"text\":\"\u041f\u0440\u0430\u0432\u043e \u0432\u0438\u0434\u0430\u0432\u0430\u0442\u0438 \u0434\u043e\u0433\u0430\u043d\u0438 \u0441\u0456\u043c'\u044f\u043c \u043c\u0430\u0454 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0441\u0442\u0430\u0440\u0448\u0430 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f (\u0432\u0456\u0434 \u043f\u043e\u0441\u0430\u0434\u0438 \u0417\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0430 \u0413\u043e\u043b\u043e\u0432\u043d\u043e\u0433\u043e \u0441\u043b\u0456\u0434\u043a\u0443\u044e\u0447\u043e\u0433\u043e \u0437\u0430 \u043d\u0435\u043b\u0435\u0433\u0430\u043b\u0430\u043c\u0438 \u0456 \u0432\u0438\u0449\u0435) \u0437 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u043e\u044e \u0444\u0456\u043a\u0441\u0430\u0446\u0456\u0454\u044e \u0434\u043e\u043a\u0430\u0437\u0456\u0432 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0443 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e\u043c\u0443 \u0440\u043e\u0437\u0434\u0456\u043b\u0456.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.5\",\"text\":\"\u0423 \u044f\u043a\u043e\u0441\u0442\u0456 \u0434\u043e\u0434\u0430\u0442\u043a\u043e\u0432\u0438\u0445 \u0441\u0430\u043d\u043a\u0446\u0456\u0439 (\u0440\u0430\u0437\u043e\u043c \u0456\u0437 \u0434\u043e\u0433\u0430\u043d\u043e\u044e) \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u043c\u043e\u0436\u0435 \u0437\u0430\u0441\u0442\u043e\u0441\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u043e\u0431\u043c\u0435\u0436\u0435\u043d\u043d\u044f \u0456\u0433\u0440\u043e\u0432\u043e\u0433\u043e \u0444\u0443\u043d\u043a\u0446\u0456\u043e\u043d\u0430\u043b\u0443: \u0441\u0438\u0441\u0442\u0435\u043c\u043d\u0430 \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0430 \u043d\u0430 \u0443\u0447\u0430\u0441\u0442\u044c \u0443 \u0432\u0456\u0439\u043d\u0430\u0445 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441 \u043d\u0430 \u0441\u0442\u0440\u043e\u043a \u0432\u0456\u0434 3 \u0434\u043e 7 \u0434\u043d\u0456\u0432 \u0430\u0431\u043e \u043f\u043e\u0432\u043d\u0435 \u043e\u0431\u043d\u0443\u043b\u0435\u043d\u043d\u044f \u0442\u043e\u0447\u043e\u043a \u043a\u0440\u0438\u0448\u0443\u0432\u0430\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.6\",\"text\":\"\u041e\u0434\u043d\u0435 \u0443\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f \u0430\u0431\u043e \u043e\u0434\u043d\u0430 \u0434\u043e\u0433\u0430\u043d\u0430 \u0430\u0432\u0442\u043e\u043c\u0430\u0442\u0438\u0447\u043d\u043e \u0430\u043d\u0443\u043b\u044e\u044e\u0442\u044c\u0441\u044f \u0447\u0435\u0440\u0435\u0437 7 \u0434\u043d\u0456\u0432 \u0437\u0430 \u0443\u043c\u043e\u0432\u0438 \u043f\u043e\u0432\u043d\u043e\u0457 \u0432\u0456\u0434\u0441\u0443\u0442\u043d\u043e\u0441\u0442\u0456 \u043d\u043e\u0432\u0438\u0445 \u043f\u0456\u0434\u0442\u0432\u0435\u0440\u0434\u0436\u0435\u043d\u0438\u0445 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u044c \u0456 \u0441\u043a\u0430\u0440\u0433 \u043d\u0430 \u0441\u0456\u043c'\u044e \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c \u0446\u044c\u043e\u0433\u043e \u043f\u0435\u0440\u0456\u043e\u0434\u0443. \u0423 \u0432\u0438\u043f\u0430\u0434\u043a\u0443, \u043a\u043e\u043b\u0438 \u0443 \u0441\u0456\u043c'\u0457 \u0430\u043a\u0442\u0438\u0432\u043d\u0456 \u043e\u0434\u043d\u043e\u0447\u0430\u0441\u043d\u043e \u0456 \u0434\u043e\u0433\u0430\u043d\u0438, \u0456 \u0443\u0441\u043d\u0456 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f, \u043f\u0435\u0440\u0448\u0438\u043c\u0438 \u0430\u043d\u0443\u043b\u044e\u044e\u0442\u044c\u0441\u044f \u0434\u043e\u0433\u0430\u043d\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.7\",\"text\":\"\u0421\u0456\u043c'\u044f \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0456\u043d\u0456\u0446\u0456\u044e\u0432\u0430\u0442\u0438 \u0434\u043e\u0441\u0442\u0440\u043e\u043a\u043e\u0432\u0435 \u0437\u043d\u044f\u0442\u0442\u044f \u0441\u0430\u043d\u043a\u0446\u0456\u0439 (\u0423\u0441\u043d\u043e\u0433\u043e \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f \u0430\u0431\u043e \u0414\u043e\u0433\u0430\u043d\u0438) \u0448\u043b\u044f\u0445\u043e\u043c \u043d\u0430\u043a\u043e\u043f\u0438\u0447\u0435\u043d\u043d\u044f \u043d\u0435\u043e\u0431\u0445\u0456\u0434\u043d\u043e\u0457 \u043a\u0456\u043b\u044c\u043a\u043e\u0441\u0442\u0456 \u0431\u0430\u043b\u0456\u0432 \u0430\u0431\u043e \u0432\u0438\u043a\u043e\u043d\u0430\u043d\u043d\u044f \u0446\u0456\u043b\u044c\u043e\u0432\u0438\u0445 \u0437\u0430\u0432\u0434\u0430\u043d\u044c, \u043f\u0435\u0440\u0435\u0434\u0431\u0430\u0447\u0435\u043d\u0438\u0445 \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u044c\u043e\u044e \u0441\u0438\u0441\u0442\u0435\u043c\u043e\u044e \u0441\u0435\u0440\u0432\u0435\u0440\u0430, \u0443 \u0440\u0430\u0437\u0456 \u0457\u0457 \u043d\u0430\u044f\u0432\u043d\u043e\u0441\u0442\u0456.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f.4.7. \u042f\u043a\u0449\u043e \u043d\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0456 \u0432\u0456\u0434\u0441\u0443\u0442\u043d\u044f \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u044f \u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u0437\u043d\u044f\u0442\u0442\u044f \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u044c, \u0437\u043d\u044f\u0442\u0442\u044f \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u0437\u0434\u0456\u0439\u0441\u043d\u044e\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0437\u0430 \u0432\u0441\u0442\u0430\u043d\u043e\u0432\u043b\u0435\u043d\u0438\u043c\u0438 \u043f\u0440\u0430\u0432\u0438\u043b\u0430\u043c\u0438 \u0443 \u0446\u044c\u043e\u043c\u0443 \u043f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u0456.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.8\",\"text\":\"\u0423 \u0440\u0430\u0437\u0456 \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0441\u0456\u043c'\u0454\u044e \u0434\u0440\u0443\u0433\u043e\u0457 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0457 \u0434\u043e\u0433\u0430\u043d\u0438(2/3) \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c \u043e\u0434\u043d\u043e\u0433\u043e \u043a\u0430\u043b\u0435\u043d\u0434\u0430\u0440\u043d\u043e\u0433\u043e \u043c\u0456\u0441\u044f\u0446\u044f, \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u0432 \u043e\u0434\u043d\u043e\u0441\u0442\u043e\u0440\u043e\u043d\u043d\u044c\u043e\u043c\u0443 \u043f\u043e\u0440\u044f\u0434\u043a\u0443 \u0430\u043d\u0443\u043b\u044e\u0454 \u043f\u0440\u0430\u0432\u043e \u0441\u0456\u043c'\u0457 \u043d\u0430 \u043a\u0440\u0438\u0448\u0443\u0432\u0430\u043d\u043d\u044f \u0434\u0432\u043e\u0445 \u043d\u0430\u0439\u043f\u0440\u0438\u0431\u0443\u0442\u043a\u043e\u0432\u0456\u0448\u0438\u0445 \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432, \u044f\u043a\u0456 \u043f\u0435\u0440\u0435\u0431\u0443\u0432\u0430\u044e\u0442\u044c \u043f\u0456\u0434 \u0457\u0445 \u043a\u043e\u043d\u0442\u0440\u043e\u043b\u0435\u043c.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.9\",\"text\":\"\u041b\u0456\u0434\u0435\u0440 \u0441\u0456\u043c'\u0457 \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u043e\u0441\u043a\u0430\u0440\u0436\u0438\u0442\u0438 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 72 \u0433\u043e\u0434\u0438\u043d \u0437 \u043c\u043e\u043c\u0435\u043d\u0442\u0443 \u0439\u043e\u0433\u043e \u0432\u0438\u0434\u0430\u0447\u0456 \u0443 \u0440\u043e\u0437\u0434\u0456\u043b\u0456 \u0441\u043a\u0430\u0440\u0433 \u043d\u0430 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044e.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.10\",\"text\":\"\u0421\u0456\u043c'\u044f \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u043d\u0435 \u0447\u0430\u0441\u0442\u0456\u0448\u0435 \u043e\u0434\u043d\u043e\u0433\u043e \u0440\u0430\u0437\u0443 \u043d\u0430 \u043a\u0430\u043b\u0435\u043d\u0434\u0430\u0440\u043d\u0438\u0439 \u043c\u0456\u0441\u044f\u0446\u044c \u0456\u043d\u0456\u0446\u0456\u044e\u0432\u0430\u0442\u0438 \u0434\u043e\u0441\u0442\u0440\u043e\u043a\u043e\u0432\u0435 \u0437\u043d\u044f\u0442\u0442\u044f \u043e\u0434\u043d\u0456\u0454\u0457 \u0414\u043e\u0433\u0430\u043d\u0438 \u0448\u043b\u044f\u0445\u043e\u043c \u0433\u0435\u043d\u0435\u0440\u0430\u0446\u0456\u0457 \u044f\u043a\u0456\u0441\u043d\u043e\u0433\u043e \u043a\u043e\u043d\u0442\u0435\u043d\u0442\u0443. \u0414\u043b\u044f \u0446\u044c\u043e\u0433\u043e \u0430\u043a\u0442\u0438\u0432\u043d\u0438\u0439 \u0441\u043a\u043b\u0430\u0434 \u0441\u0456\u043c'\u0457 (\u043c\u0456\u043d\u0456\u043c\u0443\u043c 5 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432) \u043f\u043e\u0432\u0438\u043d\u0435\u043d \u0432\u0437\u044f\u0442\u0438 \u0443\u0447\u0430\u0441\u0442\u044c \u0443 \u0413\u043b\u043e\u0431\u0430\u043b\u044c\u043d\u043e\u043c\u0443 RP-\u0437\u0430\u0445\u043e\u0434\u0456 (\u0413\u0420\u041f) \u0432\u0456\u0434 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u0430\u0431\u043e \u0441\u0430\u043c\u043e\u0441\u0442\u0456\u0439\u043d\u043e \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0443\u0432\u0430\u0442\u0438 \u043c\u0430\u0441\u0448\u0442\u0430\u0431\u043d\u0438\u0439 \u0456\u0432\u0435\u043d\u0442 \u0456\u0437 \u0437\u0430\u043b\u0443\u0447\u0435\u043d\u043d\u044f\u043c \u0456\u043d\u0448\u0438\u0445 \u0444\u0440\u0430\u043a\u0446\u0456\u0439 \u0447\u0438 \u0441\u0456\u043c\u0435\u0439.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.11\",\"text\":\"\u0414\u043b\u044f \u0437\u043d\u044f\u0442\u0442\u044f \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u0447\u0435\u0440\u0435\u0437 RP-\u0430\u043a\u0442\u0438\u0432\u043d\u0456\u0441\u0442\u044c, \u043b\u0456\u0434\u0435\u0440 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0438\u0439 \u0437\u0430\u0444\u0456\u043a\u0441\u0443\u0432\u0430\u0442\u0438 \u043f\u0440\u043e\u0446\u0435\u0441 \u0442\u0430 \u043f\u043e\u0434\u0430\u0442\u0438 \u0437\u0430\u043f\u0438\u0442 \u043d\u0430 \u0430\u043c\u043d\u0456\u0441\u0442\u0456\u044e \u0443 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u0438\u0439 \u0440\u043e\u0437\u0434\u0456\u043b Discord.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.12\",\"text\":\"\u0420\u0456\u0448\u0435\u043d\u043d\u044f \u043f\u0440\u043e \u0430\u043d\u0443\u043b\u044e\u0432\u0430\u043d\u043d\u044f \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u0437\u0430 RP-\u0430\u043a\u0442\u0438\u0432\u043d\u0456\u0441\u0442\u044c \u043f\u0440\u0438\u0439\u043c\u0430\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0413\u043e\u043b\u043e\u0432\u043d\u0438\u043c \u0421\u043b\u0456\u0434\u043a\u0443\u044e\u0447\u0438\u043c (\u0413\u0421) \u0430\u0431\u043e \u041a\u0435\u0440\u0456\u0432\u043d\u0438\u0446\u0442\u0432\u043e\u043c \u0441\u0435\u0440\u0432\u0435\u0440\u0430. \u0417\u0430\u044f\u0432\u043a\u0430 \u043c\u043e\u0436\u0435 \u0431\u0443\u0442\u0438 \u0432\u0456\u0434\u0445\u0438\u043b\u0435\u043d\u0430, \u044f\u043a\u0449\u043e \u0443\u0447\u0430\u0441\u0442\u044c \u0441\u0456\u043c'\u0457 \u0431\u0443\u043b\u0430 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0444\u043e\u0440\u043c\u0430\u043b\u044c\u043d\u043e\u044e (\u0434\u043b\u044f \\\"\u0433\u0430\u043b\u043e\u0447\u043a\u0438\\\").\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.13\",\"text\":\"\u0423 \u0440\u0430\u0437\u0456 \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0441\u0456\u043c'\u0454\u044e \u043c\u0430\u043a\u0441\u0438\u043c\u0430\u043b\u044c\u043d\u043e\u0457 \u043a\u0456\u043b\u044c\u043a\u043e\u0441\u0442\u0456 \u0434\u043e\u0433\u0430\u043d (3/3), \u043f\u0440\u043e\u0446\u0435\u0441 \u0457\u0457 \u0441\u0438\u0441\u0442\u0435\u043c\u043d\u043e\u0433\u043e \u0432\u0438\u0434\u0430\u043b\u0435\u043d\u043d\u044f \u043f\u0440\u0438\u0437\u0443\u043f\u0438\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043d\u0430 24 \u0433\u043e\u0434\u0438\u043d\u0438. \u041f\u0440\u043e\u0442\u044f\u0433\u043e\u043c \u0446\u044c\u043e\u0433\u043e \u0447\u0430\u0441\u0443 \u043b\u0456\u0434\u0435\u0440 \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u043e\u0441\u043a\u0430\u0440\u0436\u0438\u0442\u0438 \u0432\u0438\u0434\u0430\u0447\u0443 \u043e\u0441\u0442\u0430\u043d\u043d\u044c\u043e\u0457 (\u0442\u0440\u0435\u0442\u044c\u043e\u0457) \u0434\u043e\u0433\u0430\u043d\u0438 \u0447\u0435\u0440\u0435\u0437 \u0441\u043a\u0430\u0440\u0433\u0443 \u043d\u0430 \u0444\u043e\u0440\u0443\u043c\u0456. \u042f\u043a\u0449\u043e \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c \u0446\u044c\u043e\u0433\u043e 24- \u0433\u043e\u0434\u0438\u043d\u043d\u043e\u0433\u043e \u043f\u0435\u0440\u0456\u043e\u0434\u0443 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0438 \u0441\u0456\u043c'\u0457 \u0441\u043a\u043e\u044e\u044e\u0442\u044c \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f, \u0449\u043e \u0442\u044f\u0433\u043d\u0435 \u0437\u0430 \u0441\u043e\u0431\u043e\u044e \u0432\u0438\u0434\u0430\u0447\u0443 4-\u0457 \u0434\u043e\u0433\u0430\u043d\u0438, \u0441\u0456\u043c'\u044f \u0432\u0438\u0434\u0430\u043b\u044f\u0454\u0442\u044c\u0441\u044f \u043d\u0435\u0433\u0430\u0439\u043d\u043e \u0431\u0435\u0437 \u043f\u0440\u0430\u0432\u0430 \u043d\u0430 \u0431\u0443\u0434\u044c-\u044f\u043a\u0456 \u043f\u043e\u0434\u0430\u043b\u044c\u0448\u0456 \u043e\u0441\u043a\u0430\u0440\u0436\u0435\u043d\u043d\u044f \u0447\u0438 \u0432\u0456\u0434\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u044f.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0441\u0456\u043c\u0435\u0439\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0421\u0456\u043c'\u0407 \u0422\u0430 \u041c\u0435\u0445\u0430\u043d\u0456\u0437\u043c\u0438 \u0407\u0445\",\"id\":\"4.15\",\"text\":\"\u0423 \u0440\u0430\u0437\u0456 \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0441\u0456\u043c'\u0454\u044e 3/3 \u0434\u043e\u0433\u0430\u043d, \u043f\u0440\u043e\u0446\u0435\u0441 \u0432\u0438\u0434\u0430\u043b\u0435\u043d\u043d\u044f \u043f\u0440\u0438\u0437\u0443\u043f\u0438\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043d\u0430 24 \u0433\u043e\u0434\u0438\u043d\u0438 \u0434\u043b\u044f \u043c\u043e\u0436\u043b\u0438\u0432\u043e\u0441\u0442\u0456 \u043e\u0441\u043a\u0430\u0440\u0436\u0435\u043d\u043d\u044f 3-\u0457 \u0434\u043e\u0433\u0430\u043d\u0438 \u0443 \u0440\u043e\u0437\u0434\u0456\u043b\u0456 \u0441\u043a\u0430\u0440\u0433 \u0432 \u0434\u0438\u0441\u043a\u043e\u0440\u0434\u0456. \u041e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f 4-\u0457 \u0434\u043e\u0433\u0430\u043d\u0438 \u0432 \u0446\u0435\u0439 \u043f\u0435\u0440\u0456\u043e\u0434 \u043f\u0440\u0438\u0437\u0432\u043e\u0434\u0438\u0442\u044c \u0434\u043e \u043d\u0435\u0433\u0430\u0439\u043d\u043e\u0433\u043e \u0432\u0438\u0434\u0430\u043b\u0435\u043d\u043d\u044f \u0441\u0456\u043c'\u0457 \u0431\u0435\u0437 \u043f\u0440\u0430\u0432\u0430 \u043d\u0430 \u0432\u0456\u0434\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u044f.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.1\",\"text\":\"\u0412\u0456\u0439\u043d\u0430 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441 \u2014 \u0456\u0433\u0440\u043e\u0432\u0438\u0439 \u043c\u0435\u0445\u0430\u043d\u0456\u0437\u043c \u0437\u043c\u0430\u0433\u0430\u043d\u043d\u044f \u043c\u0456\u0436 \u0441\u0456\u043c'\u044f\u043c\u0438 \u0437\u0430 \u043f\u0440\u0430\u0432\u043e \u0432\u043e\u043b\u043e\u0434\u0456\u043d\u043d\u044f \u0432\u043f\u043b\u0438\u0432\u043e\u043c \u043d\u0430\u0434 \u0431\u0456\u0437\u043d\u0435\u0441\u043e\u043c. \u0423\u0441\u0456 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0438 \u0437\u043e\u0431\u043e\u0432'\u044f\u0437\u0430\u043d\u0456 \u0434\u043e\u0442\u0440\u0438\u043c\u0443\u0432\u0430\u0442\u0438\u0441\u044c \u0446\u0438\u0445 \u043f\u0440\u0430\u0432\u0438\u043b \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c \u0443\u0441\u044c\u043e\u0433\u043e \u0431\u043e\u044e.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.2\",\"text\":\"\u0417\u0430 \u0434\u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f\u043c \u043f\u0440\u0430\u0432\u0438\u043b \u0441\u0442\u0435\u0436\u0430\u0442\u044c \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u043e\u0440\u0438 \u043d\u0435\u043b\u0435\u0433\u0430\u043b\u044c\u043d\u043e\u0433\u043e \u043d\u0430\u043f\u0440\u044f\u043c\u043a\u0443. \u0423\u0441\u0456 \u0441\u043a\u0430\u0440\u0433\u0438 \u0440\u043e\u0437\u0433\u043b\u044f\u0434\u0430\u044e\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u043d\u0438\u043c\u0438 \u0443 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e\u043c\u0443 \u0440\u043e\u0437\u0434\u0456\u043b\u0456 Discord.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.3\",\"text\":\"\u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u0440\u0435\u043a\u043e\u043c\u0435\u043d\u0434\u0443\u0454 \u0444\u0456\u043a\u0441\u0443\u0432\u0430\u0442\u0438 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043d\u0430 \u0432\u0456\u0434\u0435\u043e \u2014 \u0446\u0435 \u0454\u0434\u0438\u043d\u0438\u0439 \u043d\u0430\u0434\u0456\u0439\u043d\u0438\u0439 \u0434\u043e\u043a\u0430\u0437 \u0443 \u0441\u043f\u0456\u0440\u043d\u0438\u0445 \u0441\u0438\u0442\u0443\u0430\u0446\u0456\u044f\u0445.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.4\",\"text\":\"\u042f\u043a\u0449\u043e \u043f\u0456\u0434 \u0447\u0430\u0441 \u043e\u0434\u043d\u043e\u0433\u043e \u0431\u0456\u0437\u0432\u0430\u0440\u0443 \u0441\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0430\u043b\u0430 \u0442\u0440\u0438 \u0430\u0431\u043e \u0431\u0456\u043b\u044c\u0448\u0435 \u0437\u0430\u0444\u0456\u043a\u0441\u043e\u0432\u0430\u043d\u0438\u0445 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u044c \u2014 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u0432\u0438\u043b\u0443\u0447\u0430\u0454 \u043e\u0434\u0438\u043d \u0431\u0456\u0437\u043d\u0435\u0441 \u0446\u0456\u0454\u0457 \u0441\u0456\u043c'\u0457.\",\"punishment\":\"\u22121 \u0431\u0456\u0437\u043d\u0435\u0441\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.5\",\"text\":\"\u042f\u043a\u0449\u043e \u0443\u0447\u0430\u0441\u043d\u0438\u043a \u0441\u0456\u043c'\u0457 \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u0431\u0430\u043d \u0437\u0430 \u0433\u0440\u0443\u0431\u0435 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0431\u0435\u0437\u043f\u043e\u0441\u0435\u0440\u0435\u0434\u043d\u044c\u043e \u043f\u0456\u0434 \u0447\u0430\u0441 \u0431\u0456\u0437\u0432\u0430\u0440\u0443 \u2014 \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u0431\u043e\u044e \u0430\u043d\u0443\u043b\u044e\u0454\u0442\u044c\u0441\u044f, \u0430 \u0441\u0456\u043c'\u044f \u043f\u043e\u0440\u0443\u0448\u043d\u0438\u043a\u0430 \u0432\u0442\u0440\u0430\u0447\u0430\u0454 \u0434\u0432\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\u0438 \u0437\u0430 \u0457\u0445 \u043d\u0430\u044f\u0432\u043d\u043e\u0441\u0442\u0456.\",\"punishment\":\"\u0411\u0430\u043d \u0437\u0430 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f + \u0432\u0442\u0440\u0430\u0442\u0430 \u0434\u0432\u043e\u0445 \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.6\",\"text\":\"\u042f\u043a\u0449\u043e \u0441\u0456\u043c'\u044f \u0441\u0438\u0441\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u043d\u043e \u0443\u0445\u0438\u043b\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0456\u0434 \u0437\u0430\u0445\u0438\u0441\u0442\u0443 \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432 \u2014 \u0434\u0435\u043c\u043e\u043d\u0441\u0442\u0440\u0443\u0454 \u043f\u043e\u0441\u0442\u0456\u0439\u043d\u0443 \u0432\u0456\u0434\u0441\u0443\u0442\u043d\u0456\u0441\u0442\u044c \u043c\u0456\u043d\u0456\u043c\u0443\u043c\u0443 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u043e\u043d\u043b\u0430\u0439\u043d \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 7 \u0434\u043d\u0456\u0432 \u043f\u043e\u0441\u043f\u0456\u043b\u044c \u2014 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u043a\u043e\u043d\u0444\u0456\u0441\u043a\u0443\u0432\u0430\u0442\u0438 \u0457\u0457 \u0431\u0456\u0437\u043d\u0435\u0441\u0438.\",\"punishment\":\"\u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0442\u0438\u0432\u043d\u0430 \u043a\u043e\u043d\u0444\u0456\u0441\u043a\u0430\u0446\u0456\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.7\",\"text\":\"\u0421\u043a\u0430\u0440\u0433\u0438 \u043d\u0430 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u043f\u0440\u0430\u0432\u0438\u043b \u0431\u0456\u0437\u0432\u0430\u0440\u0443 \u043f\u043e\u0434\u0430\u044e\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0443 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u043e\u043c\u0443 \u0440\u043e\u0437\u0434\u0456\u043b\u0456 Discord \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 72 \u0433\u043e\u0434\u0438\u043d \u043f\u0456\u0441\u043b\u044f \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044f \u0431\u043e\u044e. \u0421\u043a\u0430\u0440\u0433\u0438 \u0431\u0435\u0437 \u0434\u043e\u043a\u0430\u0437\u0456\u0432 \u0430\u0431\u043e \u043f\u0456\u0441\u043b\u044f \u0437\u0430\u043a\u0456\u043d\u0447\u0435\u043d\u043d\u044f \u0442\u0435\u0440\u043c\u0456\u043d\u0443 \u2014 \u043d\u0435 \u0440\u043e\u0437\u0433\u043b\u044f\u0434\u0430\u044e\u0442\u044c\u0441\u044f.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.8\",\"text\":\"\u0421\u043a\u0430\u0440\u0433\u0430 \u043c\u0430\u0454 \u043c\u0456\u0441\u0442\u0438\u0442\u0438: \u043d\u0430\u0437\u0432\u0438 \u043e\u0431\u043e\u0445 \u0441\u0456\u043c\u0435\u0439, \u0434\u0430\u0442\u0443 \u0442\u0430 \u0447\u0430\u0441 \u0431\u043e\u044e, \u043e\u043f\u0438\u0441 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0437 \u043f\u043e\u0441\u0438\u043b\u0430\u043d\u043d\u044f\u043c \u043d\u0430 \u043f\u0443\u043d\u043a\u0442 \u043f\u0440\u0430\u0432\u0438\u043b, \u0432\u0456\u0434\u0435\u043e \u0430\u0431\u043e \u0441\u043a\u0440\u0456\u043d\u0448\u043e\u0442\u0438 \u044f\u043a \u0434\u043e\u043a\u0430\u0437\u0438.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.9\",\"text\":\"\u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u0440\u043e\u0437\u0433\u043b\u044f\u0434\u0430\u0454 \u0441\u043a\u0430\u0440\u0433\u0438 \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 24 \u0433\u043e\u0434\u0438\u043d \u0442\u0430 \u043f\u0443\u0431\u043b\u0456\u043a\u0443\u0454 \u0432\u0435\u0440\u0434\u0438\u043a\u0442 \u0443 \u0442\u043e\u043c\u0443 \u0441\u0430\u043c\u043e\u043c\u0443 \u0440\u043e\u0437\u0434\u0456\u043b\u0456.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.10\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0431\u0443\u0434\u044c-\u044f\u043a\u0438\u043c \u0447\u0438\u043d\u043e\u043c \u043f\u0435\u0440\u0435\u0448\u043a\u043e\u0434\u0436\u0430\u0442\u0438 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0430\u043c \u0441\u0456\u043c\u0435\u0439 \u0456\u043d\u0456\u0446\u0456\u044e\u0432\u0430\u0442\u0438 \u0437\u0430\u0445\u043e\u043f\u043b\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0443 (\u0437\u0430\u0431\u0438\u0432\u0430\u0442\u0438 \u0431\u0456\u0437\u0432\u0430\u0440). \u0414\u043e \u043f\u0435\u0440\u0435\u0448\u043a\u043e\u0434\u0436\u0430\u043d\u043d\u044f \u043f\u0440\u0438\u0440\u0456\u0432\u043d\u044e\u0454\u0442\u044c\u0441\u044f: \u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e, \u043d\u0430\u043d\u0435\u0441\u0435\u043d\u043d\u044f \u0443\u0440\u043e\u043d\u0443, \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0434\u043e\u0441\u0442\u0443\u043f\u0443 \u0434\u043e \u0442\u043e\u0447\u043a\u0438 \u0437\u0430\u0431\u0438\u0432\u0443 \u0430\u0431\u043e \u0431\u0443\u0434\u044c-\u044f\u043a\u0456 \u0456\u043d\u0448\u0456 \u0434\u0456\u0457, \u044f\u043a\u0456 \u0437\u0430\u0432\u0430\u0436\u0430\u044e\u0442\u044c \u0433\u0440\u0430\u0432\u0446\u044f\u043c \u0440\u043e\u0437\u043f\u043e\u0447\u0430\u0442\u0438 \u0432\u0456\u0439\u043d\u0443 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d + \u043f\u043e\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.11\",\"text\":\"\u0423 \u0440\u0430\u0437\u0456 \u0437\u0430\u0445\u043e\u043f\u043b\u0435\u043d\u043d\u044f \u043e\u0434\u043d\u0456\u0454\u044e \u0441\u0456\u043c'\u0454\u044e 100% \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432 \u043d\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0456, \u0441\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0443\u0454 3 \u0434\u043e\u0431\u0438 (72 \u0433\u043e\u0434\u0438\u043d\u0438) \u0434\u043b\u044f \u0443\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u043b\u0456\u0434\u0435\u0440\u0441\u0442\u0432\u0430 \u0442\u0430 \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u043f\u0440\u0438\u0431\u0443\u0442\u043a\u0443 \u0437 \u043a\u043e\u043d\u0442\u0440\u043e\u043b\u044c\u043e\u0432\u0430\u043d\u0438\u0445 \u0442\u043e\u0447\u043e\u043a. \u041f\u0456\u0441\u043b\u044f \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044f \u0446\u044c\u043e\u0433\u043e \u0442\u0435\u0440\u043c\u0456\u043d\u0443 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u043f\u0440\u043e\u0432\u043e\u0434\u0438\u0442\u044c \u043f\u0440\u0438\u043c\u0443\u0441\u043e\u0432\u0435 \u043e\u0431\u043d\u0443\u043b\u0435\u043d\u043d\u044f \u043a\u0440\u0438\u0448\u0443\u0432\u0430\u043d\u043d\u044f (\u0432\u0441\u0456 \u0431\u0456\u0437\u043d\u0435\u0441\u0438 \u043f\u0435\u0440\u0435\u0445\u043e\u0434\u044f\u0442\u044c \u0443 \u043d\u0435\u0439\u0442\u0440\u0430\u043b\u044c\u043d\u0438\u0439 \u0441\u0442\u0430\u0442\u0443\u0441) \u0434\u043b\u044f \u0432\u0456\u0434\u043d\u043e\u0432\u043b\u0435\u043d\u043d\u044f \u043a\u043e\u043d\u043a\u0443\u0440\u0435\u043d\u0446\u0456\u0457 \u043d\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0456.\",\"punishment\":\"\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 1.11: \u041f\u0440\u043e\u0442\u044f\u0433\u043e\u043c \u0446\u044c\u043e\u0433\u043e \u0447\u0430\u0441\u0443 \u0456\u043d\u0448\u0456 \u0441\u0456\u043c'\u0457 \u043c\u0430\u044e\u0442\u044c \u043f\u0440\u0430\u0432\u043e \u043f\u0440\u043e\u0434\u043e\u0432\u0436\u0443\u0432\u0430\u0442\u0438 \u0430\u0442\u0430\u043a\u0438 \u043d\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\u0438. \u041e\u0431\u043d\u0443\u043b\u0435\u043d\u043d\u044f \u043d\u0435 \u0432\u043f\u043b\u0438\u0432\u0430\u0454 \u043d\u0430 \u0437\u0430\u0433\u0430\u043b\u044c\u043d\u0443 \u0441\u0442\u0430\u0442\u0438\u0441\u0442\u0438\u043a\u0443 \u043f\u0435\u0440\u0435\u043c\u043e\u0433/\u043f\u043e\u0440\u0430\u0437\u043e\u043a \u0443 \u043f\u043e\u0442\u043e\u0447\u043d\u043e\u043c\u0443 \u0441\u0435\u0437\u043e\u043d\u0456 \u0432\u0456\u0439\u043d\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.12\",\"text\":\"\u0421\u0456\u043c'\u044f \u043c\u0430\u0454 \u043f\u0440\u0430\u0432\u043e \u0432\u0437\u044f\u0442\u0438 \\\"\u043c\u043e\u0440\u043e\u0437\\\" (\u0442\u0438\u043c\u0447\u0430\u0441\u043e\u0432\u0435 \u0437\u0432\u0456\u043b\u044c\u043d\u0435\u043d\u043d\u044f \u0432\u0456\u0434 \u0443\u0447\u0430\u0441\u0442\u0456 \u0443 \u0432\u0456\u0439\u043d\u0430\u0445 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441) \u043d\u0435 \u0431\u0456\u043b\u044c\u0448\u0435 2-\u0445 \u0440\u0430\u0437\u0456\u0432 \u043d\u0430 \u043a\u0430\u043b\u0435\u043d\u0434\u0430\u0440\u043d\u0438\u0439 \u0442\u0438\u0436\u0434\u0435\u043d\u044c. \u041c\u0430\u043a\u0441\u0438\u043c\u0430\u043b\u044c\u043d\u0430 \u0442\u0440\u0438\u0432\u0430\u043b\u0456\u0441\u0442\u044c \u043e\u0434\u043d\u043e\u0433\u043e \u043c\u043e\u0440\u043e\u0437\u0443 - 12 \u0433\u043e\u0434\u0438\u043d.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.13\",\"text\":\"\u0406\u043d\u0442\u0435\u0440\u0432\u0430\u043b \u043c\u0456\u0436 \u0432\u0437\u044f\u0442\u0442\u044f\u043c \u043c\u043e\u0440\u043e\u0437\u0456\u0432 \u0434\u043b\u044f \u043e\u0434\u043d\u0456\u0454\u0457 \u0441\u0456\u043c'\u0457 \u043f\u043e\u0432\u0438\u043d\u0435\u043d \u0441\u0442\u0430\u043d\u043e\u0432\u0438\u0442\u0438 \u043d\u0435 \u043c\u0435\u043d\u0448\u0435 48 \u0433\u043e\u0434\u0438\u043d.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.1\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0431\u0430\u0433\u0438 \u0430\u043d\u0456\u043c\u0430\u0446\u0456\u0439 \u0430\u0431\u043e \u0441\u0442\u0440\u0456\u043b\u044c\u0431\u0438 \u043f\u0440\u043e\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u2014 \u0437\u0431\u0438\u0432\u0438 \u0430\u043d\u0456\u043c\u0430\u0446\u0456\u0439, \u043f\u0440\u0438\u0441\u043a\u043e\u0440\u0435\u043d\u0430 \u0441\u0442\u0440\u0456\u043b\u044c\u0431\u0430, \u0441\u043b\u0430\u0439\u0434\u0438, +C \u043f\u0440\u043e\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0442\u0430 \u043f\u043e\u0434\u0456\u0431\u043d\u0456 \u0442\u0435\u0445\u043d\u0456\u0447\u043d\u0456 \u043f\u0440\u0438\u0439\u043e\u043c\u0438.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d + \u043f\u043e\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.2\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u0445\u043e\u0434\u0438\u0442\u0438 \u0437 \u0433\u0440\u0438 \u043f\u0456\u0434 \u0447\u0430\u0441 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0433\u043e \u0431\u043e\u044e.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.3\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043f\u0435\u0440\u0435\u0445\u043e\u0434\u0438\u0442\u0438 \u0432 AFK \u043f\u0456\u0434 \u0447\u0430\u0441 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0433\u043e \u043e\u0431\u0441\u0442\u0440\u0456\u043b\u0443 \u0430\u0431\u043e \u0431\u043e\u044e.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.4\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e \u0443\u043d\u0438\u043a\u0430\u0442\u0438 \u0431\u043e\u044e \u043f\u0456\u0441\u043b\u044f \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u043f\u0435\u0440\u0435\u0432\u0430\u0433\u0438 \u043f\u043e \u0440\u0430\u0445\u0443\u043d\u043a\u0443 \u2014 \u0445\u043e\u0432\u0430\u0442\u0438\u0441\u044c, \u0431\u0456\u0433\u0430\u0442\u0438 \u043f\u043e \u043a\u0430\u0440\u0442\u0456 \u0430\u0431\u043e \u0437\u0430\u0442\u044f\u0433\u0443\u0432\u0430\u0442\u0438 \u0447\u0430\u0441 \u0434\u043e \u0437\u0430\u0432\u0435\u0440\u0448\u0435\u043d\u043d\u044f \u0442\u0430\u0439\u043c\u0435\u0440\u0430.\",\"punishment\":\"Jail 120 \u0445\u0432\u0438\u043b\u0438\u043d + \u0442\u0435\u0445\u043d\u0456\u0447\u043d\u0430 \u043f\u043e\u0440\u0430\u0437\u043a\u0430\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.5\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0430\u043d\u0442\u0438\u0444\u0440\u0430\u0433 \u2014 \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u0435 \u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u0441\u043e\u044e\u0437\u043d\u0438\u043a\u0430 \u0430\u0431\u043e \u0441\u0430\u043c\u043e\u0433\u0443\u0431\u0441\u0442\u0432\u043e \u0437 \u043c\u0435\u0442\u043e\u044e \u043d\u0435 \u0432\u0456\u0434\u0434\u0430\u0442\u0438 \u0444\u0440\u0430\u0433 \u0432\u043e\u0440\u043e\u0436\u0456\u0439 \u0441\u0442\u043e\u0440\u043e\u043d\u0456.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.6\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0437\u0430\u0439\u043c\u0430\u0442\u0438 \u0431\u0443\u0434\u044c-\u044f\u043a\u0456 \u0432\u0438\u0441\u043e\u0442\u043d\u0456 \u043f\u043e\u0437\u0438\u0446\u0456\u0457, \u0449\u043e \u043d\u0435 \u043d\u0430\u043b\u0435\u0436\u0430\u0442\u044c \u0434\u043e \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0433\u043e \u0440\u0456\u0432\u043d\u044f \u0437\u0435\u043c\u043b\u0456 \u0437\u043e\u043d\u0438 \u0431\u0456\u0437\u0432\u0430\u0440\u0443.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d + \u043f\u043e\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 2.6: \u0411\u0456\u0439 \u043c\u0430\u0454 \u043f\u0440\u043e\u0445\u043e\u0434\u0438\u0442\u0438 \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0432 \u043e\u0434\u043d\u0456\u0439 \u043f\u043b\u043e\u0449\u0438\u043d\u0456 (\u043d\u0430 \u0437\u0435\u043c\u043b\u0456). \u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0437\u043d\u0430\u0445\u043e\u0434\u0438\u0442\u0438\u0441\u044c \u043d\u0430 \u0434\u0430\u0445\u0430\u0445, \u043c\u043e\u0441\u0442\u0430\u0445, \u0435\u0441\u0442\u0430\u043a\u0430\u0434\u0430\u0445, \u0431\u0443\u0434\u0456\u0432\u0435\u043b\u044c\u043d\u0438\u0445 \u043a\u0440\u0430\u043d\u0430\u0445, \u043a\u043e\u043d\u0442\u0435\u0439\u043d\u0435\u0440\u0430\u0445 \u0442\u043e\u0449\u043e, \u044f\u043a\u0456 \u0437\u043d\u0430\u0445\u043e\u0434\u044f\u0442\u044c\u0441\u044f \u0432\u0438\u0449\u0435 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0457 \u0437\u043e\u043d\u0438 \u043f\u0435\u0440\u0435\u0441\u0442\u0440\u0456\u043b\u043a\u0438. \u042f\u043a\u0449\u043e \u0434\u043b\u044f \u0437\u0430\u043d\u044f\u0442\u0442\u044f \u043f\u043e\u0437\u0438\u0446\u0456\u0457 \u043f\u043e\u0442\u0440\u0456\u0431\u043d\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u043e\u0431\u0445\u0456\u0434\u043d\u0456 \u0448\u043b\u044f\u0445\u0438 \u043f\u043e \u0432\u0438\u0441\u043e\u0442\u0456 \u0430\u0431\u043e \u0441\u0442\u0440\u0438\u0431\u043a\u0438 \u043d\u0430 \u043e\u0431'\u0454\u043a\u0442\u0438 \u0446\u0435 \u0432\u0432\u0430\u0436\u0430\u0454\u0442\u044c\u0441\u044f \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f\u043c. \u0412\u0438\u043d\u044f\u0442\u043a\u043e\u043c \u0454 \u043f\u0440\u0438\u0440\u043e\u0434\u043d\u0456 \u0432\u0438\u0441\u043e\u0447\u0438\u043d\u0438, \u0433\u0430\u0437\u043e\u043d\u0438 \u0442\u0430 \u0435\u043b\u0435\u043c\u0435\u043d\u0442\u0438 \u043d\u0430\u0437\u0435\u043c\u043d\u043e\u0433\u043e \u043b\u0430\u043d\u0434\u0448\u0430\u0444\u0442\u0443.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.7\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0431\u0440\u043e\u043d\u0435\u0436\u0438\u043b\u0435\u0442\u0430 \u043f\u0456\u0434 \u0447\u0430\u0441 \u0431\u0456\u0437\u0432\u0430\u0440\u0443.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d + \u043f\u043e\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.8\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u043c\u0430\u0441\u043a\u0438 \u043f\u0456\u0434 \u0447\u0430\u0441 \u0431\u0456\u0437\u0432\u0430\u0440\u0443.\",\"punishment\":\"Jail 90 \u0445\u0432\u0438\u043b\u0438\u043d + \u043f\u043e\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.9\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0437\u043b\u043e\u0432\u0436\u0438\u0432\u0430\u0442\u0438 \u0456\u0433\u0440\u043e\u0432\u0438\u043c\u0438 \u043c\u0435\u0445\u0430\u043d\u0456\u043a\u0430\u043c\u0438, \u0449\u043e \u0434\u0430\u044e\u0442\u044c \u0448\u0442\u0443\u0447\u043d\u0443 \u043f\u0435\u0440\u0435\u0432\u0430\u0433\u0443 \u043d\u0430\u0434 \u0441\u0443\u043f\u0435\u0440\u043d\u0438\u043a\u043e\u043c \u2014 \u043a\u0430\u0439\u0434\u0430\u043d\u043a\u0438 \u0442\u0430 \u0456\u043d\u0448\u0456 \u043f\u043e\u0434\u0456\u0431\u043d\u0456 \u0444\u0443\u043d\u043a\u0446\u0456\u0457.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.10\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 \u0447\u0438\u0442\u0438, \u0431\u0430\u0433\u0438 \u0430\u0431\u043e \u0441\u0442\u043e\u0440\u043e\u043d\u043d\u0454 \u043f\u0440\u043e\u0433\u0440\u0430\u043c\u043d\u0435 \u0437\u0430\u0431\u0435\u0437\u043f\u0435\u0447\u0435\u043d\u043d\u044f, \u0449\u043e \u043d\u0430\u0434\u0430\u0454 \u043f\u0435\u0440\u0435\u0432\u0430\u0433\u0443 \u0432 \u0431\u043e\u044e \u2014 \u0430\u0456\u043c\u0431\u043e\u0442, ESP, \u0442\u0440\u0438\u0433\u0435\u0440\u0431\u043e\u0442, \u043c\u0430\u043a\u0440\u043e\u0441\u0438 \u0442\u043e\u0449\u043e.\",\"punishment\":\"Jail 120 \u0445\u0432\u0438\u043b\u0438\u043d / \u0411\u0430\u043d 30 \u0434\u043d\u0456\u0432 + \u043f\u043e\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 2.10: \u0417\u0430 \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0431\u0430\u0433\u0456\u0432 \u0432\u0438\u0434\u0430\u0454\u0442\u044c\u0441\u044f \u043c\u0456\u0440\u0430 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f - Jail 120 \u0445\u0432\u0438\u043b\u0438\u043d\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.11\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0437\u043c\u0456\u043d\u044e\u0432\u0430\u0442\u0438 \u0444\u0430\u0439\u043b\u0438 \u0433\u0440\u0438, \u0442\u0435\u043a\u0441\u0442\u0443\u0440\u0438 \u0430\u0431\u043e \u043c\u043e\u0434\u0435\u043b\u0456 \u0437 \u043c\u0435\u0442\u043e\u044e \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0442\u0435\u0445\u043d\u0456\u0447\u043d\u043e\u0457 \u043f\u0435\u0440\u0435\u0432\u0430\u0433\u0438 \u0432 \u0431\u043e\u044e.\",\"punishment\":\"\u0411\u0430\u043d 30 \u0434\u043d\u0456\u0432 + \u043f\u043e\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 2.11: \u0414\u043e\u0437\u0432\u043e\u043b\u0435\u043d\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u043e\u0432\u0443\u0432\u0430\u0442\u0438 timecyc \u0434\u043b\u044f \u043d\u0430\u043b\u0430\u0448\u0442\u0443\u0432\u0430\u043d\u043d\u044f \u0432\u0456\u0437\u0443\u0430\u043b\u044c\u043d\u0438\u0445 \u0435\u0444\u0435\u043a\u0442\u0456\u0432. \u0426\u0456 \u0437\u043c\u0456\u043d\u0438 \u043d\u0435 \u0432\u043f\u043b\u0438\u0432\u0430\u044e\u0442\u044c \u043d\u0430 \u0431\u043e\u0439\u043e\u0432\u0456 \u043c\u0435\u0445\u0430\u043d\u0456\u043a\u0438 \u0442\u0430 \u0454 \u0434\u043e\u043f\u0443\u0441\u0442\u0438\u043c\u0438\u043c\u0438.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.12\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u043d\u0435\u0440\u0435\u0430\u043b\u0456\u0441\u0442\u0438\u0447\u043d\u0438\u0445 \u043c\u043e\u0434\u0435\u043b\u0435\u0439 \u043f\u0435\u0440\u0441\u043e\u043d\u0430\u0436\u0456\u0432, \u0430 \u0442\u0430\u043a\u043e\u0436 \u0431\u0443\u0434\u044c-\u044f\u043a\u0438\u0445 \u0441\u043a\u0456\u043d\u0456\u0432, \u0449\u043e \u043d\u0430\u0434\u0430\u044e\u0442\u044c \u0442\u0435\u0445\u043d\u0456\u0447\u043d\u0443 \u043f\u0435\u0440\u0435\u0432\u0430\u0433\u0443 \u043f\u0456\u0434 \u0447\u0430\u0441 \u0441\u0442\u0440\u0456\u043b\u044c\u0431\u0438 \u0447\u0438 \u043f\u0435\u0440\u0435\u043c\u0456\u0449\u0435\u043d\u043d\u044f (\u0437\u043c\u0435\u043d\u0448\u0435\u043d\u0438\u0439 \u0430\u0431\u043e \u043d\u0435\u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442\u043d\u0438\u0439 \u0445\u0456\u0442\u0431\u043e\u043a\u0441, \u0440\u043e\u043b\u0438\u043a\u0438, \u043a\u0430\u0440\u043b\u0438\u043a\u0438, \u0436\u0456\u043d\u043e\u0447\u0456 \u0441\u043a\u0456\u043d\u0438 \u0437 \u043d\u0435\u043f\u0440\u0438\u0440\u043e\u0434\u043d\u0438\u043c\u0438 \u043f\u0440\u043e\u043f\u043e\u0440\u0446\u0456\u044f\u043c\u0438 \u0442\u043e\u0449\u043e)\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d + \u0432\u0438\u043b\u0443\u0447\u0435\u043d\u043d\u044f \u043e\u0434\u043d\u043e\u0433\u043e \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.13\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0437\u0430\u0439\u043c\u0430\u0442\u0438 \u0432\u0430\u0436\u043a\u043e\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u0456 \u043f\u043e\u0437\u0438\u0446\u0456\u0457 (\u0437\u0430\u043a\u0440\u0438\u0442\u0456 \u0434\u0432\u043e\u0440\u0438,\u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0457 \u0437\u0430 \u043f\u0430\u0440\u043a\u0430\u043d\u043e\u043c \u0442\u043e\u0449\u043e), \u0448\u0442\u0443\u0440\u043c \u044f\u043a\u0438\u0445 \u043c\u043e\u0436\u043b\u0438\u0432\u0438\u0439 \u043b\u0438\u0448\u0435 \u0447\u0435\u0440\u0435\u0437 \u0454\u0434\u0438\u043d\u0443 \u0442\u043e\u0447\u043a\u0443 \u0432\u0445\u043e\u0434\u0443 \u0430\u0431\u043e \u0432\u0438\u043c\u0430\u0433\u0430\u0454 \u0432\u0456\u0434 \u0441\u0443\u043f\u0440\u043e\u0442\u0438\u0432\u043d\u0438\u043a\u0430 \u043e\u0431\u043e\u0432'\u044f\u0437\u043a\u043e\u0432\u043e\u0433\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0430\u043d\u0456\u043c\u0430\u0446\u0456\u0457 \u0441\u0442\u0440\u0438\u0431\u043a\u0430/\u043f\u0435\u0440\u0435\u043b\u0430\u0437\u0456\u043d\u043d\u044f.\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d + \u0432\u0438\u043b\u0443\u0447\u0435\u043d\u043d\u044f \u043e\u0434\u043d\u043e\u0433\u043e \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.14\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u0437\u0430 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0454\u044e \u043f\u0440\u043e\u0432\u0435\u0434\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u0432\u0430\u0440\u0443.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.15\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0430\u043a\u0441\u0435\u0441\u0443\u0430\u0440\u0456\u0432 \u044f\u043a\u0456 \u043c\u043e\u0436\u043d\u0430 \u0441\u0438\u0441\u0442\u0435\u043c\u043d\u043e \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u0442\u0438 (\u041d\u0430\u043f\u0440\u0438\u043a\u043b\u0430\u0434 \u0434\u0440\u043e\u043d\u0438)\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d + \u043f\u043e\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041f\u043e\u0432\u0435\u0434\u0456\u043d\u043a\u0430 \u041f\u0456\u0434 \u0427\u0430\u0441 \u0411\u043e\u044e\",\"id\":\"2.16\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0446\u0456\u043b\u0435\u0441\u043f\u0440\u044f\u043c\u043e\u0432\u0430\u043d\u0435 \u043f\u0435\u0440\u0435\u0441\u043b\u0456\u0434\u0443\u0432\u0430\u043d\u043d\u044f \u043e\u043f\u043e\u043d\u0435\u043d\u0442\u0456\u0432 \u043d\u0430 \u0441\u0442\u0430\u0434\u0456\u0457 \u043f\u0456\u0434\u0433\u043e\u0442\u043e\u0432\u043a\u0438 \u0434\u043e \u0431\u0456\u0437\u0432\u0430\u0440\u0443.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430: \u041f\u0456\u0434 \u043f\u0435\u0440\u0435\u0441\u043b\u0456\u0434\u0443\u0432\u0430\u043d\u043d\u044f\u043c \u043c\u0430\u0454\u0442\u044c\u0441\u044f \u043d\u0430 \u0443\u0432\u0430\u0437\u0456 \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u0435 \u0441\u043b\u0456\u0434\u0443\u0432\u0430\u043d\u043d\u044f (\\\"\u0445\u0432\u0456\u0441\u0442\\\") \u0437\u0430 \u0433\u0440\u0430\u0432\u0446\u044f\u043c\u0438 \u0432\u043e\u0440\u043e\u0436\u043e\u0457 \u0441\u0456\u043c'\u0457. \u0417\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u043e \u0431\u0456\u0433\u0430\u0442\u0438 \u0437\u0430 \u0441\u0443\u043f\u0435\u0440\u043d\u0438\u043a\u043e\u043c \u0437 \u043c\u0435\u0442\u043e\u044e \u0440\u043e\u0437\u043a\u0440\u0438\u0442\u0442\u044f \u0439\u043e\u0433\u043e \u043f\u043e\u0437\u0438\u0446\u0456\u0457, \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0432\u0438\u0445\u043e\u0434\u0443 \u0430\u0431\u043e \u043f\u0456\u0434\u0433\u043e\u0442\u043e\u0432\u043a\u0438 \u0434\u043e \u0441\u0442\u0440\u0456\u043b\u044c\u0431\u0438 \u0432\u043f\u0440\u0438\u0442\u0443\u043b \u043d\u0430 \u043f\u0435\u0440\u0448\u0438\u0445 \u0441\u0435\u043a\u0443\u043d\u0434\u0430\u0445 \u0431\u0456\u0437\u0432\u0430\u0440\u0443.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041c\u0430\u043d\u0456\u043f\u0443\u043b\u044f\u0446\u0456\u0457 \u0417\u0456 \u0421\u043a\u043b\u0430\u0434\u043e\u043c\",\"id\":\"3.1\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0437\u0430\u043b\u0438\u0448\u0430\u0442\u0438 \u0441\u0456\u043c'\u044e \u0430\u0431\u043e \u0432\u0438\u0433\u0430\u043d\u044f\u0442\u0438 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432 \u043f\u0456\u0434 \u0447\u0430\u0441 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0433\u043e \u0431\u0456\u0437\u0432\u0430\u0440\u0443 \u0437 \u043c\u0435\u0442\u043e\u044e \u0443\u043d\u0438\u043a\u043d\u0435\u043d\u043d\u044f \u0441\u043c\u0435\u0440\u0442\u0456 \u0430\u0431\u043e \u0437\u043c\u0435\u043d\u0448\u0435\u043d\u043d\u044f \u0440\u0430\u0445\u0443\u043d\u043a\u0443 \u0444\u0440\u0430\u0433\u0456\u0432.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d + \u043f\u043e\u0432\u0435\u0440\u043d\u0435\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041c\u0430\u043d\u0456\u043f\u0443\u043b\u044f\u0446\u0456\u0457 \u0417\u0456 \u0421\u043a\u043b\u0430\u0434\u043e\u043c\",\"id\":\"3.2\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0441\u0442\u0432\u043e\u0440\u044e\u0432\u0430\u0442\u0438 \u043f\u0456\u0434\u0441\u0442\u0430\u0432\u043d\u0456 \u0441\u0456\u043c'\u0457 \u0434\u043b\u044f \u043d\u0430\u043a\u0440\u0443\u0447\u0443\u0432\u0430\u043d\u043d\u044f \u043f\u0435\u0440\u0435\u043c\u043e\u0433 \u0447\u0435\u0440\u0435\u0437 \u0444\u0456\u043a\u0442\u0438\u0432\u043d\u0456 \u0431\u043e\u0457 \u0437 \u043c\u0435\u0442\u043e\u044e \u043d\u0435\u0447\u0435\u0441\u043d\u043e\u0433\u043e \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432.\",\"punishment\":\"\u0420\u043e\u0437\u0444\u043e\u0440\u043c\u0443\u0432\u0430\u043d\u043d\u044f \u0444\u0435\u0439\u043a\u043e\u0432\u043e\u0457 \u0441\u0456\u043c'\u0457 + \u0414\u043e\u0433\u0430\u043d\u0430 \u0441\u0456\u043c'\u0457, \u044f\u043a\u0430 \u043e\u0442\u0440\u0438\u043c\u0443\u0432\u0430\u043b\u0430 \u043f\u0435\u0440\u0435\u0432\u0430\u0433\u0438 + \u0432\u0438\u043b\u0443\u0447\u0435\u043d\u043d\u044f \u043f\u0440\u0438\u0447\u0435\u0442\u043d\u0438\u0445 \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432 + \u0411\u0430\u043d 15 \u0434\u043d\u0456\u0432 \u043b\u0456\u0434\u0435\u0440\u0443 \u0442\u0430 \u043f\u0440\u0438\u0447\u0435\u0442\u043d\u0438\u043c \u0433\u0440\u0430\u0432\u0446\u044f\u043c]\",\"notes\":\"\u041f\u0440\u0438\u043c\u0456\u0442\u043a\u0430 \u0434\u043e \u043f. 3.2: \u041e\u0437\u043d\u0430\u043a\u0430\u043c\u0438 \u043f\u0456\u0434\u0441\u0442\u0430\u0432\u043d\u043e\u0457 \u0441\u0456\u043c'\u0457 \u043c\u043e\u0436\u0443\u0442\u044c \u0431\u0443\u0442\u0438: \u0456\u0441\u043d\u0443\u0432\u0430\u043d\u043d\u044f \u043c\u0435\u043d\u0448\u0435 14 \u0434\u043d\u0456\u0432, \u043c\u0435\u043d\u0448\u0435 5 \u0430\u043a\u0442\u0438\u0432\u043d\u0438\u0445 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432, \u0432\u0456\u0434\u0441\u0443\u0442\u043d\u0456\u0441\u0442\u044c \u0431\u0443\u0434\u044c-\u044f\u043a\
