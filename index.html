u043e\u0457 \u0456\u043d\u0448\u043e\u0457 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0441\u0442\u0456 \u043d\u0430 \u0441\u0435\u0440\u0432\u0435\u0440\u0456, \u043f\u0456\u0434\u043e\u0437\u0440\u0456\u043b\u0430 \u0441\u0435\u0440\u0456\u044f \u0440\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442\u0456\u0432 \u0437 \u043e\u0434\u043d\u0456\u0454\u044e \u043a\u043e\u043d\u043a\u0440\u0435\u0442\u043d\u043e\u044e \u0441\u0456\u043c'\u0454\u044e. \u0410\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u044f \u043f\u0440\u043e\u0432\u043e\u0434\u0438\u0442\u044c \u0440\u043e\u0437\u0441\u043b\u0456\u0434\u0443\u0432\u0430\u043d\u043d\u044f \u043d\u0430 \u043f\u0456\u0434\u0441\u0442\u0430\u0432\u0456 \u0441\u043a\u0430\u0440\u0433.\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041c\u0430\u043d\u0456\u043f\u0443\u043b\u044f\u0446\u0456\u0457 \u0417\u0456 \u0421\u043a\u043b\u0430\u0434\u043e\u043c\",\"id\":\"3.3\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u0437\u0440\u0438\u0432\u0430\u0442\u0438 \u0447\u0443\u0436\u0438\u0439 \u0431\u0456\u0437\u0432\u0430\u0440 \u2014 \u0437\u0430\u0432\u0434\u0430\u0432\u0430\u0442\u0438 \u0448\u043a\u043e\u0434\u0438 \u0430\u0431\u043e \u0432\u0431\u0438\u0432\u0430\u0442\u0438 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0437 \u043c\u0435\u0442\u043e\u044e \u043f\u0435\u0440\u0435\u0448\u043a\u043e\u0434\u0438\u0442\u0438 \u043f\u0440\u043e\u0432\u0435\u0434\u0435\u043d\u043d\u044e \u0431\u0456\u0437\u0432\u0430\u0440\u0443.\",\"punishment\":\"Jail 60 \u0445\u0432\u0438\u043b\u0438\u043d + \u0432\u0438\u043b\u0443\u0447\u0435\u043d\u043d\u044f \u043e\u0434\u043d\u043e\u0433\u043e \u0431\u0456\u0437\u043d\u0435\u0441\u0443\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u041c\u0430\u043d\u0456\u043f\u0443\u043b\u044f\u0446\u0456\u0457 \u0417\u0456 \u0421\u043a\u043b\u0430\u0434\u043e\u043c\",\"id\":\"3.4\",\"text\":\"\u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e \u0432\u0441\u0442\u0443\u043f\u0430\u0442\u0438 \u0434\u043e \u0441\u0456\u043c'\u0457 \u2014 \u0437 \u043e\u0441\u043d\u043e\u0432\u043d\u043e\u0433\u043e \u0430\u0431\u043e \u0434\u043e\u0434\u0430\u0442\u043a\u043e\u0432\u043e\u0433\u043e \u0430\u043a\u0430\u0443\u043d\u0442\u0443 \u2014 \u0437 \u043c\u0435\u0442\u043e\u044e \u0437\u043b\u0438\u0432\u0443 \u0431\u0456\u0437\u0432\u0430\u0440\u0456\u0432, \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0456 \u0432\u043d\u0443\u0442\u0440\u0456\u0448\u043d\u044c\u043e\u0457 \u0456\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0456\u0457 \u0432\u043e\u0440\u043e\u0436\u0456\u0439 \u0441\u0442\u043e\u0440\u043e\u043d\u0456 \u0430\u0431\u043e \u0431\u0443\u0434\u044c-\u044f\u043a\u043e\u0433\u043e \u0456\u043d\u0448\u043e\u0433\u043e \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e\u0433\u043e \u0437\u0430\u0432\u0434\u0430\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u043e\u0440\u0433\u0430\u043d\u0456\u0437\u0430\u0446\u0456\u0457 \u0437\u0441\u0435\u0440\u0435\u0434\u0438\u043d\u0438.\",\"punishment\":\"\u0411\u0430\u043d 14 \u0434\u043d\u0456\u0432 + \u0432\u0438\u043b\u0443\u0447\u0435\u043d\u043d\u044f \u043f\u0440\u0438\u0447\u0435\u0442\u043d\u0438\u0445 \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432 / \u041f\u043e\u0441\u0442\u0456\u0439\u043d\u0435 \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0443 \u0440\u0430\u0437\u0456 \u043f\u043e\u0432\u0442\u043e\u0440\u0435\u043d\u043d\u044f]\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.1\",\"text\":\"\u0421\u0430\u043d\u043a\u0446\u0456\u0457 \u0446\u044c\u043e\u0433\u043e \u0440\u043e\u0437\u0434\u0456\u043b\u0443 \u043d\u0430\u043a\u043b\u0430\u0434\u0430\u044e\u0442\u044c\u0441\u044f \u043d\u0430 \u0441\u0456\u043c'\u044e \u044f\u043a \u043d\u0430 \u043a\u043e\u043b\u0435\u043a\u0442\u0438\u0432 \u0434\u043e\u0434\u0430\u0442\u043a\u043e\u0432\u043e \u0434\u043e \u0456\u043d\u0434\u0438\u0432\u0456\u0434\u0443\u0430\u043b\u044c\u043d\u0438\u0445 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0456 \u0437\u0430\u0445\u043e\u0434\u0456\u0432 \u0449\u043e\u0434\u043e \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432 \u0456\u0437 \u0440\u043e\u0437\u0434\u0456\u043b\u0456\u0432 1\u20133.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.2\",\"text\":\"\u041f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f \u0432\u0438\u0434\u0430\u044e\u0442\u044c\u0441\u044f \u0441\u043b\u0456\u0434\u043a\u0443\u044e\u0447\u043e\u044e \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0454\u044e \u0432\u0438\u043a\u043b\u044e\u0447\u043d\u043e \u0437\u0430 \u0444\u0430\u043a\u0442\u043e\u043c \u0440\u043e\u0437\u0433\u043b\u044f\u0434\u0443 \u0441\u043a\u0430\u0440\u0433 \u0430\u0431\u043e \u0437\u0430\u0444\u0456\u043a\u0441\u043e\u0432\u0430\u043d\u0438\u0445 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u044c \u0443 \u0433\u0440\u0456.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.3\",\"text\":\"\u0412\u0438\u0434\u0438 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u044c: \u0443\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f (\u043c\u0430\u043a\u0441\u0438\u043c\u0443\u043c 2: 1/2, 2/2) \u0442\u0430 \u0434\u043e\u0433\u0430\u043d\u0430 (\u043c\u0430\u043a\u0441\u0438\u043c\u0443\u043c 3: 1/3, 2/3, 3/3).\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.4\",\"text\":\"\u0421\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f, \u044f\u043a\u0449\u043e \u043f\u0456\u0434 \u0447\u0430\u0441 \u043e\u0434\u043d\u043e\u0433\u043e \u0431\u0456\u0437\u0432\u0430\u0440\u0443 \u0434\u0432\u0430 \u0430\u0431\u043e \u0431\u0456\u043b\u044c\u0448\u0435 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432 \u043e\u0442\u0440\u0438\u043c\u0430\u043b\u0438 \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u043d\u044f (Jail) \u0437\u0430 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0431\u0430\u0437\u043e\u0432\u0438\u0445 \u043f\u0440\u0430\u0432\u0438\u043b (\u043f. 2.1, 2.2, 2.3, 2.4, 2.5, 2.7, 2.8, 2.9, 2.14, 2.15).\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.5\",\"text\":\"\u0421\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u0443\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f, \u044f\u043a\u0449\u043e \u043f\u0456\u0434 \u0447\u0430\u0441 \u043e\u0434\u043d\u043e\u0433\u043e \u0431\u0456\u0437\u0432\u0430\u0440\u0443 \u0434\u0432\u043e\u0454 \u0430\u0431\u043e \u0431\u0456\u043b\u044c\u0448\u0435 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432 \u0441\u0456\u043c'\u0457 \u0437\u0430\u0439\u043c\u0430\u044e\u0442\u044c \u0437\u0430\u0431\u043e\u0440\u043e\u043d\u0435\u043d\u0456 \u0432\u0438\u0441\u043e\u0442\u043d\u0456 \u0447\u0438 \u0432\u0430\u0436\u043a\u043e\u0434\u043e\u0441\u0442\u0443\u043f\u043d\u0456 \u043f\u043e\u0437\u0438\u0446\u0456\u0457 (\u043f. 2.6, 2.13).\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.6\",\"text\":\"\u0421\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f, \u0437\u0430 \u0431\u0443\u0434\u044c-\u044f\u043a\u0456 \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u0456 \u0434\u0456\u0457 (\u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e, \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f \u0434\u043e\u0441\u0442\u0443\u043f\u0443), \u0441\u043f\u0440\u044f\u043c\u043e\u0432\u0430\u043d\u0456 \u043d\u0430 \u043f\u0435\u0440\u0435\u0448\u043a\u043e\u0434\u0436\u0430\u043d\u043d\u044f \u0456\u043d\u0448\u0456\u0439 \u0441\u0456\u043c'\u0457 \u0437\u0430\u0431\u0438\u0442\u0438 \u0431\u0456\u0437\u0432\u0430\u0440 (\u043f. 1.10).\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.7\",\"text\":\"\u0421\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u0443\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f, \u044f\u043a\u0449\u043e \u043b\u0456\u0434\u0435\u0440 \u0430\u0431\u043e \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a \u0432\u0438\u0433\u0430\u043d\u044f\u0454 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432 \u043f\u0456\u0434 \u0447\u0430\u0441 \u0430\u043a\u0442\u0438\u0432\u043d\u043e\u0433\u043e \u0431\u0456\u0437\u0432\u0430\u0440\u0443 \u0437 \u043c\u0435\u0442\u043e\u044e \u0443\u043d\u0438\u043a\u043d\u0435\u043d\u043d\u044f \u0441\u043c\u0435\u0440\u0442\u0456 \u0447\u0438 \u0437\u043c\u0435\u043d\u0448\u0435\u043d\u043d\u044f \u0440\u0430\u0445\u0443\u043d\u043a\u0443 \u0444\u0440\u0430\u0433\u0456\u0432 (\u043f. 3.1).\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.8\",\"text\":\"\u0421\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u0443\u0441\u043d\u0435 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f, \u044f\u043a\u0449\u043e \u0437\u0430 \u043e\u0434\u0438\u043d \u0431\u0456\u0437\u0432\u0430\u0440 \u043d\u0430 \u043d\u0435\u0457 \u0437\u0430\u0444\u0456\u043a\u0441\u043e\u0432\u0430\u043d\u043e \u0442\u0440\u0438 \u0430\u0431\u043e \u0431\u0456\u043b\u044c\u0448\u0435 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u044c (\u043f. 1.4).\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.9\",\"text\":\"\u0421\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f, \u0437\u0430 \u0437\u0430\u0444\u0456\u043a\u0441\u043e\u0432\u0430\u043d\u0443 \u0443\u0447\u0430\u0441\u0442\u044c \u0434\u0432\u043e\u0445 \u0430\u0431\u043e \u0431\u0456\u043b\u044c\u0448\u0435 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0441\u0456\u043c'\u0457 \u0443 \u0441\u043a\u0456\u043d\u0430\u0445, \u0449\u043e \u043d\u0430\u0434\u0430\u044e\u0442\u044c \u0442\u0435\u0445\u043d\u0456\u0447\u043d\u0443 \u043f\u0435\u0440\u0435\u0432\u0430\u0433\u0443 (\u043f. 2.12).\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.10\",\"text\":\"\u0421\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u0434\u043e\u0433\u0430\u043d\u0443, \u0437\u0430 \u043e\u0442\u0440\u0438\u043c\u0430\u043d\u043d\u044f \u0431\u043b\u043e\u043a\u0443\u0432\u0430\u043d\u043d\u044f (Ban) \u0445\u043e\u0447\u0430 \u0431 \u043e\u0434\u043d\u0438\u043c \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u043e\u043c \u0441\u0456\u043c'\u0457 \u0437\u0430 \u0432\u0438\u043a\u043e\u0440\u0438\u0441\u0442\u0430\u043d\u043d\u044f \u0447\u0438\u0442\u0456\u0432, \u043c\u0430\u043a\u0440\u043e\u0441\u0456\u0432 \u0430\u0431\u043e \u0437\u043c\u0456\u043d\u0443 \u0444\u0430\u0439\u043b\u0456\u0432 \u0433\u0440\u0438 (\u043f. 2.10, 2.11).\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.11\",\"text\":\"\u0421\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u0434\u043e\u0433\u0430\u043d\u0443, \u0437\u0430 \u0434\u043e\u0432\u0435\u0434\u0435\u043d\u0438\u0439 \u0444\u0430\u043a\u0442 \u043d\u0430\u0432\u043c\u0438\u0441\u043d\u043e\u0433\u043e \u0437\u0430\u0441\u0438\u043b\u0430\u043d\u043d\u044f \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u0434\u043e \u0432\u043e\u0440\u043e\u0436\u043e\u0457 \u0441\u0456\u043c'\u0457 \u0437 \u043c\u0435\u0442\u043e\u044e \u0437\u043b\u0438\u0432\u0443 \u0431\u043e\u0457\u0432 \u0447\u0438 \u043f\u0435\u0440\u0435\u0434\u0430\u0447\u0456 \u0456\u043d\u0444\u043e\u0440\u043c\u0430\u0446\u0456\u0457 (\u043f. 3.4). \u0421\u0456\u043c'\u044f, \u0434\u043e \u044f\u043a\u043e\u0457 \u0431\u0443\u0432 \u0437\u0430\u0441\u043b\u0430\u043d\u0438\u0439 \u0433\u0440\u0430\u0432\u0435\u0446\u044c, \u043f\u043e\u043a\u0430\u0440\u0430\u043d\u044c \u0437\u0430 \u0439\u043e\u0433\u043e \u0434\u0456\u0457 \u043d\u0435 \u043e\u0442\u0440\u0438\u043c\u0443\u0454.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.12\",\"text\":\"\u0421\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u0434\u043e\u0433\u0430\u043d\u0443, \u0437\u0430 \u0441\u0438\u0441\u0442\u0435\u043c\u0430\u0442\u0438\u0447\u043d\u0443 \u0432\u0456\u0434\u0441\u0443\u0442\u043d\u0456\u0441\u0442\u044c \u043c\u0456\u043d\u0456\u043c\u0443\u043c\u0443 \u0433\u0440\u0430\u0432\u0446\u0456\u0432 \u043e\u043d\u043b\u0430\u0439\u043d \u0434\u043b\u044f \u0437\u0430\u0445\u0438\u0441\u0442\u0443 \u0431\u0456\u0437\u043d\u0435\u0441\u0456\u0432 \u043f\u0440\u043e\u0442\u044f\u0433\u043e\u043c 7 \u0434\u043d\u0456\u0432 \u043f\u043e\u0441\u043f\u0456\u043b\u044c (\u043f. 1.6). \u0414\u043d\u0456 \u0434\u0456\u0457 \u043c\u043e\u0440\u043e\u0437\u0443 \u043d\u0435 \u0432\u0440\u0430\u0445\u043e\u0432\u0443\u044e\u0442\u044c\u0441\u044f. \u0414\u043e\u0433\u0430\u043d\u0430 \u043d\u0435 \u0441\u043a\u0430\u0441\u043e\u0432\u0443\u0454 \u043f\u0440\u0430\u0432\u0430 \u0430\u0434\u043c\u0456\u043d\u0456\u0441\u0442\u0440\u0430\u0446\u0456\u0457 \u043a\u043e\u043d\u0444\u0456\u0441\u043a\u0443\u0432\u0430\u0442\u0438 \u0431\u0456\u0437\u043d\u0435\u0441\u0438 \u0437\u0430 \u043f. 1.6.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.13\",\"text\":\"\u042f\u043a\u0449\u043e \u0434\u043e\u0432\u0435\u0434\u0435\u043d\u043e, \u0449\u043e \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0432\u0447\u0438\u043d\u0435\u043d\u043e \u0437\u0430 \u043d\u0430\u043a\u0430\u0437\u043e\u043c, \u0434\u043e\u0440\u0443\u0447\u0435\u043d\u043d\u044f\u043c \u0430\u0431\u043e \u0437 \u0437\u0430\u043e\u0445\u043e\u0447\u0435\u043d\u043d\u044f \u043b\u0456\u0434\u0435\u0440\u0430 \u0447\u0438 \u0437\u0430\u0441\u0442\u0443\u043f\u043d\u0438\u043a\u0430, \u0434\u043b\u044f \u0432\u0438\u0434\u0430\u0447\u0456 \u0443\u0441\u043d\u043e\u0433\u043e \u043f\u043e\u043f\u0435\u0440\u0435\u0434\u0436\u0435\u043d\u043d\u044f \u0434\u043e\u0441\u0442\u0430\u0442\u043d\u044c\u043e \u043e\u0434\u043d\u043e\u0433\u043e \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0430.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u043d\u0438 \u0437\u0430 \u0431\u0456\u0437\u043d\u0435\u0441\",\"section\":\"\u0421\u0438\u0441\u0442\u0435\u043c\u0430 \u0421\u0456\u043c\u0435\u0439\u043d\u0438\u0445 \u041f\u043e\u043a\u0430\u0440\u0430\u043d\u044c\",\"id\":\"4.14\",\"text\":\"\u0417\u0430 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f \u0432 \u043c\u0435\u0436\u0430\u0445 \u043e\u0434\u043d\u043e\u0433\u043e \u0431\u0456\u0437\u0432\u0430\u0440\u0443 \u0441\u0456\u043c'\u044f \u043e\u0442\u0440\u0438\u043c\u0443\u0454 \u043d\u0435 \u0431\u0456\u043b\u044c\u0448\u0435 \u043e\u0434\u043d\u0456\u0454\u0457 \u0441\u0430\u043d\u043a\u0446\u0456\u0457 \u0446\u044c\u043e\u0433\u043e \u0440\u043e\u0437\u0434\u0456\u043b\u0443, \u043d\u0430\u0439\u0432\u0438\u0449\u043e\u0433\u043e \u0440\u0456\u0432\u043d\u044f \u0441\u0435\u0440\u0435\u0434 \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u0438\u0445 \u043f\u0443\u043d\u043a\u0442\u0456\u0432.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u0441\u044c\u043a\u043e\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.1\",\"text\":\"\u0421\u043a\u043b\u0430\u0434 \u043f\u0440\u0430\u0446\u044e\u0454 \u0446\u0456\u043b\u043e\u0434\u043e\u0431\u043e\u0432\u043e, \u0431\u0435\u0437 \u0440\u043e\u0437\u043a\u043b\u0430\u0434\u0443 \u0447\u0438 \u0447\u0430\u0441\u043e\u0432\u0438\u0445 \u0432\u0456\u043a\u043e\u043d\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u0441\u044c\u043a\u043e\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.2\",\"text\":\"\u0421\u043a\u043b\u0430\u0434 \u0454 \u043f\u043e\u0441\u0442\u0456\u0439\u043d\u043e\u044e \u0442\u043e\u0447\u043a\u043e\u044e \u043a\u043e\u043d\u0444\u043b\u0456\u043a\u0442\u0443 - \u041c\u0456\u0436 \u0417\u0421\u0423 (\u0442\u0430 \u0456\u043d\u0448\u0438\u043c\u0438 \u0441\u0438\u043b\u043e\u0432\u0438\u043c\u0438 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0430\u043c\u0438) \u0442\u0430 \u0441\u0456\u043c'\u044f\u043c\u0438 \u0431\u043e\u0439\u043e\u0432\u0456 \u0434\u0456\u0457 \u0434\u043e\u0437\u0432\u043e\u043b\u0435\u043d\u0456 \u0431\u0435\u0437 \u0434\u043e\u0434\u0430\u0442\u043a\u043e\u0432\u043e\u0433\u043e RP-\u043f\u0440\u0438\u0432\u043e\u0434\u0443.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u0441\u044c\u043a\u043e\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.3\",\"text\":\"\u041d\u0430 \u0441\u043a\u043b\u0430\u0434\u0456 \u043c\u043e\u0436\u0443\u0442\u044c \u043f\u0435\u0440\u0435\u0431\u0443\u0432\u0430\u0442\u0438 \u043b\u0438\u0448\u0435 \u043f\u0440\u0430\u0446\u0456\u0432\u043d\u0438\u043a\u0438 \u0434\u0435\u0440\u0436\u0430\u0432\u043d\u0438\u0445 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440 \u0430\u0431\u043e \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0438 \u0441\u0456\u043c\u0435\u0439. \u0414\u043b\u044f \u0433\u0440\u0430\u0432\u0446\u0456\u0432, \u0449\u043e \u043d\u0435 \u0432\u0456\u0434\u043d\u043e\u0441\u044f\u0442\u044c\u0441\u044f \u0434\u043e \u0436\u043e\u0434\u043d\u043e\u0457 \u0437 \u0441\u0442\u043e\u0440\u0456\u043d, \u043d\u0430 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0457 \u0441\u043a\u043b\u0430\u0434\u0443 \u0434\u0456\u044e\u0442\u044c \u0447\u0438\u043d\u043d\u0456 \u043f\u0440\u0430\u0432\u0438\u043b\u0430 \u043f\u0440\u043e\u0454\u043a\u0442\u0443. \u041d\u0430\u0442\u043e\u043c\u0456\u0441\u0442\u044c \u043f\u043e \u0432\u0456\u0434\u043d\u043e\u0448\u0435\u043d\u043d\u044e \u0434\u043e \u043d\u0438\u0445 \u0437\u0456 \u0441\u0442\u043e\u0440\u043e\u043d\u0438 \u0443\u0447\u0430\u0441\u043d\u0438\u043a\u0456\u0432 \u0441\u0456\u043c\u0435\u0439 \u0430\u0431\u043e \u043f\u0440\u0430\u0446\u0456\u0432\u043d\u0438\u043a\u0456\u0432 \u0434\u0435\u0440\u0436\u0430\u0432\u043d\u0438\u0445 \u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440, \u043d\u0430 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0457 \u0441\u043a\u043b\u0430\u0434\u0443 \u0434\u0456\u044e\u0442\u044c \u043f\u0440\u0430\u0432\u0438\u043b\u0430, \u0432\u0438\u043a\u043b\u0430\u0434\u0435\u043d\u0456 \u043d\u0438\u0436\u0447\u0435.\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u0441\u044c\u043a\u043e\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443\",\"section\":\"\u0417\u0430\u0433\u0430\u043b\u044c\u043d\u0456 \u041f\u043e\u043b\u043e\u0436\u0435\u043d\u043d\u044f\",\"id\":\"1.4\",\"text\":\"\u0422\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u044f \u0441\u043a\u043b\u0430\u0434\u0443 \u041d\u0415 \u0454 \u0437\u0435\u043b\u0435\u043d\u043e\u044e \u0437\u043e\u043d\u043e\u044e\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u0441\u044c\u043a\u043e\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0411\u043e\u0439\u043e\u0432\u043e\u0457 \u0417\u043e\u043d\u0438\",\"id\":\"2.1\",\"text\":\"\u0422\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0454\u044e \u0441\u043a\u043b\u0430\u0434\u0443 \u0432\u0432\u0430\u0436\u0430\u0454\u0442\u044c\u0441\u044f \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u044f \u043f\u043e\u0437\u043d\u0430\u0447\u0435\u043d\u0430 \u043d\u0430 \u043a\u0430\u0440\u0442\u0456 \u0432\u0456\u0434\u043f\u043e\u0432\u0456\u0434\u043d\u0438\u043c \u043a\u0432\u0430\u0434\u0440\u0430\u0442\u043e\u043c (\u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u044f \u0437\u0430 \u043e\u0433\u043e\u0440\u043e\u0436\u043e\u044e, \u0449\u043e \u0437\u043d\u0430\u0445\u043e\u0434\u0438\u0442\u044c\u0441\u044f \u0443 \u0432\u0456\u0437\u0443\u0430\u043b\u044c\u043d\u043e \u0432\u0438\u0434\u0438\u043c\u043e\u043c\u0443 \u043a\u0432\u0430\u0434\u0440\u0430\u0442\u0456 \u043d\u0430 \u043a\u0430\u0440\u0442\u0456 \u0432\u0441\u0435 \u0449\u0435 \u0432\u0432\u0430\u0436\u0430\u0454\u0442\u044c\u0441\u044f \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0454\u044e \u0441\u043a\u043b\u0430\u0434\u0443).\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u0441\u044c\u043a\u043e\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0411\u043e\u0439\u043e\u0432\u043e\u0457 \u0417\u043e\u043d\u0438\",\"id\":\"2.1.1\",\"text\":\"\u0412\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u0430\u0431\u043e \u043d\u0430\u043d\u0435\u0441\u0435\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u0456\u0437 \u0437\u043e\u043d\u0438 \u0441\u043a\u043b\u0430\u0434\u0443 \u0433\u0440\u0430\u0432\u0446\u044e, \u0449\u043e \u043f\u0435\u0440\u0435\u0431\u0443\u0432\u0430\u0454 \u043f\u043e\u0437\u0430 \u0437\u043e\u043d\u043e\u044e \u0456 \u043d\u0430\u0432\u043f\u0430\u043a\u0438 (\u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u0430\u0431\u043e \u043d\u0430\u043d\u0435\u0441\u0435\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u0437-\u0437\u0430 \u043c\u0435\u0436 \u0441\u043a\u043b\u0430\u0434\u0443 \u0433\u0440\u0430\u0432\u0446\u044e, \u0449\u043e \u0437\u043d\u0430\u0445\u043e\u0434\u0438\u0442\u044c\u044f \u043d\u0430 \u0442\u0435\u0440\u0438\u0442\u043e\u0440\u0456\u0457 \u0441\u043a\u043b\u0430\u0434\u0443) \u0432\u0432\u0430\u0436\u0430\u0454\u0442\u044c\u0441\u044f \u043f\u043e\u0440\u0443\u0448\u0435\u043d\u043d\u044f\u043c - DM\",\"punishment\":\"Jail 30 \u0445\u0432\u0438\u043b\u0438\u043d\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u0441\u044c\u043a\u043e\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0411\u043e\u0439\u043e\u0432\u043e\u0457 \u0417\u043e\u043d\u0438\",\"id\":\"2.2\",\"text\":\"\u041d\u0430 \u0441\u043a\u043b\u0430\u0434\u0456 \u0434\u043e\u0437\u0432\u043e\u043b\u0435\u043d\u043e DM \u0442\u0430 Mass DM (\u043d\u0430\u043d\u0435\u0441\u0435\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u0430\u0431\u043e \u0432\u0431\u0438\u0432\u0441\u0442\u0432\u043e \u0431\u0435\u0437 \u0406\u0421-\u043f\u0440\u0438\u0447\u0438\u043d\u0438) \u0434\u043b\u044f \u0432\u0441\u0456\u0445 \u0441\u0442\u043e\u0440\u0456\u043d\",\"punishment\":\"\",\"notes\":\"\",\"examples\":\"\"},{\"category\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0432\u0456\u0439\u0441\u044c\u043a\u043e\u0432\u043e\u0433\u043e \u0441\u043a\u043b\u0430\u0434\u0443\",\"section\":\"\u041f\u0440\u0430\u0432\u0438\u043b\u0430 \u0411\u043e\u0439\u043e\u0432\u043e\u0457 \u0417\u043e\u043d\u0438\",\"id\":\"2.3\",\"text\":\"\u041d\u0430 \u0441\u043a\u043b\u0430\u0434\u0456 \u0417\u0430\u0431\u043e\u0440\u043e\u043d\u044f\u0454\u0442\u044c\u0441\u044f TK (Team Kill) \u2014 \u0437\u0430\u0432\u0434\u0430\u043d\u043d\u044f \u0448\u043a\u043e\u0434\u0438 \u0430\u0431\u04
