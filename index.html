.brand h1{margin:0;font-size:clamp(24px,4vw,42px);letter-spacing:.5px;line-height:1}
.brand p{margin:7px 0 0;color:#e2f6ff;font-size:14px}
.header-actions{margin-left:auto;display:flex;gap:9px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;font-size:20px;backdrop-filter:blur(12px)}
.search-wrap{position:relative;margin:4px 0 17px}
.search{width:100%;height:58px;padding:0 20px 0 58px;border-radius:30px;border:1px solid rgba(175,240,255,.9);outline:none;background:rgba(4,34,122,.62);color:#fff;box-shadow:0 0 28px rgba(75,210,255,.2),inset 0 0 25px rgba(0,120,255,.15);backdrop-filter:blur(12px)}
.search::placeholder{color:#d7edff}
.search:focus{box-shadow:0 0 0 3px rgba(150,240,255,.18),0 0 32px rgba(90,220,255,.35)}
.search-icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);font-size:24px}
.tabs{display:flex;gap:9px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid rgba(150,235,255,.52);border-radius:22px;padding:10px 16px;color:#fff;background:rgba(7,42,133,.55);backdrop-filter:blur(10px);transition:.2s}
.tab.active{background:linear-gradient(135deg,#70e2ff,#168bff);color:#06245d;border-color:#c5f5ff;box-shadow:0 0 22px rgba(110,225,255,.42);font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0 20px}
.stat{min-height:82px;padding:14px 18px;border:1px solid rgba(174,239,255,.46);border-radius:18px;background:rgba(5,42,133,.44);backdrop-filter:blur(14px);box-shadow:var(--shadow);display:flex;align-items:center;gap:13px}
.stat-icon{font-size:27px}.stat small{display:block;color:#d6efff;font-size:12px}.stat strong{font-size:23px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 11px}
.section-title h2{margin:0;font-size:20px}.section-title span{font-size:12px;color:#d8efff}
.branch{border:1px solid rgba(176,239,255,.68);border-radius:19px;background:linear-gradient(145deg,rgba(8,53,157,.82),rgba(9,73,165,.64));box-shadow:0 10px 28px rgba(0,39,135,.24);margin:10px 0;overflow:hidden;backdrop-filter:blur(12px)}
.branch-head{width:100%;border:0;background:transparent;color:#fff;padding:16px 18px;display:flex;align-items:center;gap:15px;text-align:left}
.num{width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.24),rgba(80,200,255,.12));border:1px solid rgba(190,242,255,.75);font-size:19px;font-weight:900;flex:0 0 auto}
.branch-name{flex:1;min-width:0}.branch-name b{display:block;font-size:17px}.category-prefix{display:inline-block;margin-right:7px;padding:3px 7px;border:1px solid rgba(190,242,255,.62);border-radius:8px;background:rgba(105,220,255,.14);color:#aef1ff;font-size:12px;line-height:1;vertical-align:2px;letter-spacing:.3px}.branch-name small{display:block;color:#cfeeff;margin-top:3px}.chev{font-size:24px;transition:.2s}.branch.open .chev{transform:rotate(180deg)}
.branch-body{display:none;padding:0 14px 14px}.branch.open .branch-body{display:block}

async function loadRules(){
  // Надёжный встроенный набор: приложение работает даже если rules.json
  // не доступен из локального файла.
  if(Array.isArray(EMBEDDED_RULES) && EMBEDDED_RULES.length){
    RULES=EMBEDDED_RULES;
    init();
    return;
  }
  try{
    const res=await fetch('rules.json',{cache:'no-store'});
    if(!res.ok) throw new Error('rules.json '+res.status);
    RULES=await res.json();
  }catch(e){
    try{
      const res=await fetch('https://raw.githubusercontent.com/mashaturta-sudo/verba/main/rules.json',{cache:'no-store'});
      if(!res.ok) throw new Error('GitHub '+res.status);
      RULES=await res.json();
    }catch(err){
      $('#rulesView').innerHTML='<div class="empty">Не вдалося завантажити правила.</div>';
      return;
    }
  }
  init();
}

function init(){
  $('#totalRules').textContent=RULES.length;
  buildTabs();
  render();
}

function buildTabs(){
  const tabs=$('#tabs');
  tabs.innerHTML='';
  const all=document.createElement('button');
  all.className='tab '+(activeCategory==='Усі'?'active':'');
  all.textContent='▦  Усі правила';
  all.onclick=()=>{activeCategory='Усі';viewMode='home';punishmentOnly=false;$('#punishmentBtn')?.classList.remove('active');document.body.classList.remove('category-mode');$('#analysisView').classList.remove('show');$('#rulesView').style.display='block';$('#categoryView').style.display='none';render();buildTabs();window.scrollTo({top:0,behavior:'smooth'})};
  tabs.appendChild(all);
  CATEGORIES.forEach((cat,i)=>{
    const b=document.createElement('button');
    b.className='tab '+(activeCategory===cat?'active':'');
    b.textContent=CATEGORY_ICONS[i]+'  '+cat;
    b.onclick=()=>{activeCategory=cat;viewMode='category';punishmentOnly=false;$('#punishmentBtn')?.classList.remove('active');document.body.classList.add('category-mode');$('#analysisView').classList.remove('show');$('#rulesView').style.display='none';$('#categoryView').style.display='block';render();buildTabs();window.scrollTo({top:0,behavior:'smooth'})};
    tabs.appendChild(b);
  });
}

function ruleDisplayId(r){
  const prefix=CATEGORY_PREFIXES[r.category]||'';
  return prefix ? `${prefix} ${r.id}` : r.id;
}

function filteredRules(){
  const q=normalize($('#search').value.trim());
  return RULES.filter(r=>{
    const catOk=activeCategory==='Усі'||r.category===activeCategory;
    if(!catOk) return false;
    if(punishmentOnly && !String(r.punishment||'').trim()) return false;
    if(!q) return true;
    return [r.id,ruleDisplayId(r),r.text,r.section,r.punishment,r.notes,r.examples,r.category].some(v=>normalize(v).includes(q));
  });
}

function sectionMap(rules){
  const map=new Map();
  rules.forEach(r=>{const key=r.section||'Інші правила';if(!map.has(key))map.set(key,[]);map.get(key).push(r)});
  return map;
}

function render(){
  const rules=filteredRules();
  $('#visibleRules').textContent=rules.length;
  $('#totalSections').textContent=new Set(rules.map(r=>r.section||'Інші правила')).size;

  if(viewMode==='category' && activeCategory!=='Усі'){
    renderCategoryPage(rules);
    return;
  }

  const view=$('#rulesView');
  if(!rules.length){view.innerHTML='<div class="empty">Нічого не знайдено.<br><small>Спробуйте інший номер або ключове слово.</small></div>';return}

  const groups=CATEGORIES.map(c=>[c,rules.filter(r=>r.category===c)]).filter(x=>x[1].length);
  view.innerHTML='';
  groups.forEach(([category,catRules],catIndex)=>{
    const outer=document.createElement('section');
    outer.className='branch';
    const sections=sectionMap(catRules);
    const prefix=CATEGORY_PREFIXES[category]||'';
    outer.innerHTML=`<button class="branch-head"><div class="num">${catIndex+1}</div><div class="branch-name"><b><span class="category-prefix">${escapeHtml(prefix)}</span> ${escapeHtml(category)}</b><small>${catRules.length} ${plural(catRules.length,'правило','правила','правил')}</small></div><div class="chev">⌄</div></button><div class="branch-body"></div>`;
    outer.querySelector('.branch-head').onclick=()=>{
      activeCategory=category;
      viewMode='category';
      punishmentOnly=false;
      $('#punishmentBtn')?.classList.remove('active');
      document.body.classList.add('category-mode');
      $('#rulesView').style.display='none';
      $('#categoryView').style.display='block';
      $('#analysisView').classList.remove('show');
      buildTabs();
      render();
      window.scrollTo({top:0,behavior:'smooth'});
    };
    const body=outer.querySelector('.branch-body');
    sections.forEach((items,section)=>{
      const sub=document.createElement('div');sub.className='subbranch';
      sub.innerHTML=`<button class="sub-head"><b>🪻 ${escapeHtml(section)}</b><span>${items.length}</span><span>⌄</span></button><div class="sub-body"></div>`;
      sub.querySelector('.sub-head').onclick=()=>sub.classList.toggle('open');
      const sb=sub.querySelector('.sub-body');
      items.forEach(r=>{
        const card=document.createElement('article');card.className='rule';
        card.innerHTML=`<div class="rule-top"><span class="rid">${escapeHtml(ruleDisplayId(r))}</span>${r.punishment?`<span class="pun">${escapeHtml(r.punishment)}</span>`:''}</div><div class="rtext">${escapeHtml(r.text)}</div>${(r.notes||r.examples)?`<div class="meta">${r.notes?'<span class="tag">Примітка</span>':''}${r.examples?'<span class="tag">Приклад</span>':''}</div>`:''}`;
        card.onclick=()=>openRule(r);
        sb.appendChild(card);
      });
      body.appendChild(sub);
    });
    view.appendChild(outer);
  });

  if($('#search').value.trim()) document.querySelectorAll('.branch').forEach(b=>b.classList.add('open'));
}

function renderCategoryPage(rules){
  const view=$('#categoryView');
  const cat=activeCategory;
  view.innerHTML='';
  const toolbar=document.createElement('div');
  toolbar.className='category-toolbar';
  toolbar.innerHTML=`<button class="back-btn" id="backToCategories">← До вибору правил</button><div class="category-heading"><b><span class="category-prefix">${escapeHtml(CATEGORY_PREFIXES[cat]||'')}</span> ${escapeHtml(cat)}</b><small>${rules.length} ${plural(rules.length,'правило','правила','правил')}</small></div>`;
  view.appendChild(toolbar);

  if(!rules.length){
    view.insertAdjacentHTML('beforeend','<div class="empty">Нічого не знайдено.<br><small>Спробуйте інший номер або ключове слово.</small></div>');
  } else {
    const sections=sectionMap(rules);
    sections.forEach((items,section)=>{
      const wrap=document.createElement('section');wrap.className='strip-section';
      wrap.innerHTML=`<div class="strip-section-title"><span>🪻</span>${escapeHtml(section)}<span>${items.length} ${plural(items.length,'пункт','пункти','пунктів')}</span></div>`;
      items.forEach(r=>{
        const row=document.createElement('button');row.className='rule-strip';
        row.innerHTML=`<span class="strip-id">${escapeHtml(ruleDisplayId(r))}</span><span class="strip-text">${escapeHtml(r.text)}</span>${r.punishment?`<span class="strip-pun">${escapeHtml(r.punishment)}</span>`:''}`;
        row.onclick=()=>openRule(r);
        wrap.appendChild(row);
      });
      view.appendChild(wrap);
    });
  }
  $('#backToCategories').onclick=()=>{
    activeCategory='Усі';
    punishmentOnly=false;
    $('#punishmentBtn')?.classList.remove('active');
    viewMode='home';
    document.body.classList.remove('category-mode');
    $('#rulesView').style.display='block';
    $('#categoryView').style.display='none';
    $('#analysisView').classList.remove('show');
    buildTabs();
    render();
    window.scrollTo({top:0,behavior:'smooth'});
  };
}

function plural(n,a,b,c){const m=n%10;const t=n%100;return m===1&&t!==11?a:(m>=2&&m<=4&&(t<12||t>14)?b:c)}

function openRule(r){
  $('#modalId').textContent=ruleDisplayId(r);
  $('#modalTitle').textContent=r.section||r.category||'Правило';
  $('#modalText').textContent=r.text||'';
  setBlock('#punishmentBlock','#modalPunishment',r.punishment);
  setBlock('#notesBlock','#modalNotes',r.notes);
  setBlock('#examplesBlock','#modalExamples',r.examples);
  $('#modal').classList.add('show');
}
function setBlock(block,el,val){$(block).style.display=val?'block':'none';$(el).textContent=val||''}

$('#copyRuleBtn').onclick=async()=>{
  const id=$('#modalId').textContent.trim();
  const title=$('#modalTitle').textContent.trim();
  const text=$('#modalText').textContent.trim();
  const punishment=$('#modalPunishment').textContent.trim();
  const notes=$('#modalNotes').textContent.trim();
  const examples=$('#modalExamples').textContent.trim();
  let out=`${id} ${text}`;
  if(punishment) out+=`\n\nПокарання: ${punishment}`;
  if(notes) out+=`\n\nПримітка: ${notes}`;
  if(examples) out+=`\n\nПриклад: ${examples}`;
  try{
    await navigator.clipboard.writeText(out);
  }catch(e){
    const ta=document.createElement('textarea');ta.value=out;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
  }
  const b=$('#copyRuleBtn');
  const old=b.textContent;
  b.textContent='✓ Скопійовано';b.classList.add('copied');
  setTimeout(()=>{b.textContent=old;b.classList.remove('copied')},1400);
};
$('#closeModal').onclick=()=>$('#modal').classList.remove('show');
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('show')});

$('#search').addEventListener('input',render);
$('#infoBtn').onclick=()=>openRule({id:'VERBA RULES',section:'Як користуватися застосунком',text:'Щоб знайти потрібне правило введи перед ним ЗПП, ЗПС і система тобі видасть пункт, або DM, DB, DM GZ і автоматично отримаєш відповідь.\n\nЯкщо ситуація тобі не зрозуміла опиши її в Розбір ситуації і я підберу потрібний пункт.',punishment:'',notes:'',examples:''});
$('#fontBtn').onclick=()=>{fontScale=fontScale===1?1.12:fontScale===1.12?1.25:1;document.documentElement.style.fontSize=(16*fontScale)+'px'};
$('#themeBtn').onclick=()=>{document.body.classList.toggle('dark-theme');};

$('#analysisOpenBtn').onclick=()=>{
  $('#rulesView').style.display='none';
  $('#categoryView').style.display='none';
  $('#analysisView').classList.add('show');
  document.body.classList.remove('category-mode');
  window.scrollTo({top:0,behavior:'smooth'});
};

$('#punishmentBtn').onclick=()=>{
  punishmentOnly=!punishmentOnly;
  activeCategory='Усі';
  viewMode='home';
  document.body.classList.remove('category-mode');
  $('#analysisView').classList.remove('show');
  $('#rulesView').style.display='block';
  $('#categoryView').style.display='none';
  $('#punishmentBtn').classList.toggle('active',punishmentOnly);
  render();
  window.scrollTo({top:0,behavior:'smooth'});
};

$('#analyzeBtn').onclick=()=>{
  const q=normalize($('#situation').value.trim());const out=$('#analysisResult');
  if(!q){out.innerHTML='<div class="empty">Опишіть ситуацію, щоб знайти релевантні правила.</div>';return}
  const words=q.split(/\s+/).filter(w=>w.length>3);
  const scored=RULES.map(r=>{const hay=normalize([r.id,r.text,r.section,r.punishment,r.notes,r.examples].join(' '));let score=0;words.forEach(w=>{if(hay.includes(w))score++});return {r,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,8);
  if(!scored.length){out.innerHTML='<div class="empty">Точних збігів не знайдено.</div>';return}
  out.innerHTML=scored.map(x=>`<div class="match"><b>${escapeHtml(ruleDisplayId(x.r))}</b> · ${escapeHtml(x.r.category)}<br>${escapeHtml(x.r.text)}${x.r.punishment?`<br><small>Покарання: ${escapeHtml(x.r.punishment)}</small>`:''}</div>`).join('');
};
$('#backToRules').onclick=()=>{punishmentOnly=false;$('#punishmentBtn')?.classList.remove('active');$('#analysisView').classList.remove('show');$('#rulesView').style.display='block';$('#categoryView').style.display='none';viewMode='home';activeCategory='Усі';document.body.classList.remove('category-mode');buildTabs();render();window.scrollTo({top:0,behavior:'smooth'})};

window.addEventListener('scroll',()=>$('#topBtn').classList.toggle('show',window.scrollY>500));
$('#topBtn').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
loadRules();
</script>
