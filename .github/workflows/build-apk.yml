name: Build VerbaGuide APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Забираем файлы из репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Создаём Android-проект
      - name: Prepare Android project
        shell: bash
        run: |

          rm -rf app/src/main/java
          rm -rf app/src/main/assets
          rm -rf app/src/main/res/values

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/verba/guide
          mkdir -p app/src/main/res/values

          # HTML приложения
          cp index.html app/src/main/assets/index.html

          # Все правила
          cp rules.json app/src/main/assets/rules.json


          # -----------------------------------------
          # MainActivity
          # -----------------------------------------

          cat > app/src/main/java/com/verba/guide/MainActivity.kt <<'EOF'
          package com.verba.guide

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.graphics.Color
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  WindowCompat.setDecorFitsSystemWindows(window, false)

                  val controller =
                      WindowCompat.getInsetsController(window, window.decorView)

                  controller.hide(
                      WindowInsetsCompat.Type.navigationBars()
                  )

                  controller.systemBarsBehavior =
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE

                  val web = WebView(this)

                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.allowFileAccess = true
                  web.settings.allowContentAccess = true

                  web.webViewClient = WebViewClient()

                  web.setBackgroundColor(Color.TRANSPARENT)

                  web.loadUrl(
                      "file:///android_asset/index.html"
                  )

                  setContentView(web)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {

                  val web =
                      findViewById(android.R.id.content)
                          ?.getChildAt(0) as? WebView

                  if (web != null && web.canGoBack()) {
                      web.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF


          # -----------------------------------------
          # AndroidManifest
          # -----------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="VerbaGuide"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN" />

                          <category
                              android:name="android.intent.category.LAUNCHER" />

                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # -----------------------------------------
          # Стили Android
          # -----------------------------------------

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="AppTheme"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">sans</item>

                  <item name="android:windowLightStatusBar">false</item>

                  <item name="android:statusBarColor">#061A46</item>

                  <item name="android:navigationBarColor">#061A46</item>

                  <item name="android:colorAccent">#20B8FF</item>

                  <item name="android:windowActionModeOverlay">true</item>

              </style>

          </resources>
          EOF


          # -----------------------------------------
          # Gradle properties
          # -----------------------------------------

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF


          # -----------------------------------------
          # settings.gradle.kts
          # -----------------------------------------

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {

              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {

              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VerbaGuide"

          include(":app")
          EOF


          # -----------------------------------------
          # Главный build.gradle.kts
          # -----------------------------------------

          cat > build.gradle.kts <<'EOF'
          plugins {

              id("com.android.application")
                  version "8.7.3"
                  apply false

              id("org.jetbrains.kotlin.android")
                  version "2.0.21"
                  apply false
          }
          EOF


          # -----------------------------------------
          # app/build.gradle.kts
          # -----------------------------------------

          cat > app/build.gradle.kts <<'EOF'
          plugins {

              id("com.android.application")

              id("org.jetbrains.kotlin.android")
          }


          android {

              namespace = "com.verba.guide"

              compileSdk = 35


              defaultConfig {

                  /*
                   * НОВЫЙ ПАКЕТ VERBAGUIDE
                   *
                   * Старый:
                   * com.verba.rules
                   *
                   * Новый:
                   * com.verba.guide
                   */

                  applicationId = "com.verba.guide"

                  minSdk = 23

                  targetSdk = 35

                  versionCode =
                      System.getenv("GITHUB_RUN_NUMBER")
                          ?.toIntOrNull()
                          ?: 1

                  versionName =
                      "1.0.${System.getenv("GITHUB_RUN_NUMBER") ?: "1"}"
              }


              compileOptions {

                  sourceCompatibility =
                      JavaVersion.VERSION_17

                  targetCompatibility =
                      JavaVersion.VERSION_17
              }


              kotlinOptions {

                  jvmTarget = "17"
              }
          }


          dependencies {

              implementation(
                  "androidx.core:core-ktx:1.15.0"
              )
          }
          EOF


      # 3. Устанавливаем Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"


      # 4. Собираем APK
      - name: Build VerbaGuide APK
        run: |
          gradle :app:assembleDebug


      # 5. Загружаем APK
      - name: Upload VerbaGuide APK
        uses: actions/upload-artifact@v4
        with:
          name: VerbaGuide-APK
          path: app/build/outputs/apk/debug/app-debug.apk
