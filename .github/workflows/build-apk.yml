name: Build Verba Rules APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        run: |
          rm -rf app/src/main/java
          rm -rf app/src/main/assets
          rm -rf app/src/main/res/values

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/verba/rules
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html
          cp rules.json app/src/main/assets/rules.json

          cat > app/src/main/java/com/verba/rules/MainActivity.kt <<'EOF'
          package com.verba.rules

          import android.app.Activity
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.graphics.Color
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : Activity() {

              private lateinit var web: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  WindowCompat.setDecorFitsSystemWindows(window, false)

                  val controller = WindowCompat.getInsetsController(window, window.decorView)
                  controller.hide(WindowInsetsCompat.Type.navigationBars())
                  controller.systemBarsBehavior =
                      WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE

                  web = WebView(this)

                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.allowFileAccess = true
                  web.webViewClient = WebViewClient()

                  web.setBackgroundColor(Color.TRANSPARENT)

                  web.loadUrl("file:///android_asset/index.html")

                  setContentView(web)
              }

              @Deprecated("Deprecated in Java")
              override fun onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#009FEF</item>
                  <item name="android:navigationBarColor">#009FEF</item>
                  <item name="android:colorAccent">#00D9FF</item>
                  <item name="android:windowActionModeOverlay">true</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Verba Rules"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VerbaRules"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.verba.rules"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.verba.rules"
                  minSdk = 23
                  targetSdk = 35

                  versionCode =
                      System.getenv("GITHUB_RUN_NUMBER")?.toIntOrNull() ?: 1

                  versionName =
                      "1.0.${System.getenv("GITHUB_RUN_NUMBER") ?: "1"}"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("../verbaguide-release.jks")
                      storePassword = System.getenv("KEYSTORE_PASSWORD")
                      keyAlias = "veraguide"
                      keyPassword = System.getenv("KEY_PASSWORD")
                  }
              }

              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
          }
          EOF

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > verbaguide-release.jks
          test -s verbaguide-release.jks

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VerbaGuide-Signed-APK
          path: app/build/outputs/apk/release/app-release.apk
