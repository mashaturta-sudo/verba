<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VerbaGuide — Результати кураторів</title>
<style>body{font-family:Arial,sans-serif;background:#071c4b;color:#fff;margin:0;padding:24px}.wrap{max-width:1100px;margin:auto}.card{background:#102d67;border:1px solid #3967a8;border-radius:16px;padding:18px;margin:12px 0}input,button{padding:11px;border-radius:10px;border:1px solid #4b79b8}button{cursor:pointer}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.muted{opacity:.7;font-size:13px}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:9px;border-bottom:1px solid #315489;text-align:left;vertical-align:top}@media(max-width:700px){.row{grid-template-columns:1fr 1fr}table{font-size:12px}}</style></head>
<body><div class="wrap"><div class="card"><h1>🛡️ Результати тестування кураторів</h1><div class="row"><input id="api" placeholder="URL Google Apps Script"><input id="token" placeholder="Admin token"><button id="load">Завантажити</button><button id="clear">Очистити</button></div><div id="status" class="muted"></div></div><div id="results"></div></div>
<script>
const $=id=>document.getElementById(id);
$('load').onclick=async()=>{const url=$('api').value.trim(),token=$('token').value.trim();if(!url||!token){$('status').textContent='Вкажи URL і admin token.';return}localStorage.setItem('vg_admin_api',url);localStorage.setItem('vg_admin_token',token);$('status').textContent='Завантаження…';try{const r=await fetch(url+'?action=results&token='+encodeURIComponent(token));const d=await r.json();if(!d.ok)throw new Error(d.error||'API error');render(d.results||[]);$('status').textContent='Завантажено: '+(d.results||[]).length+' тестів.'}catch(e){$('status').textContent='Помилка: '+e.message}};
$('clear').onclick=()=>{$('results').innerHTML='';$('status').textContent=''};
function render(rows){$('results').innerHTML=rows.slice().reverse().map((x,i)=>`<div class="card"><h2>${esc(x.name||'Без імені')} — ${x.score}/${x.total} (${x.percent}%)</h2><div class="muted">${esc(String(x.createdAt||''))}</div><table><tr><th>#</th><th>Правило</th><th>Відповідь</th><th>Категорія</th><th>Результат</th></tr>${(x.answers||[]).map((a,j)=>`<tr><td>${j+1}</td><td>${esc(a.ruleId||'')}</td><td>${esc(a.answer||'—')}</td><td>${esc(a.category||'')}</td><td>${a.correct?'✅':'❌'}</td></tr>`).join('')}</table></div>`).join('')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
$('api').value=localStorage.getItem('vg_admin_api')||'';$('token').value=localStorage.getItem('vg_admin_token')||'';
</script></body></html>
